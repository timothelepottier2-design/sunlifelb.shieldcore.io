<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<style>
/* Meme gabarit que badge_bobcat.html (positions synchronisees avec
   BADGE_LAYOUT dans permis.lua), palette institutionnelle bleu/argent. */

* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
    width: 914px;
    height: 544px;
    background: transparent;
    overflow: hidden;
    font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
}

.card {
    position: relative;
    width: 914px;
    height: 544px;
    border-radius: 22px;
    overflow: hidden;
    background: linear-gradient(135deg, #0f1723 0%, #17243a 48%, #0b111a 100%);
    box-shadow: inset 0 0 0 5px #2f6bb5;
}

.card::before {
    content: "";
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
        118deg,
        rgba(120, 175, 235, 0.05) 0 2px,
        transparent 2px 14px
    );
}

.photo {
    position: absolute;
    left: 4px;
    top: 0;
    width: 250px;
    height: 330px;
    background: rgba(0, 0, 0, 0.35);
    border-right: 3px solid rgba(88, 150, 220, 0.85);
    border-bottom: 3px solid rgba(88, 150, 220, 0.85);
    border-bottom-right-radius: 14px;
}

.header {
    position: absolute;
    left: 274px;
    top: 0;
    right: 0;
    height: 109px;
    padding: 0 26px;
    display: flex;
    align-items: center;
    gap: 18px;
    background: linear-gradient(90deg, #2f6bb5 0%, #234f86 65%, #17365d 100%);
    border-bottom: 3px solid rgba(0, 0, 0, 0.4);
}

.crest {
    flex: 0 0 auto;
    width: 58px;
    height: 66px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0b111a;
    clip-path: polygon(50% 0%, 100% 16%, 100% 62%, 50% 100%, 0% 62%, 0% 16%);
}

.crest span {
    font-size: 22px;
    font-weight: 800;
    color: #cfe2f8;
}

.titles { line-height: 1.15; }

.titles .main {
    font-size: 29px;
    font-weight: 800;
    letter-spacing: 2px;
    color: #fff;
    text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
}

.titles .sub {
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 4px;
    color: rgba(255, 255, 255, 0.85);
    margin-top: 2px;
}

.label {
    position: absolute;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 3px;
    color: #7fb2e8;
    text-transform: uppercase;
    white-space: nowrap;
}

.label::after {
    content: "";
    display: block;
    margin-top: 5px;
    height: 2px;
    background: linear-gradient(90deg, rgba(88, 150, 220, 0.7), rgba(88, 150, 220, 0));
}

.l-name   { left: 288px; top: 128px; }
.l-name::after   { width: 300px; }
.l-birth  { left: 288px; top: 248px; }
.l-birth::after  { width: 130px; }
.l-sex    { left: 512px; top: 248px; }
.l-sex::after    { width: 60px; }
.l-height { left: 640px; top: 248px; }
.l-height::after { width: 60px; }

.watermark {
    position: absolute;
    right: 24px;
    top: 332px;
    font-size: 120px;
    font-weight: 800;
    letter-spacing: -6px;
    color: rgba(120, 175, 235, 0.10);
    line-height: 1;
}

.footer {
    position: absolute;
    left: 0;
    right: 0;
    top: 424px;
    height: 120px;
    padding: 0 30px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: rgba(0, 0, 0, 0.45);
    border-top: 2px solid rgba(88, 150, 220, 0.65);
    font-size: 14px;
    letter-spacing: 3px;
    color: rgba(255, 255, 255, 0.5);
    text-transform: uppercase;
}

.footer .right { color: rgba(127, 178, 232, 0.95); font-weight: 700; }
</style>
</head>
<body>
    <div class="card">
        <div class="photo"></div>

        <div class="header">
            <div class="crest"><span>SA</span></div>
            <div class="titles">
                <div class="main">GOUVERNEMENT</div>
                <div class="sub">ETAT DE SAN ANDREAS</div>
            </div>
        </div>

        <div class="label l-name">Nom &amp; Prenom</div>
        <div class="label l-birth">Naissance</div>
        <div class="label l-sex">Sexe</div>
        <div class="label l-height">Taille</div>

        <div class="watermark">SA</div>

        <div class="footer">
            <span>Matricule</span>
            <span class="right">Fonction publique</span>
        </div>
    </div>
</body>
</html>
