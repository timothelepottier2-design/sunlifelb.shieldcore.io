<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Boutique IG – Maquette</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

</head>
<body class="hidden">
  <div class="overlay-bg"></div>
  <div class="overlay" id="overlay"></div>
  <div class="app" id="app">
    <header class="topbar">
      <div class="brand-block">
        <div class="logo-wrap">
          <img id="serverLogo" class="logo-img" alt="Logo du serveur" />
          <div id="serverLogoFallback" class="logo-fallback">B</div>
        </div>
        <div class="brand-text">
          <div class="name" id="serverName">BOUTIQUE</div>
          <div class="sub" id="brandSub">Boutique officielle</div>
        </div>
      </div>

      <div class="status-row">
        <div id="topContribs" class="tc" role="region" aria-label="Top contributeurs du mois"></div>

        <div class="status-pill vip-pill" id="vipStatusPill">
          <span class="vip-ico" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor">
              <path d="M3 7l4 3 5-6 5 6 4-3-2 12H5L3 7zm3 14h12v2H6z"/>
            </svg>
          </span>
          <span class="lbl">VIP</span>
          <span class="val" id="vipStatusVal">Aucun</span>
        </div>

        <div class="uid-wrap">
          <button id="uidBtn" class="secondary uid-btn" type="button" aria-label="Copier le code boutique">
            <span class="uid-ico" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="14" height="14" fill="none"
                  stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20.6 13.4l-7.2 7.2a2 2 0 0 1-2.8 0l-7.2-7.2a2 2 0 0 1 0-2.8l7.2-7.2a2 2 0 0 1 1.4-.6H18a3 3 0 0 1 3 3v6a2 2 0 0 1-.4 1.6z"/>
                <circle cx="16.5" cy="7.5" r="1.5"/>
              </svg>
            </span>
            <span class="btn-label">Code Boutique</span>
            <span class="mono code" id="uidInline">—</span>
            <span class="sr-only uid mono" id="uidValue">—</span>
          </button>
          <span class="copied" id="uidToast" role="status" aria-live="polite" aria-atomic="true">Copié ✓</span>
        </div>
      </div>

      <div class="actions">
        <button class="primary add-coins" aria-label="Acheter des coins">
          <span class="ac-shine" aria-hidden="true"></span>
          <span class="ac-ico" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none">
              <ellipse cx="12" cy="6" rx="8" ry="2.6" fill="#FFE68A" stroke="#6a3f00" stroke-width="1"/>
              <path d="M4 6v5c0 1.4 3.6 2.6 8 2.6s8-1.2 8-2.6V6" fill="#FFC107" stroke="#6a3f00" stroke-width="1"/>
              <path d="M4 11v5c0 1.4 3.6 2.6 8 2.6s8-1.2 8-2.6v-5" fill="#FFB300" stroke="#6a3f00" stroke-width="1"/>
              <circle cx="19" cy="18.5" r="4" fill="#22c55e" stroke="#0a3d1f" stroke-width="1"/>
              <path d="M19 16.5v4M17 18.5h4" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/>
            </svg>
          </span>
          <span class="ac-label">Acheter des coins</span>
        </button>

        <span class="coin-pill-big" title="Solde de coins">
          <span class="cp-ico" aria-hidden="true">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <defs>
                <radialGradient id="coinGradientHeader" cx="35%" cy="30%" r="75%">
                  <stop offset="0%" stop-color="#FFF6CC"/>
                  <stop offset="55%" stop-color="#FFC107"/>
                  <stop offset="100%" stop-color="#7a4a00"/>
                </radialGradient>
              </defs>
              <circle cx="12" cy="12" r="10" fill="url(#coinGradientHeader)" stroke="#3a2200" stroke-width="1.4"/>
              <circle cx="12" cy="12" r="6.5" fill="none" stroke="#fff3a8" stroke-width="1.2" opacity=".85"/>
              <text x="12" y="16" text-anchor="middle" font-family="Inter,sans-serif" font-weight="800" font-size="9" fill="#5a3500">$</text>
            </svg>
          </span>
          <span class="coin-pill" id="coins">0</span>
          <span class="lbl">Coins</span>
        </span>

        <span class="loyalty-pill-big" title="Points fidélité">
          <span class="lp-ico" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="16" height="16">
              <defs>
                <linearGradient id="loyGrad" x1="0" y1="0" x2="1" y2="1">
                  <stop offset="0%" stop-color="#e0f7ff"/>
                  <stop offset="100%" stop-color="#7dd3fc"/>
                </linearGradient>
              </defs>
              <path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9 6.8 19.6l1-5.8L3.5 9.7l5.9-.9z"
                    fill="url(#loyGrad)" stroke="#0c4a6e" stroke-width="1"/>
            </svg>
          </span>
          <span class="loyalty-pill" id="loyalty">0</span>
          <span class="lbl">Fidélité</span>
        </span>

        <button class="danger" id="closeBtn" title="Fermer" aria-label="Fermer">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M6 6l12 12M18 6l-12 12" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
          </svg>
        </button>
      </div>

      <div class="title" id="title">Boutique</div>
    </header>

    <aside class="sidebar" id="sidebar">
      <nav class="menu" id="menu"></nav>
      <div id="adminMenu" class="admin-slot"></div>
    </aside>

    <main class="content">
      <section class="page" id="page">
        <div class="catalog-header">
          <div>
            <div class="breadcrumbs">Catalogue / <span id="crumb">home</span></div>
            <h2 style="margin:6px 0 0"><span id="pageTitle">Catalogue - home</span></h2>
          </div>

          <div class="daily-top-right">
            <span id="coinOfferInfo" class="coin-offer-info hidden" title="Offre limitée">
              <span class="coi-ico" aria-hidden="true">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none">
                  <ellipse cx="12" cy="6" rx="8" ry="2.6" fill="#FFE68A" stroke="#6a3f00" stroke-width="1"/>
                  <path d="M4 6v5c0 1.4 3.6 2.6 8 2.6s8-1.2 8-2.6V6" fill="#FFC107" stroke="#6a3f00" stroke-width="1"/>
                  <path d="M4 11v5c0 1.4 3.6 2.6 8 2.6s8-1.2 8-2.6v-5" fill="#FFB300" stroke="#6a3f00" stroke-width="1"/>
                </svg>
              </span>
              <span class="coi-text">Vous pouvez doubler votre achat de coins et obtenir <b id="coinOfferInfoAmt">0</b> coins en bonus !</span>
            </span>

            <button id="dailyRefreshBtn" class="refresh-btn">
                <span class="ico" aria-hidden="true">
                    <svg viewBox="0 0 24 24" width="18" height="18"><path d="M12 6v3l4-4-4-4v3a8 8 0 1 0 8 8h-2a6 6 0 1 1-6-6z"></path></svg>
                </span>
                <span class="lbl">Actualiser</span>
            </button>

            <span id="dailyTimer" class="timer-chip hidden">00:00:00</span>
          </div>

          <label class="search">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            <input id="searchInput" placeholder="Rechercher un article..." />
          </label>
        </div>

        <div class="grid" id="grid"></div>
      </section>
    </main>
    <div id="productModal" class="modal">
      <!-- Contenu injecté en JS -->
    </div>
    <div id="dailyPreviewModal" class="modal-root"></div>
    <div id="coinOfferModal" class="modal-root"></div>
  </div>

  <script>
    // --- Config de base
    const buttonsConfigDefault = [
      {page: 'home',      name: 'Daily Store',  icon: 'daily_icon',     sub: 'Offres spéciales quotidiennes', selected: true},
      {page: 'packs',     name: 'Packs',        icon: 'packs_icon',     sub: 'Obtenez des packs exclusifs'},
      {page: 'vehicles',  name: 'Véhicules',    icon: 'vehicles_icon',  sub: 'Bolides et véhicules exclusifs'},
      {page: 'weapons',   name: 'Armes',        icon: 'weapons_icon',   sub: 'Arsenal complet'},
      {page: 'propertys', name: 'Propriétés',   icon: 'propertys_icon', sub: 'Maisons et appartements'},
      {page: 'peds',      name: 'Peds jouables',icon: 'peds_icon',      sub: 'Personnages jouables'},
      {page: 'vip',       name: 'VIP',          icon: 'vip_icon',       sub: 'Devenez un membre VIP'},
      {page: 'animaux',   name: 'Animaux',      icon: 'animaux_icon',   sub: 'Compagnons fidèles'},
      {page: 'weaponacc', name: "Accessoires d'armes", icon: 'weapons_icon', sub: "Personnalisez l'arme en main"},
      {page: 'wishlist',  name: 'Wishlist',     icon: 'wishlist_icon',  sub: 'Vos coups de cœur'},
    ];

    const PAGE_SUBTITLES = {
      home:     'Découvrez les offres du jour',
      packs:    'Obtenez des packs exclusifs',
      vehicles: 'Bolides et véhicules exclusifs',
      weapons:  'Arsenal complet',
      propertys:'Maisons et appartements',
      peds:     'Personnages jouables',
      vip:      'Devenez un membre VIP',
      exclusive:'Réduisez votre temps de farm',
      animaux:  'Compagnons fidèles',
      elite:    'Boutique exclusive Élite',
      fidelite: 'Récompenses fidélité',
      admin:    'Statistiques & gestion',
      weaponacc:"Personnalisez l'arme en main",
      wishlist: 'Vos coups de cœur',
    };

    const FEATURES = {
      tryButton: true,             // ⬅️ bouton "Tester" dans la fiche produit (modal)
      stats: {
        vehicle: false,            // ⬅️ afficher les stats pour les véhicules
        weapon: false              // ⬅️ afficher les stats pour les armes
      }
    };

    const state = {
      isOpen: true,
      coins: 1250,
      avatar: 'https://cdn.discordapp.com/avatars/123456789/avatar.png',
      buttons: buttonsConfigDefault,
      current: 'home',
      // 🔎 Search
      pageItems: [],
      pageTitle: '',
      isAdmin: false,
      isElite: false,
      adminData: [],
      serverName: 'AlyniaRP',
      serverLogo: 'https://cdn.discordapp.com/attachments/1409313917771055124/1410714035246207006/IMG_1210.png?ex=68b20553&is=68b0b3d3&hm=9f027570b8504b0d0e8f12e883112ac1c0dae297dd07610cd992f60e39928b55&',              // URL optionnelle
      uniqueCode: '4564848',              // ex: 'ALY-42X9'
      loyaltyPoints: 12000,            // ex: 120
      pendingSpend: null,
      topContribs: [],
      weaponAcc: { ready: false, weapon: null, id: null, catalog: {}, current: {}, owned: [], reason: null },
    };
    
    state.adminSort = { key: 'id', dir: 'asc' }; // défaut
    // DOM refs
    const menuEl = document.getElementById('menu');
    const gridEl = document.getElementById('grid');
    const coinsEl = document.getElementById('coins');
    const avatarEl = document.getElementById('avatar');
    const titleEl = document.getElementById('title');
    const crumbEl = document.getElementById('crumb');
    const pageTitleEl = document.getElementById('pageTitle');
    const sidebarEl = document.getElementById('sidebar');
    const overlayEl = document.getElementById('overlay');
    const veil = document.querySelector('.overlay-bg');
    const searchInput = document.getElementById('searchInput'); // 🔎
    let dailyInterval = null;
    let dailyRemaining = 0;
    const dailyTimerEl = document.getElementById('dailyTimer');
    const adminFab = document.getElementById('adminFab');
    const adminMenuEl = document.getElementById('adminMenu');

    const serverLogoEl = document.getElementById('serverLogo');
    const serverLogoFallbackEl = document.getElementById('serverLogoFallback');
    const serverNameEl = document.getElementById('serverName');

    const loyaltyEl = document.getElementById('loyalty');
    const uidBtn = document.getElementById('uidBtn');
    const uidValueEl = document.getElementById('uidValue');
    const uidToast = document.getElementById('uidToast');

    const uidInlineEl = document.getElementById('uidInline');

    const isLoyaltyPage = (p = state.current) => ['fidelite','loyalty'].includes(p);

    const dailyPreviewRoot = document.getElementById('dailyPreviewModal');
    const dailyRefreshBtn = document.getElementById('dailyRefreshBtn');

    function openDailyPreviewLoading(){
        if(!dailyPreviewRoot) return;
        dailyPreviewRoot.innerHTML = `
            <div class="dialog" role="dialog" aria-modal="true" style="max-width:780px">
                <div class="header"><div class="title">Prochaine boutique daily</div></div>
                <div class="body">
                    <div class="daily-preview loading">
                        <div class="spinner"></div>
                        <div class="hint">Préparation de la prochaine boutique…</div>
                    </div>
                </div>
                <div class="footer">
                    <button class="gray" id="dpClose">Fermer</button>
                    <button class="primary" id="dpConfirm" disabled>Actualiser</button>
                </div>
            </div>`;
        dailyPreviewRoot.classList.add('show');
        document.getElementById('dpClose').onclick = closeDailyPreview;
        document.getElementById('dpConfirm').onclick = () => {};
    }

    function closeDailyPreview(){
        if(!dailyPreviewRoot) return;
        dailyPreviewRoot.classList.remove('show');
        dailyPreviewRoot.innerHTML = '';
    }

    function renderDailyPreview(payload){
        if(!dailyPreviewRoot) return;
        const items = Array.isArray(payload?.items) ? payload.items : [];
        const cost = Number(payload?.cost||0);
        const can = !!payload?.canRefresh;
        const coins = (state?.coins ?? 0);
        const disabled = (coins < cost) || cost <= 0;

        const grid = items.map((it, i) => {
            const img = resolveImageUrl(it);
            const promoActive = !!(it?.promo?.active);
            const finalPrice = promoActive ? (it?.promo?.priceCoins ?? it.price) : it.price;
            const basePrice = it.price;
            const pct = promoActive ? Number(it?.promo?.percent || 0) : 0;
            return `
                <div class="mini-card" style="animation-delay:${i*55}ms">
                    <div class="thumb">
                        <img src="${img}" alt="" loading="lazy">
                        ${pct > 0 ? `<span class="mc-promo">-${pct}%</span>` : ``}
                    </div>
                    <div class="meta">
                        <div class="name" title="${(it.name||'Produit').replace(/"/g,'&quot;')}">${it.name || 'Produit'}</div>
                        <div class="price-row">
                            ${promoActive && basePrice !== finalPrice
                                ? `<span class="old">${fmt(basePrice)}</span>`
                                : ``}
                            <span class="price">${fmt(finalPrice)}<span class="cur">c</span></span>
                        </div>
                    </div>
                </div>`;
        }).join('');

        dailyPreviewRoot.innerHTML = `
            <div class="dialog bounce-in" role="dialog" aria-modal="true" style="max-width:780px">
                <div class="header">
                    <div class="title">Prochaine boutique daily</div>
                    <div class="pill cost">
                        <span class="ico">
                            <svg viewBox="0 0 24 24" width="16" height="16"><circle cx="12" cy="12" r="10"></circle><text x="12" y="16" text-anchor="middle" font-size="12" fill="currentColor">C</text></svg>
                        </span>
                        <span class="val">${fmt(cost)}</span>
                    </div>
                </div>
                <div class="body">
                    <div class="daily-preview-intro">
                        Voici les <strong>6 produits</strong> qui composeront votre nouvelle boutique daily si vous confirmez.
                    </div>
                    <div class="daily-preview grid">${grid}</div>
                    ${can && coins < cost ? `<div class="warn">Solde insuffisant.</div>` : ``}
                </div>
                <div class="footer">
                    <button class="gray" id="dpClose">Annuler</button>
                    <button class="primary ${disabled?'is-disabled':''}" id="dpConfirm">Payer et actualiser</button>
                </div>
            </div>`;
        dailyPreviewRoot.classList.add('show');
        document.getElementById('dpClose').onclick = closeDailyPreview;
        const ok = document.getElementById('dpConfirm');
        ok.onclick = () => {
            if (ok.classList.contains('is-disabled')) return;
            ok.classList.add('loading');
            ok.disabled = true;
            postToLua('dailyRerollConfirm',{});
        };
    }

    // Ouverture UNIQUEMENT sur clic (plus aucun déclenchement au survol)
    dailyRefreshBtn?.addEventListener('click', () => {
        if (dailyPreviewRoot?.classList.contains('show')) return;
        openDailyPreviewLoading();
        postToLua('dailyPreview',{});
    });

    window.addEventListener('message', (event) => {
        const data = event.data || {};
        if (data.action === 'dailyPreview') {
            renderDailyPreview(data.preview || {});
        }
        if (data.action === 'dailyRerollResult') {
            if (data.ok) {
                closeDailyPreview();
                resetMysteryReveals();
            } else {
                renderDailyPreview({ items: [], cost: 0, canRefresh: false });
            }
        }
    });

    // --- slots / span ------------------------------------------------------------
    function getGridColCount(container = gridEl){
      const cs = getComputedStyle(container);
      const colsStr = cs.getPropertyValue('grid-template-columns') || '';
      const parts = colsStr.split(' ').filter(t => t.trim() && t.trim() !== '/');
      return Math.max(1, parts.length);
    }

    function layoutGridSpans(container = gridEl){
      const cols = getGridColCount(container);
      let col = 1; // position courante dans la ligne (1..cols)

      [...container.children].forEach(card => {
        if (!card.classList.contains('card')) return;

        const wanted = Math.max(1, Math.min(cols, Number(card.dataset.span) || 1));
        let span = wanted;

        // si ça déborde à droite, on fallback à 1 (ton besoin)
        if (col + span - 1 > cols) span = 1;

        card.style.gridColumn = `span ${span}`;
        col += span;
        if (col > cols) col = 1; // nouvelle ligne
      });
    }

    // petit debounce pour le resize
    function debounce(fn, ms=120){
      let t; return (...args)=>{ clearTimeout(t); t=setTimeout(()=>fn(...args), ms); };
    }
    window.addEventListener('resize', debounce(()=>layoutGridSpans(gridEl), 120));

    // Mobile sidebar
    // const hamb = document.getElementById('hamb');
    // hamb.addEventListener('click', () => {
    //   sidebarEl.classList.add('open');
    //   overlayEl.classList.add('show');
    // });
    overlayEl.addEventListener('click', () => {
      sidebarEl.classList.remove('open');
      overlayEl.classList.remove('show');
    });

    function markPendingSpend(currency, amount, ms=2000){
      state.pendingSpend = { currency, amount, until: Date.now() + ms };
    }
    function shouldIgnoreCoinsUpdate(){
      const p = state.pendingSpend;
      return p && p.currency === 'loyalty' && Date.now() < p.until;
    }

    // === Formatage FR (groupes + virgule) ====================
    const NF_INT  = new Intl.NumberFormat('fr-FR');                            // 12 345
    const NF_DEC2 = new Intl.NumberFormat('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2}); // 12 345,67
    const fmt  = (n)=> NF_INT.format(Number(n)||0);
    const fmt2 = (n)=> NF_DEC2.format(Number(n)||0);

    // Utils

    function firstImageKey(it){return it?.hash||it?.itemName||it?.propertyName||it?.animalHash||it?.pedHash||null}
    function resolveImageUrl(it,placeholder){const k=firstImageKey(it);if(k)return `images/${k}.jpg`;return it?.img||placeholder||'https://placehold.co/800x400/png'}
    function attachImgFallback(img,fallback){let used=false;img?.addEventListener('error',()=>{if(used)return;used=true;img.src=fallback})}

    // Lua -> JS ms (seconds => ms). Si déjà en ms, on garde.
    const luaTsToMs = (v) => {
      const n = Number(v) || 0;
      return n > 0 && n < 1e12 ? n * 1000 : n; // < 1e12 ≈ secondes, sinon ms
    };

    // affichage court FR
    const formatLastSale = (v) => {
      const ms = luaTsToMs(v);
      if (!ms) return '';
      const d = new Date(ms);
      return d.toLocaleString('fr-FR', {
        year:'numeric', month:'2-digit', day:'2-digit',
        hour:'2-digit', minute:'2-digit'
      });
    };

    function formatHMS(total){
      const s = Math.max(0, Math.floor(total));
      const h = Math.floor(s/3600);
      const m = Math.floor((s%3600)/60);
      const sec = s%60;
      const pad = (n)=> String(n).padStart(2,'0');
      return `${pad(h)}:${pad(m)}:${pad(sec)}`;
    }

    function initialsFromName(n) {
      return (n || '?').trim().charAt(0).toUpperCase();
    }

    // ===== Icônes rang colorées (SVG) =====
    function rankBadgeSVG(rank, seed = Math.random().toString(36).slice(2)) {
      const g1 = `gradOuter-${seed}-${rank}`;
      const g2 = `gradInner-${seed}-${rank}`;
      const size = '20'; // px

      // 1 = Or (couronne + laurier)
      if (rank === 1) {
        return `
        <svg viewBox="0 0 64 64" width="${size}" height="${size}" aria-hidden="true">
          <defs>
            <radialGradient id="${g1}" cx="50%" cy="35%" r="70%">
              <stop offset="0%"  stop-color="#FFF3B0"/>
              <stop offset="45%" stop-color="#FFD54F"/>
              <stop offset="100%" stop-color="#F6A800"/>
            </radialGradient>
            <radialGradient id="${g2}" cx="50%" cy="40%" r="60%">
              <stop offset="0%"  stop-color="#FFFDE7"/>
              <stop offset="60%" stop-color="#FFE082"/>
              <stop offset="100%" stop-color="#FFC107"/>
            </radialGradient>
          </defs>
          <!-- disque -->
          <circle cx="32" cy="32" r="28" fill="url(#${g1})" stroke="#B87900" stroke-width="2"/>
          <circle cx="32" cy="32" r="18" fill="url(#${g2})" stroke="#FFE082" stroke-width="1.5"/>
          <!-- couronne -->
          <path d="M22 32l4-8 6 6 6-6 4 8z" fill="#9C6F00" opacity=".9"/>
          <rect x="24" y="34" width="16" height="3" rx="1.5" fill="#7a5800"/>
          <!-- laurier -->
          <path d="M15 38c4 5 9 8 17 8s13-3 17-8" fill="none" stroke="#8BC34A" stroke-width="2" stroke-linecap="round"/>
          <path d="M48 37c1.5 0 3 1 4 2-1 1.2-2.5 2.2-4 2.5" fill="none" stroke="#689F38" stroke-width="2" stroke-linecap="round"/>
          <path d="M16 37c-1.5 0-3 1-4 2 1 1.2 2.5 2.2 4 2.5" fill="none" stroke="#689F38" stroke-width="2" stroke-linecap="round"/>
          <!-- #1 -->
          <text x="32" y="41" text-anchor="middle" font-family="Inter, system-ui" font-size="14" fill="#4E342E" font-weight="700">#1</text>
        </svg>`;
      }

      // 2 = Argent (étoile)
      if (rank === 2) {
        return `
        <svg viewBox="0 0 64 64" width="${size}" height="${size}" aria-hidden="true">
          <defs>
            <radialGradient id="${g1}" cx="50%" cy="35%" r="70%">
              <stop offset="0%"  stop-color="#ECEFF1"/>
              <stop offset="50%" stop-color="#CFD8DC"/>
              <stop offset="100%" stop-color="#90A4AE"/>
            </radialGradient>

    async function copyText(text) {
      // 1) Tente l’API moderne si dispo ET contexte sécurisé
      try {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(text);
          return true;
        }
        throw new Error('Clipboard API not available');
      } catch (err) {
        // 2) Fallback legacy
        return legacyCopy(text);
      }
    }

    function legacyCopy(text) {
      return new Promise((resolve, reject) => {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.setAttribute('readonly', '');
        ta.style.position = 'fixed';
        ta.style.top = '-9999px';
        document.body.appendChild(ta);

        const sel = document.getSelection();
        const prevRange = sel && sel.rangeCount ? sel.getRangeAt(0) : null;

        ta.select();
        ta.setSelectionRange(0, ta.value.length);

        let ok = false;
        try { ok = document.execCommand('copy'); } catch(e) { ok = false; }

        document.body.removeChild(ta);
        if (prevRange) { sel.removeAllRanges(); sel.addRange(prevRange); }

        ok ? resolve(true) : reject(new Error('execCommand failed'));
      });
    }

                  <path d="${d}" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

      // Chevron pour la nav
      function chevron(dir='left'){

      function setPermBadge(val){
        const el = document.getElementById('permBadge');
        if (!el) return;
        if (typeof val === 'undefined') {
          el.style.display = 'none';
          el.removeAttribute('data-tooltip');
          el.removeAttribute('aria-label');
          el.innerHTML = '';
          return;

        el.style.display = '';
        el.setAttribute('data-tooltip', val ? 'Permanent' : 'Non permanent');
        el.setAttribute('aria-label', val ? 'Permanent' : 'Non permanent');

      // Construit le bloc stats en fonction du type actuel
      function renderStatsFor(cur){
        const t = (cur?.type || '').toLowerCase();
        const st = cur?.stats || {};
        const bar = (val)=> statBars(val ?? 0);

        // ⛔️ masquages via features
        if (t === 'vehicle' && !FEATURES.stats.vehicle) return '';
        if (t === 'weapon'  && !FEATURES.stats.weapon)  return '';

        if (t === 'vehicle') {
          const has = ['speed','accel','brake','traction','trunk'].some(k=> st[k]!=null);
          if (!has) return '';
          return `
            <div class="vehicle-stats">
              <div class="stat-row"><div class="stat-label">${statIcon('speed')}<span>Vitesse max</span></div>${bar(st.speed)}<div class="stat-value">${st.speed ?? 0}/5</div></div>

              <div class="stat-row"><div class="stat-label">${statIcon('traction')}<span>Traction</span></div>${bar(st.traction)}<div class="stat-value">${st.traction ?? 0}/5</div></div>
              <div class="stat-row"><div class="stat-label">${statIcon('trunk')}<span>Coffre</span></div>${bar(Math.min(5, Math.round((st.trunk||0)/10)))}<div class="stat-value">${st.trunk ?? 0} KG</div></div>
            </div>`;
        }

        if (t === 'weapon') {
          const has = ['damage','cadence','range','ammo','attachments'].some(k=> st[k]!=null);
          if (!has) return '';
          return `
            <div class="weapon-stats">
              <div class="stat-row"><div class="stat-label">${statIcon('damage')}<span>Dégâts</span></div>${bar(st.damage)}<div class="stat-value">${st.damage ?? 0}/5</div></div>
              <div class="stat-row"><div class="stat-label">${statIcon('cadence')}<span>Cadence</span></div>${bar(st.cadence)}<div class="stat-value">${st.cadence ?? 0}/5</div></div>
              <div class="stat-row"><div class="stat-label">${statIcon('range')}<span>Portée</span></div>${bar(st.range)}<div class="stat-value">${st.range ?? 0}/5</div></div>
              <div class="stat-row"><div class="stat-label">${statIcon('ammo')}<span>Munitions</span></div>${bar(st.ammo)}<div class="stat-value">${st.ammo ?? 0}/5</div></div>
              <div class="stat-row"><div class="stat-label">${statIcon('attachments')}<span>Accessoires</span></div>${bar(st.attachments)}<div class="stat-value">${st.attachments ?? 0}</div></div>

      // ===== Helpers globaux pour construire le payload hors modal =====
      const DEFAULT_CAR_COLORS_GLOBAL = ['#111111','#EAEAEA','#D32F2F','#1976D2','#FBC02D','#388E3C','#9E9E9E','#7B1FA2'];
      const COLOR_ID_MAP_GLOBAL = {
        '#111111': 0, '#EAEAEA': 111, '#D32F2F': 28, '#1976D2': 70,
        '#FBC02D': 89, '#388E3C': 55, '#9E9E9E': 18, '#7B1FA2': 145,
      };

      function normalizeHexGlobal(hex){
        if (!hex) return null;
        let h = hex.toString().trim().toUpperCase();
        if (h[0] !== '#') h = '#'+h;
        if (h.length === 4) h = '#'+h[1]+h[1]+h[2]+h[2]+h[3]+h[3];
        return h;
      }
      function colorIdFromHexGlobal(hex){
        const h = normalizeHexGlobal(hex);
        console.log(COLOR_ID_MAP_GLOBAL[h])
        return h!=null && COLOR_ID_MAP_GLOBAL[h]!=null ? COLOR_ID_MAP_GLOBAL[h] : null;
      }
      function basePriceFor(item){
        const isL = isLoyaltyPage();
        return isL ? (item.loyaltyPrice ?? item.price ?? 0) : (item.price ?? 0);
      }
      function isVehicleItem(it){ return ((it?.type||'').toLowerCase()==='vehicle'); }
      function defaultVehicleColor(v){
        const palette = Array.isArray(v?.colors) && v.colors.length
          ? v.colors.map(c => (typeof c === 'string' ? c : (c.value||'#FFFFFF')))
          : DEFAULT_CAR_COLORS_GLOBAL;
        const hex = normalizeHexGlobal(palette[0]);
        return { hex, colorId: colorIdFromHexGlobal(hex) };
      }

      // Builder réutilisable (shape identique à celle du modal)
      function buildPurchasePayload(item, opts = {}){
        const isPack = (item.type||'').toLowerCase() === 'pack';
        const pinfo = priceInfoFor(item);

        const basePrice = pinfo.final;                // 👈 prix actuel (promo incluse)
        const currency  = isLoyaltyPage() ? 'loyalty' : 'coins';

        // Par défaut: aucun surcoût (pas de plaque / pas de full custom)
        let extras = {};
        let packExtras = [];

        if (isPack){
          const products = item.products || [];
          // Si tu veux envoyer des "extras" par défaut pour CHAQUE véhicule du pack (couleur par défaut)
          products.forEach((p, idx) => {
            if (!isVehicleItem(p)) return;
            const dv = defaultVehicleColor(p);
            packExtras.push({
              id: p?.id ?? null,
              idx,
              type: p?.type ?? null,
              name: p?.name ?? null,
              extras: {
                colorHex: dv?.hex ?? null,
                colorId: dv?.colorId ?? null,
                plate: null,
                fullCustom: false
              },
              extraCoins: 0
            });
          });
        } else {
          if (isVehicleItem(item)){
            const dv = defaultVehicleColor(item);
            extras = {
              colorHex: dv?.hex ?? null,
              colorId: dv?.colorId ?? null,
              plate: null,
              fullCustom: false
            };
          } else {
            extras = { plate: null, fullCustom: false };
          }
        }

        const payload = {
          id: item.id ?? null,
          type: item.type ?? null,
          name: item.name ?? null,
          basePrice,
          extras,
          ...(isPack && packExtras.length ? { packExtras } : {}),
          ...(isPack ? {
            currentSubIndex: 0,
            currentSubId: item.products?.[0]?.id ?? null
          } : {}),
          totalPrice: basePrice,     // pas de surcoût hors modal
          sourcePage: state.current,
          currency
        };

        const s = streakFrom(item);
        payload.streak = s; // {active,count,bonus}
        payload.streakActive = s.active;
        payload.streakCount  = s.count;
        payload.streakBonus  = s.bonus;

        return payload;
      }

        const extrasByKey = new Map(); // key -> { selectedColorHex, selectedColorId, wantPlate, plateValue, plateValid, wantFull }

        const keyFor = (_obj, idx) => `idx:${idx}`;

              <!-- petit popover d’envoi -->

        productModal.classList.add('show');

        // --- Wish init
        let wished = !!item.wished;

          '#111111': 0, '#EAEAEA': 111, '#D32F2F': 28, '#1976D2': 70,

        function hideGiftPop(){ giftPop.classList.add('hidden'); disarmGiftConfirm(); }

          if (error === 'plate') return; // plaque invalide => bloqué

          payload.giftTo = to;
          postToLua('giftItem', payload);
          previewSpend(totalPrice, payload.currency);

          giftBtn.classList.add('selected');
          setTimeout(()=>giftBtn.classList.remove('selected'), 600);

          hideGiftPop();          // ferme + reset confirmation
          disarmGiftConfirm();
        });

        // clic hors popover => ferme + reset
        document.addEventListener('click', (ev)=>{
          if (!giftPop || giftPop.classList.contains('hidden')) return;
          if (ev.target.closest('#giftPop') || ev.target.closest('#modalGiftBtn')) return;
          hideGiftPop(); // appelle déjà disarmGiftConfirm()
        }, { capture:true });

        function normalizeHex(hex){
          if (!hex) return null;
          let h = hex.toString().trim().toUpperCase();
          if (h[0] !== '#') h = '#'+h;
          // #ABC -> #AABBCC
          if (h.length === 4) h = '#'+h[1]+h[1]+h[2]+h[2]+h[3]+h[3];
          return h;
        }

        function colorIdFromHex(hex){
          const h = normalizeHex(hex);
          return h!=null && COLOR_ID_MAP[h]!=null ? COLOR_ID_MAP[h] : null;
        }

        function sanitizePlate(raw){
          return (raw||'')
            .toUpperCase()
            .replace(/[^A-Z0-9 ]/g,'') // autorise l’espace
            .slice(0,8);               // max 8 caractères (espaces inclus)
        }
        function computeExtra(){
          let extra = 0;
          if (wantPlate && plateValid) extra += COST_PLATE;
          if (wantFull) extra += COST_FULL;
          return extra;
        }

        // Bloquer l'achat si une plaque invalide existe — uniquement sur véhicules
        function hasAnyInvalidPlateInPack(){
          if (!isPack) return wantPlate && !plateValid;
          return (item.products || []).some((p, idx) => {
            if ((p?.type||'').toLowerCase() !== 'vehicle') return false;
            const ex = (idx === mIdx)
              ? { wantPlate, plateValid }
              : extrasByKey.get(`idx:${idx}`);
            return ex?.wantPlate && !ex?.plateValid;
          });
        }

        // Somme des extras (véhicules uniquement)
        function packExtraCoinsAll(){
          if (!isPack) return computeExtra();
          return (item.products || []).reduce((sum, p, idx) => {
            if ((p?.type||'').toLowerCase() !== 'vehicle') return sum;
            const ex = (idx === mIdx)
              ? { wantFull, wantPlate, plateValid }
              : extrasByKey.get(`idx:${idx}`);
            if (!ex) return sum;
            if (ex.wantFull) sum += COST_FULL;
            if (ex.wantPlate && ex.plateValid) sum += COST_PLATE;
            return sum;
          }, 0);
        }

        // Helper
        const isVehicleAt = (idx) => {
          const sp = (item.products||[])[idx];
          return ((sp?.type||'').toLowerCase() === 'vehicle');
        };

        function renderPrice(){
            const extra = isPack ? packExtraCoinsAll() : computeExtra();
            const total = currentBasePrice + extra;
            priceTagEl.innerHTML = `${fmt(total)} ${isLoyalty ? loyaltySVG() : coinSVG('coinGradientFooter')}`;
            const balance = isLoyalty ? (state.loyaltyPoints || 0) : (state.coins || 0);
            const unaffordable = total > balance;
            const dailyOff = isDailyUnavailable(item);
            const mustBlock = hasAnyInvalidPlateInPack() || unaffordable || dailyOff;
            const blockTitle = dailyOff ? "Pas dans votre Daily Store aujourd'hui" : (unaffordable ? 'Fonds insuffisants' : '');
            buyBtn.classList.toggle('is-disabled', mustBlock);
            buyBtn.disabled = mustBlock;
            buyBtn.title = mustBlock ? blockTitle : '';
            if (giftBtn) {
                giftBtn.classList.toggle('is-disabled', mustBlock);
                giftBtn.disabled = mustBlock;
                giftBtn.title = mustBlock ? blockTitle : '';
            }
        }
        window.addEventListener('coinsChanged', renderPrice);
        window.addEventListener('loyaltyChanged', renderPrice);

        function renderUpsellForVehicle(v){
          const palette = Array.isArray(v.colors) && v.colors.length
            ? v.colors.map(c => (typeof c === 'string' ? c : (c.value||'#FFFFFF')))
            : DEFAULT_CAR_COLORS.slice();

          // s’il n’y a pas encore d’état pour ce véhicule, on le charge (ou défaut)
          if (selectedColorHex == null) loadExtras();

          // si la couleur mémorisée n’est pas dans la nouvelle palette => fallback
          const normPal = palette.map(h => normalizeHex(h));
          if (!selectedColorHex || !normPal.includes(normalizeHex(selectedColorHex))) {
            selectedColorHex = normalizeHex(palette[0]);
            selectedColorId  = colorIdFromHex(selectedColorHex);
          }

          // Construire les pastilles avec la sélection courante
          const swatches = palette.map((hex)=>{
            const h = normalizeHex(hex);
            const isSel = h === selectedColorHex;
            return `<button class="swatch ${isSel?'selected':''}"
                      data-color="${hex}"
                      data-id="${colorIdFromHex(hex) ?? ''}"
                      aria-label="Couleur ${hex}"
                      style="background:${hex}"></button>`;
          }).join('');

          upsellEl.innerHTML = `
            <div class="upsell-title">
              <span class="ico">${iconFor('vehicles_icon')}</span>
              <span>Options du véhicule</span>
            </div>

            <div class="upsell-row">
              <div class="upsell-label">Couleur (gratuit)</div>
              <div class="swatches" id="swatches">${swatches}</div>
            </div>

            <div class="upsell-row">
              <label class="option">
                <input type="checkbox" id="optFull" ${wantFull ? 'checked' : ''}>
                <span>Full custom <span class="price-note">(+${fmt(COST_FULL)} coins)</span></span>
              </label>
            </div>
          `;
          upsellEl.classList.remove('hidden');

          // events
          const swWrap = upsellEl.querySelector('#swatches');
          swWrap.addEventListener('click', (e)=>{
            const b = e.target.closest('.swatch'); if(!b) return;
            swWrap.querySelectorAll('.swatch').forEach(s=>s.classList.remove('selected'));
            b.classList.add('selected');
            selectedColorHex = normalizeHex(b.dataset.color);
            selectedColorId  = colorIdFromHex(selectedColorHex);
            saveExtras(); // ⬅️ mémoriser à chaque modif
          });

          // Plaque perso désactivée — toujours forcer wantPlate=false
          wantPlate = false;
          plateValue = '';
          plateValid = true;

          const fullChk = upsellEl.querySelector('#optFull');
          fullChk.addEventListener('change', ()=>{
            wantFull = fullChk.checked;
            saveExtras();
            renderPrice();
          });

          renderPrice();
        }

        const statsSlot = document.getElementById('statsSlot');
        let modalKeydownHandler = null;

        function renderStreakInModal(curLike){
          const sb = document.getElementById('streakBadgeModal');
          if (!sb) return;
          const s = streakFrom(curLike);
          if (s.active && (s.count > 0 || s.bonus > 0)){
            const cid = 'coinStreak' + Math.random().toString(36).slice(2);
            sb.style.display = '';
            sb.innerHTML = `
              ${flameSVG()}
              <span class="streak-txt">x${fmt(s.count)} - +${fmt(s.bonus)}</span>
              <span class="coin-ico">${coinSVG(cid)}</span>
              <span class="streak-note">${streakHelpText(s)}</span>
            `;
          } else {
            sb.style.display = 'none';
            sb.innerHTML = '';
          }
        }

        function refreshFromCurrent(){
          currentBasePrice = price; // s'assure qu'on repart sur la base du pack/produit
          if (isPack) {
            const cur = (item.products || [])[mIdx] || {};
            heroImg.src = imgs[mIdx] || baseImg;
            
            const curPerm = (typeof cur.isPerm !== 'undefined') ? cur.isPerm : item.isPerm;
            setPermBadge(curPerm);
            
            setPackChip(cur);
            statsSlot.innerHTML = renderStatsFor(cur);
            requestAnimationFrame(() => animateStatBars(statsSlot));
            
            // ⬇️ upsell visible seulement si le sous-produit est un véhicule
            if ((cur.type||'').toLowerCase()==='vehicle') {
              currentBasePrice = price; // le prix affiché reste celui du pack + upsell
              loadExtras();            // ⬅️ récupère l’état mémorisé pour cet item
              renderUpsellForVehicle(cur /* ou item */);
            } else {
              upsellEl.classList.add('hidden');
              upsellEl.innerHTML = '';
            }
            
            renderStreakInModal(item);
            renderStockBadgeInModal(item); // le stock concerne l’item (pack ou non), pas le sous-produit
            renderPromoBadgeInModal(item);
            renderPrice();
          } else {
            setPermBadge(item.isPerm);
            statsSlot.innerHTML = renderStatsFor(item);
            requestAnimationFrame(() => animateStatBars(statsSlot));

            // ⬇️ upsell si l’item est un véhicule
            if ((item.type||'').toLowerCase()==='vehicle') {
              currentBasePrice = price;
              loadExtras();            // ⬅️ récupère l’état mémorisé pour cet item
              renderUpsellForVehicle(item /* ou item */);
            } else {
              upsellEl.classList.add('hidden');
              upsellEl.innerHTML = '';
            }

            renderStreakInModal(item);
            renderStockBadgeInModal(item); // le stock concerne l’item (pack ou non), pas le sous-produit
            renderPromoBadgeInModal(item);
            renderPrice();
          }
        }
        refreshFromCurrent();

        // --- Nav pack (flèches + clavier)
        if (isPack && imgs.length > 1) {
          const prevBtn = document.getElementById('modalPrev');
          const nextBtn = document.getElementById('modalNext');

          const prev = ()=>{
            saveExtras(); // mémorise l’item courant avant de bouger
            mIdx = (mIdx - 1 + imgs.length) % imgs.length;
            refreshFromCurrent();
          };
          const next = ()=>{
            saveExtras();
            mIdx = (mIdx + 1) % imgs.length;
            refreshFromCurrent();
          };

          prevBtn?.addEventListener('click', (e)=>{ e.stopPropagation(); prev(); });
          nextBtn?.addEventListener('click', (e)=>{ e.stopPropagation(); next(); });

          modalKeydownHandler = (ev)=>{
            if (ev.key === 'ArrowLeft')  { ev.preventDefault(); prev(); }
            if (ev.key === 'ArrowRight') { ev.preventDefault(); next(); }
            if (ev.key === 'Escape')     { closeProductModal(); }
          };
          window.addEventListener('keydown', modalKeydownHandler);
        } else {
          modalKeydownHandler = (ev)=>{ if (ev.key === 'Escape') closeProductModal(); };
          window.addEventListener('keydown', modalKeydownHandler);
        }

        // Nettoyage du keydown lorsqu’on ferme
        const oldClose = closeProductModal;
        closeProductModal = function(){
          productModal.classList.remove('show');
          productModal.innerHTML = '';
          if (typeof modalKeydownHandler === 'function') {
            window.removeEventListener('keydown', modalKeydownHandler);
            modalKeydownHandler = null;
          }
          // on rétablit la référence
          closeProductModal = oldClose;
        };
      }

      function renderPromoBadgeInModal(it){
        const el = document.getElementById('promoBadgeModal');
        if (!el) return;
        const info = priceInfoFor(it);
        if (info.hasPromo){
          el.style.display = '';
          el.removeAttribute('style');
          el.classList.add('promo-badge', '--modal');
          el.innerHTML = `<span class="flash">FLASH</span><span class="txt">${info.badge}</span>`;
        } else {
          el.style.display = 'none';
          el.innerHTML = '';
        }
      }

      function renderStockBadgeInModal(it){
        const el = document.getElementById('stockBadgeModal');
        if (!el) return;

        // reset au cas où
        el.classList.remove('is-soldout');

        if (it?.limited){
          const left = Number(it.stockLeft);
          const isSoldOut = (Number.isFinite(left) ? left <= 0 : !!it.soldOut);

          const buyBtn  = document.getElementById('modalBuyBtn');
          const giftBtn = document.getElementById('modalGiftBtn');
          const giftPop = document.getElementById('giftPop');

          if (buyBtn){
            buyBtn.disabled = isSoldOut;
            buyBtn.classList.toggle('is-disabled', isSoldOut);
            buyBtn.setAttribute('aria-disabled', isSoldOut ? 'true' : 'false');
            buyBtn.title = isSoldOut ? 'Épuisé' : '';
          }

          // ✅ NOUVEAU : on bloque aussi "Offrir"
          if (giftBtn){
            giftBtn.disabled = isSoldOut;
            giftBtn.classList.toggle('is-disabled', isSoldOut);
            giftBtn.setAttribute('aria-disabled', isSoldOut ? 'true' : 'false');
            giftBtn.title = isSoldOut ? 'Épuisé' : '';
            // on ferme le popover si ouvert
            if (isSoldOut && giftPop && !giftPop.classList.contains('hidden')){
              giftPop.classList.add('hidden');
            }
          }

          if (isSoldOut){
            el.classList.add('is-soldout');
            el.innerHTML = `<span class="dot"></span><span class="txt">ÉPUISÉ</span>`;
          } else {
            const countTxt = Number.isFinite(left) ? fmt(left) : '';
            el.innerHTML = `<span class="dot"></span><span class="txt"><b>${countTxt}</b>EN STOCK !</span>`;
          }

          el.style.display = '';
        } else {
          el.style.display = 'none';
          el.innerHTML = '';
        }
      }

      function startDailyCountdown(seconds){
        if (dailyInterval) clearInterval(dailyInterval);
        dailyRemaining = Math.max(0, Number(seconds||0));
        const render = (t) => {
          dailyTimerEl.innerHTML = `<span class="digits">${t}</span>`;
        };

        if (dailyRemaining <= 0){ render("00:00:00"); return; }
        render(formatHMS(dailyRemaining));

        dailyInterval = setInterval(()=>{
          dailyRemaining--;
          render(formatHMS(dailyRemaining));
          if (dailyRemaining <= 0){
            clearInterval(dailyInterval);
            dailyInterval = null;
            render("00:00:00");
          }
        }, 1000);
      }

    // Accent/Case-insensitive normalizer 🔎
    const norm = (s) => (s||'').toString().toLowerCase()
      .normalize('NFD').replace(/[\u0300-\u036f]/g,'');

    // Menu
    const updateRipple = (e, btn) => {
      const r = btn.querySelector('.ripple');
      const rect = btn.getBoundingClientRect();
      r.style.setProperty('--x', (e.clientX - rect.left) + 'px');
      r.style.setProperty('--y', (e.clientY - rect.top) + 'px');
    };

    // Streak: tolère {streak:{active,count,bonus}} ou {streakActive,streakCount,streakBonus}
    function streakFrom(item){
      const s = item?.streak || item?.streakInfo || {};
      const active = (s.active ?? item?.streakActive) ?? false;
      const count  = Number((s.count ?? item?.streakCount) ?? 0) || 0;
      const bonus  = Number((s.bonus ?? item?.streakBonus) ?? 0) || 0;
      return { active: !!active, count: Math.max(0,count), bonus: Math.max(0,bonus) };
    }

    // Flamme SVG détaillée + dégradés + flicker
    function flameSVG(seed = Math.random().toString(36).slice(2)){
      const o = `${seed}-outer`, i = `${seed}-inner`;
      return `
      <svg class="flame" viewBox="0 0 24 28" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <defs>
          <radialGradient id="${o}" cx="50%" cy="20%" r="70%">
            <stop offset="0%"  stop-color="#FFE082"/>
            <stop offset="45%" stop-color="#FFB300"/>
            <stop offset="100%" stop-color="#E65100"/>
          </radialGradient>
          <radialGradient id="${i}" cx="50%" cy="30%" r="60%">
            <stop offset="0%"  stop-color="#FFF8E1"/>
            <stop offset="60%" stop-color="#FFC107"/>
            <stop offset="100%" stop-color="#FF6F00"/>
          </radialGradient>
        </defs>
        <!-- flamme externe -->
        <path d="M12 28c-5 0-9-3.5-9-8.5 0-4.5 3-6.8 5.6-9.3C10.5 8.3 12.2 6.7 12 4c2.2 1.7 4 4.6 4 7 0 1.4-.4 2.6-1 3.6
                2.7-.8 4.5-3 4.5-5.9 2.4 2 4.5 4.7 4.5 8.8 0 5-4 10.5-10 10.5Z"
              fill="url(#${o})"/>
        <!-- flamme interne -->
        <path class="inner"
              d="M12 24c-3.4 0-5.8-2.3-5.8-5 0-2.3 1.8-4 3.4-5.4 1.1-.9 2.2-2 2.4-3.3 1.5 1.1 2.5 3 2.5 4.5
                  0 .9-.3 1.7-.7 2.4 1.9-.6 3.2-2 3.2-4 1.6 1.3 3 3.1 3 5.6 0 3.1-2.8 5.2-7 5.2Z"
              fill="url(#${i})"/>
      </svg>`;
    }

    function streakHelpText(s){
      return `Streak: plus un article est acheté, plus le bonus augmente. Achat actuel: +${fmt(s.bonus)} coins (x${fmt(s.count)})`;
    }

    function makeStreakBadgeHTML(streak){

      return `<div class="streak-badge">

    function renderMenu(){
      menuEl.innerHTML = '';
      state.buttons.forEach((b)=>{
        const el = document.createElement('button');
        const isDaily = b.page === 'home';

    function renderAdmin(sales){
      const EUR_PER_COIN = 0.01;
      const toEUR = (coins) => coins * EUR_PER_COIN;
      const formatEUR = (n) => new Intl.NumberFormat('fr-FR', { style:'currency', currency:'EUR' })
        .format(n).replace(/,00(?=\s?€)/,'');

      // ---- tri selon l'état
      const getField = (p, key) => {
        switch(key){
          case 'id': return Number(p.id)||0;
          case 'name': return (p.name||'').toString().toLowerCase();
          case 'type': return (p.type||'').toString().toLowerCase();
          case 'price': return Number(p.price)||0;
          case 'sold': return Number(p.sold)||0;
          case 'revCoins': return (Number(p.sold)||0) * (Number(p.price)||0);
          case 'revEUR': return toEUR((Number(p.sold)||0) * (Number(p.price)||0));
          case 'wished': return Number(p.wished)||0;
          case 'lastSale': return luaTsToMs(p.lastSale);
          default: return '';
        }
      };

      const sorted = [...sales].sort((a,b)=>{
        const A = getField(a, state.adminSort.key);
        const B = getField(b, state.adminSort.key);
        let cmp = (A > B) ? 1 : (A < B ? -1 : 0);
        return state.adminSort.dir === 'asc' ? cmp : -cmp;
      });

      // KPIs (sur le dataset trié/filtré affiché)
      const totalSold = sorted.reduce((a,b)=>a+ (Number(b.sold)||0), 0);
      const totalRevCoins = sorted.reduce((a,b)=>a+ (Number(b.sold)||0)*(Number(b.price)||0), 0);
      const totalRevEUR = toEUR(totalRevCoins);
      const avgPrice  = totalSold ? Math.round(totalRevCoins / totalSold) : 0;
      const top = [...sorted].sort((a,b)=> ((b.sold||0)*(b.price||0)) - ((a.sold||0)*(a.price||0)) )[0];

      const esc = (s) => String(s ?? '')
        .replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

      const ellipsize = (s, max = 15) => {
        const str = String(s ?? '');
        return str.length > max ? str.slice(0, max).trimEnd() + '…' : str;
      };

      // lignes (avec animation décalée)
      const rows = sorted.map((p, i)=>{
        const revCoins = (Number(p.sold)||0) * (Number(p.price)||0);
        const revEUR = toEUR(revCoins);
        const delay = i * 40; // ms: petit décalage

        return `
          <tr style="--row-delay:${delay}ms">
            <td>#${p.id}</td>
            <td title="${esc(p.name)}">${esc(ellipsize(p.name, 15))}</td>
            <td>${p.type || '-'}</td>
            <td>${fmt(p.price)} ${coinSVG('coinAdm'+p.id)}</td>
            <td>${fmt(p.sold)}</td>
            <td>${fmt(revCoins)} ${coinSVG('coinAdmRev'+p.id)}</td>
            <td style="font-weight:700">${formatEUR(revEUR)} ${cashSVG()}</td>
            <td>${fmt(p.wished || 0)}</td>
            <td>${p.lastSale || ''}</td>
          </tr>
        `;
      }).join('');

      // header avec entêtes cliquables + indicateur de tri
      const th = (key, label) => {
        const active = state.adminSort.key === key;
        const dir = active ? state.adminSort.dir : 'asc';
        return `<th class="sortable ${active?'sorted':''}" data-key="${key}" data-dir="${dir}">
          <span class="th-inner">${label}<i class="sort-arrow"></i></span>
        </th>`;
      };

      gridEl.innerHTML = `
        <div class="admin-wrap">
          <div class="kpis" style="margin-bottom:12px">
            <div class="kpi"><div class="label">Ventes totales</div><div class="value">${fmt(totalSold)}</div></div>
            <div class="kpi"><div class="label">Revenus (coins)</div><div class="value">${fmt(totalRevCoins)} ${coinSVG('coinAdmTot')}</div></div>
            <div class="kpi"><div class="label">Revenus (€)</div><div class="value">${formatEUR(totalRevEUR)} ${cashSVG()}</div></div>
            <div class="kpi"><div class="label">Prix moyen</div><div class="value">${fmt(avgPrice)} ${coinSVG('coinAdmAvg')}</div></div>
            <div class="kpi"><div class="label">Top produit</div><div class="value">${top?.name ?? '-'}</div></div>
          </div>

          <div class="admin-scroll">
            <table class="admin-table">
              <thead>
                <tr>
                  ${th('id','ID')}
                  ${th('name','Produit')}
                  ${th('type','Type')}

                  ${th('sold','Vendus')}
                  ${th('revCoins','Revenus (coins)')}
                  ${th('revEUR','Revenus (€)')}
                  ${th('wished','Wishlist')}
                  ${th('lastSale','Dernière vente')}
                </tr>
              </thead>
              <tbody>${rows}</tbody>
            </table>
          </div>
        </div>
      `;

      // écouteurs de clic sur entêtes
      const head = gridEl.querySelector('.admin-table thead');
      head.addEventListener('click', (e)=>{
        const th = e.target.closest('th.sortable');
        if (!th) return;
        const key = th.getAttribute('data-key');
        // toggle direction si on clique la même colonne, sinon re-part sur 'asc'
        const nextDir = (state.adminSort.key === key && state.adminSort.dir === 'asc') ? 'desc' : 'asc';
        state.adminSort = { key, dir: nextDir };
        renderAdmin(sorted); // re-rendu (on repart de "sorted" pour garder le filtre en place)
      });
    }

    function showAdmin(){
      // breadcrumb + titres
      crumbEl.textContent = 'admin';
      state.pageTitle = 'Panel admin';
      pageTitleEl.textContent = state.pageTitle;

      document.getElementById('page').classList.add('no-page-scroll'); // ⬅️ plus de scroll sur .page

    function renderAdminEntry(){
      adminMenuEl.innerHTML = '';

      // Bouton "Classement" — visible pour tout le monde, juste au-dessus du
      // Panel Admin. Page rendue 100% côté client à partir de state.topContribs.
      const rankingBtn = document.createElement('button');
      rankingBtn.className = 'btn' + (state.current === 'classement' ? ' selected' : '');
      rankingBtn.innerHTML = `
        <span class="ico">${iconFor('ranking_icon')}</span>
        <span class="label-block">
          <span class="label">Classement</span>
        </span>
        <span class="ripple"></span>
      `;
      rankingBtn.addEventListener('mousemove', (e)=>updateRipple(e, rankingBtn));
      rankingBtn.addEventListener('click', ()=>{
        state.current = 'classement';
        renderMenu();
        showRanking();
      });
      adminMenuEl.appendChild(rankingBtn);

      const el = document.createElement('button');
      el.className = 'btn' + (state.current === 'admin' ? ' selected' : '');

    // Récupère un montant "coins dépensés" depuis l'objet contributeur,
    // en tolérant plusieurs alias possibles côté serveur.
    function contribAmount(it){
      const v = it?.spent ?? it?.coins ?? it?.amount ?? it?.total ?? it?.value
              ?? it?.coinsSpent ?? it?.points ?? 0;
      return Number(v) || 0;
    }

    function showRanking(){
      crumbEl.textContent = 'classement';
      state.pageTitle = 'Top Contributeurs du mois';
      pageTitleEl.textContent = state.pageTitle;

      const pageEl = document.getElementById('page');
      pageEl.classList.remove('no-page-scroll', 'admin-scroll', 'daily-layout');
      gridEl.classList.remove('admin-mode');

      if (dailyInterval) { clearInterval(dailyInterval); dailyInterval = null; }
      dailyTimerEl.classList.add('hidden');
      const dailyWrap = dailyRefreshBtn?.parentElement;
      dailyWrap?.classList.add('hidden');

      const all = Array.isArray(state.topContribs) ? state.topContribs.slice(0, 10) : [];

      if (!all.length){
        gridEl.innerHTML = `<div class="empty">Pas encore de contributeurs ce mois-ci.</div>`;
        return;
      }

      const itemHTML = (it, rank) => {
        const name = it?.name || it?.username || it?.display || 'Joueur';
        const img  = it?.logo || it?.avatar || it?.img || it?.image || null;
        const amt  = contribAmount(it);
        return { name, img, amt, rank };
      };

      // Top 3 — podium (ordre visuel : 2e, 1er, 3e)
      const top3 = all.slice(0, 3).map((it, i) => itemHTML(it, i + 1));
      const podiumOrder = [top3[1], top3[0], top3[2]].filter(Boolean);

      const podiumHTML = `
        <div class="ranking-podium">
          ${podiumOrder.map(p => `
            <div class="podium-slot rank-${p.rank}">
              <div class="podium-trophy">${trophySVG(p.rank)}</div>
              <div class="podium-avatar">
                ${p.img ? `<img src="${p.img}" alt="${p.name}">`
                        : `<div class="tc-fb">${initialsFromName(p.name)}</div>`}
              </div>
              <div class="podium-name">${p.name}</div>
              <div class="podium-amount">
                <span class="amt-num">${fmt(p.amt)}</span>
                <span class="amt-lbl">coins</span>
              </div>
              <div class="podium-base">
                <span class="podium-pos">#${p.rank}</span>
              </div>
            </div>
          `).join('')}
        </div>`;

      // Rangs 4 → 10 — liste classique
      const rest = all.slice(3).map((it, i) => itemHTML(it, i + 4));
      const restHTML = rest.length ? `
        <div class="ranking-list">
          ${rest.map(r => `
            <div class="ranking-row rank-n">
              <div class="ranking-pos">#${r.rank}</div>
              <div class="ranking-avatar">
                ${r.img ? `<img src="${r.img}" alt="${r.name}">`
                        : `<div class="tc-fb">${initialsFromName(r.name)}</div>`}
              </div>
              <div class="ranking-meta">
                <div class="ranking-name">${r.name}</div>
                <div class="ranking-rank">Top ${r.rank} du mois</div>
              </div>
              <div class="ranking-amount">
                <span class="amt-num">${fmt(r.amt)}</span>
                <span class="amt-lbl">coins</span>
              </div>
            </div>
          `).join('')}
        </div>` : '';

      gridEl.innerHTML = `<div class="ranking-page">${podiumHTML}${restHTML}</div>`;
    }

    // ===== Admin: context menu & modal limité =====
    let adminCtxEl, adminModalEl, adminLimitedFormState = null;

    function ensureAdminAdminUI(){
      if (!adminCtxEl) {
        adminCtxEl = document.createElement('div');
        adminCtxEl.id = 'adminCtx';
        adminCtxEl.className = 'admin-ctx hidden';
        adminCtxEl.innerHTML = '';
        document.body.appendChild(adminCtxEl);

        // interactions globales (clic ailleurs => ferme)
        document.addEventListener('click', hideAdminCtx, {capture:true});
        window.addEventListener('blur', hideAdminCtx);
        window.addEventListener('resize', hideAdminCtx);
      }
      if (!adminModalEl) {
        adminModalEl = document.createElement('div');
        adminModalEl.id = 'adminLimitedModal';
        adminModalEl.className = 'modal';
        document.body.appendChild(adminModalEl);
      }
    }

    function hideAdminCtx(){ if (adminCtxEl) adminCtxEl.classList.add('hidden'); }

    function showAdminCtx(item, x, y){
      ensureAdminAdminUI();

      const limited = !!item.limited;
      // ✅ on détecte au mieux s’il y a déjà une promo
      const hasPromo = !!(item.promoActive || (item.promo && item.promo.active) || item.promoId);

      adminCtxEl.innerHTML = `
        <div class="ctx-card">
          <div class="ctx-title">#${item.id} — ${item.name || 'Produit'}</div>

          <!-- Limité -->
          <button class="ctx-row" data-act="upsert">${limited ? 'Modifier l’édition limitée' : 'Rendre limité'}</button>
          ${limited ? '<button class="ctx-row" data-act="remove">Retirer des limités</button>' : ''}

          <div class="ctx-sep"></div>

          <!-- Promo -->
          <button class="ctx-row" data-act="promo-upsert">${hasPromo ? 'Modifier la promo' : 'Ajouter une promo'}</button>
          ${hasPromo ? '<button class="ctx-row" data-act="promo-remove">Retirer la promo</button>' : ''}
        </div>
      `;

      const w = 320;
      adminCtxEl.style.minWidth = w+'px';
      adminCtxEl.style.left = Math.max(8, Math.min(x, window.innerWidth - w - 8)) + 'px';
      adminCtxEl.style.top  = Math.max(8, y) + 'px';
      adminCtxEl.classList.remove('hidden');

      adminCtxEl.onclick = (e)=>{
        const btn = e.target.closest('.ctx-row'); if(!btn) return;
        e.stopPropagation();
        const act = btn.dataset.act;
        hideAdminCtx();

        // Limité
        if (act === 'upsert') openLimitedEditor(item);
        if (act === 'remove') confirmRemoveLimited(item);

        // Promo
        if (act === 'promo-upsert') openPromoEditor(item);
        if (act === 'promo-remove') confirmRemovePromo(item);
      };
    }

    function openPromoEditor(item, preset){
      ensureAdminAdminUI();

      // Valeurs actuelles (ou préremplies depuis `promoInfo`)
      const cur = {
        id: item.id,
        discount_type: (preset?.discount_type || 'percent'),   // 'percent' | 'flat'
        discount_value: Number(preset?.discount_value ?? 10) || 10,
        currency: (preset?.currency || 'coins'),               // 'coins' | 'loyalty' | 'both'

        end_at:   preset?.end_at   ?? null,
        is_active: (typeof preset?.is_active === 'boolean') ? preset.is_active : true
      };

      const fmtDT = (ts)=>{
        if (!ts) return '';
        const d = new Date((String(ts).length < 12 ? ts*1000 : ts));
        const pad=(n)=>String(n).padStart(2,'0');
        return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
      };
      const parseDT = (v)=> {
        if (!v) return null;
        const ms = new Date(v).getTime();
        return isFinite(ms) ? Math.floor(ms/1000) : null;
      };

      adminModalEl.innerHTML = `
        <div class="dialog limited-editor promo-editor" role="dialog" aria-modal="true">

                  <option value="percent" ${cur.discount_type==='percent'?'selected':''}>Pourcentage (%)</option>

              </div>

              <label>Valeur</label>
              <input id="pr_value" type="number" min="1" step="1" value="${cur.discount_value}">
              <div class="hint">Exemples : 20% → type=Pourcentage, valeur=20 · Réduction de 150 coins → type=Montant, valeur=150</div>
            </div>

            <div class="form-row">
              <label>Devise ciblée</label>
              <div class="promo-select-wrap">
                <select id="pr_currency" class="promo-select">
                  <option value="coins" ${cur.currency==='coins'?'selected':''}>Coins</option>
                  <option value="loyalty" ${cur.currency==='loyalty'?'selected':''}>Fidélité</option>
                  <option value="both" ${cur.currency==='both'?'selected':''}>Les deux</option>

              </div>

              <div>

                <input id="pr_start" type="datetime-local" value="${fmtDT(cur.start_at)}">
              </div>
              <div>
                <label>Fin (optionnel)</label>
                <input id="pr_end" type="datetime-local" value="${fmtDT(cur.end_at)}">
              </div>
            </div>

            <div class="form-row">
              <label class="option">
                <input id="pr_active" type="checkbox" ${cur.is_active ? 'checked' : ''}>
                <span>Activer la promo</span>

            <button class="buy" id="promoSaveBtn">Enregistrer</button>
          </div>
        </div>
      `;

      // Upgrade uniquement #pr_type et #pr_currency dans la modale promo
      (function installPromoPrettySelects(root){
        function upgrade(native){
          // wrapper
          const wrap = document.createElement('div');
          wrap.className = 'pretty-select';
          native.parentNode.insertBefore(wrap, native);
          wrap.appendChild(native);

          // trigger
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'ps-trigger';
          btn.setAttribute('aria-haspopup','listbox');
          btn.setAttribute('aria-expanded','false');

          const label = document.createElement('span');
          label.className = 'ps-label';
          const caret = document.createElement('span');
          caret.className = 'ps-caret';
          caret.innerHTML = `<svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

          btn.append(label, caret);

          // menu
          const menu = document.createElement('div');
          menu.className = 'ps-menu';
          menu.setAttribute('role','listbox');

          wrap.append(btn, menu);

          // options
          const rows = Array.from(native.options).map(o => {
            const r = document.createElement('div');
            r.className = 'ps-opt';
            r.setAttribute('role','option');
            r.dataset.value = o.value;
            r.textContent = o.textContent;
            if (o.selected) r.setAttribute('aria-selected','true');
            menu.appendChild(r);
            return r;
          });

          function setValue(val, fire=true){
            native.value = val;
            label.textContent = native.selectedOptions[0]?.textContent || '';
            rows.forEach(r => {
              const sel = r.dataset.value === val;
              r.toggleAttribute('aria-selected', sel);
              r.classList.toggle('is-active', sel);
            });
            if (fire) native.dispatchEvent(new Event('change', {bubbles:true}));
          }
          setValue(native.value, false);

          // open/close
          const open  = () => { wrap.classList.add('is-open'); btn.setAttribute('aria-expanded','true'); };
          const close = () => { wrap.classList.remove('is-open'); btn.setAttribute('aria-expanded','false'); };
          btn.addEventListener('click', e => { e.stopPropagation(); wrap.classList.contains('is-open') ? close() : open(); });
          document.addEventListener('click', e => { if (!wrap.contains(e.target)) close(); });

          rows.forEach(r => r.addEventListener('click', () => { setValue(r.dataset.value); close(); }));

          // clavier
          let idx = Math.max(0, rows.findIndex(r => r.getAttribute('aria-selected')==='true'));
          function move(d){ idx = Math.max(0, Math.min(rows.length-1, idx + d));
            rows.forEach((r,i)=>r.classList.toggle('is-active', i===idx));
            menu.scrollTop = Math.max(0, rows[idx].offsetTop - 100);
          }
          btn.addEventListener('keydown', e => {
            if (e.key==='ArrowDown'){ e.preventDefault(); open(); move(0); }
            if (e.key==='Enter' && wrap.classList.contains('is-open')){ e.preventDefault(); close(); }
          });
          menu.addEventListener('keydown', e => {
            if (e.key==='Escape'){ e.preventDefault(); close(); btn.focus(); }
            if (e.key==='ArrowDown'){ e.preventDefault(); move(1); }
            if (e.key==='ArrowUp'){ e.preventDefault(); move(-1); }
            if (e.key==='Enter'){ e.preventDefault(); setValue(rows[idx].dataset.value); close(); btn.focus(); }
          });

          // sync externe
          native.addEventListener('change', () => setValue(native.value, false));
        }

        // cible uniquement la modale promo ouverte
        root.querySelectorAll('.promo-editor select#pr_type, .promo-editor select#pr_currency')
            .forEach(upgrade);
      })(adminModalEl);

    function priceInfoFor(item, forceLoyalty = undefined) {
      const isL = typeof forceLoyalty === 'boolean' ? forceLoyalty : isLoyaltyPage();
      const base = isL ? (item.loyaltyPrice ?? item.price ?? 0) : (item.price ?? 0);

      // 1) Récupérer la source "promo" (plusieurs schémas possibles)
      let rawPromo =
        item.promo ||
        item.promotion ||
        item.promoInfo ||
        // fallback: champs top-level (ex: promoActive, promoPercent, promoPriceCoins, …)
        ((item.promoActive || item.promoPercent != null || item.promoPriceCoins != null || item.promoPriceLoyalty != null)
          ? {
              is_active: item.promoActive !== false,
              // si on a un pourcentage côté top-level
              discount_type: item.promoType || (item.promoPercent != null ? 'percent' : undefined),
              discount_value: item.promoValue ?? item.promoPercent ?? 0,
              // overrides possibles
              price_override: item.promoPriceCoins,
              loyalty_override: item.promoPriceLoyalty,
              currency: item.promoCurrency || 'both',
              start_at: item.promoStart || item.start_at || item.startAt || null,
              end_at: item.promoEnd || item.end_at || item.endAt || null,
            }
          : null);

      if (!rawPromo) {
        return { base, final: base, hasPromo: false, badge: null, percent: 0, flat: 0, promoActive: false };
      }

      // 2) Normaliser la promo en acceptant tes alias (active/type/percent/priceCoins/priceLoyalty)
      const promo = {
        is_active: (rawPromo.is_active ?? rawPromo.active ?? true) !== false,
        currency: rawPromo.currency || 'both',
        start_at: rawPromo.start_at ?? rawPromo.startAt ?? rawPromo.start ?? null,
        end_at: rawPromo.end_at ?? rawPromo.endAt ?? rawPromo.end ?? null,

        // type/valeur de remise
        discount_type: rawPromo.discount_type ?? rawPromo.type ?? (rawPromo.percent != null ? 'percent' : undefined),
        discount_value: Number(
          rawPromo.discount_value ?? rawPromo.value ?? rawPromo.percent ?? 0
        ),

        // anciens schémas possibles
        discount_percent: Number(rawPromo.discount_percent ?? 0),

        // overrides par devise
        price_override: rawPromo.price_override ?? rawPromo.priceCoins ?? null,
        loyalty_override: rawPromo.loyalty_override ?? rawPromo.priceLoyalty ?? null,
      };

      const now = Math.floor(Date.now() / 1000);
      const inWindow = (!promo.start_at || now >= Number(promo.start_at)) &&
                      (!promo.end_at   || now <= Number(promo.end_at));
      const cur = isL ? 'loyalty' : 'coins';
      const currencyOK = promo.currency === 'both' || promo.currency === cur;

      let final = base, percent = 0, flat = 0;
      const active = promo.is_active && inWindow && currencyOK;

      if (active) {
        // priorité : type/valeur, puis override, puis legacy percent
        if (promo.discount_type && promo.discount_value > 0) {
          if (promo.discount_type === 'percent') {
            percent = Math.min(95, Math.max(1, promo.discount_value));
            final = Math.max(0, Math.round(base * (100 - percent) / 100));
            flat = base - final;
          } else {
            flat = Math.max(1, promo.discount_value);
            final = Math.max(0, base - flat);
            percent = base > 0 ? Math.round(100 * (flat / base)) : 0;
          }
        } else {
          // overrides spécifiques à la devise
          const override = isL ? promo.loyalty_override : promo.price_override;
          if (override != null && Number.isFinite(Number(override))) {
            final = Math.min(base, Number(override));
            flat = base - final;
            percent = base > 0 ? Math.round(100 * (flat / base)) : 0;
          } else if (promo.discount_percent > 0) {
            percent = Math.min(95, Math.max(1, promo.discount_percent));
            final = Math.max(0, Math.round(base * (100 - percent) / 100));
            flat = base - final;
          }
        }
      }

      const hasPromo = active && final < base;
      const badge = hasPromo ? (percent ? `-${percent}%` : `-${fmt(flat)}`) : null;
      return { base, final, hasPromo, badge, percent, flat, promoActive: active };
    }
