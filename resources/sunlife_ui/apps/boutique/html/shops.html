    // ===== Mystery reveal sound (Web Audio synthesis) =========================
    let _audioCtx = null;
    function getAudioCtx(){
      if (_audioCtx) return _audioCtx;
      const Ctor = window.AudioContext || window.webkitAudioContext;
      if (!Ctor) return null;
      try { _audioCtx = new Ctor(); } catch(e){ return null; }
      return _audioCtx;
    }

    function playRevealSound(){
      const ctx = getAudioCtx();
      if (!ctx) return;
      try { if (ctx.state === 'suspended') ctx.resume(); } catch(e){}

      const now = ctx.currentTime;
      const master = ctx.createGain();
      master.gain.setValueAtTime(0.85, now);
      master.connect(ctx.destination);

      // 1) Whoosh : sweep down filtré sur du bruit blanc court
      const noiseLen = 0.28;
      const buf = ctx.createBuffer(1, Math.floor(ctx.sampleRate * noiseLen), ctx.sampleRate);
      const data = buf.getChannelData(0);
      for (let i = 0; i < data.length; i++) {
        data[i] = (Math.random() * 2 - 1) * (1 - i / data.length);
      }
      const noise = ctx.createBufferSource();
      noise.buffer = buf;
      const noiseFilter = ctx.createBiquadFilter();
      noiseFilter.type = 'bandpass';
      noiseFilter.Q.value = 1.6;
      noiseFilter.frequency.setValueAtTime(2200, now);
      noiseFilter.frequency.exponentialRampToValueAtTime(420, now + noiseLen);
      const noiseGain = ctx.createGain();
      noiseGain.gain.setValueAtTime(0.0001, now);
      noiseGain.gain.exponentialRampToValueAtTime(0.18, now + 0.02);
      noiseGain.gain.exponentialRampToValueAtTime(0.0001, now + noiseLen);
      noise.connect(noiseFilter).connect(noiseGain).connect(master);
      noise.start(now);
      noise.stop(now + noiseLen);

      // 2) Arpège magique : C5 - E5 - G5 - C6 (do majeur, sparkle)
      const notes = [
        { f: 523.25, t: 0.00, dur: 0.45 }, // C5
        { f: 659.25, t: 0.06, dur: 0.45 }, // E5
        { f: 783.99, t: 0.12, dur: 0.50 }, // G5
        { f: 1046.5, t: 0.18, dur: 0.55 }, // C6
      ];
      notes.forEach(n => {
        // Sine pour le corps
        const o = ctx.createOscillator();
        o.type = 'sine';
        o.frequency.setValueAtTime(n.f, now + n.t);
        const g = ctx.createGain();
        g.gain.setValueAtTime(0.0001, now + n.t);
        g.gain.exponentialRampToValueAtTime(0.22, now + n.t + 0.01);
        g.gain.exponentialRampToValueAtTime(0.0001, now + n.t + n.dur);
        o.connect(g).connect(master);
        o.start(now + n.t);
        o.stop(now + n.t + n.dur);

        // Triangle un peu plus haut pour le sparkle
        const o2 = ctx.createOscillator();
        o2.type = 'triangle';
        o2.frequency.setValueAtTime(n.f * 2, now + n.t);
        const g2 = ctx.createGain();
        g2.gain.setValueAtTime(0.0001, now + n.t);
        g2.gain.exponentialRampToValueAtTime(0.07, now + n.t + 0.02);
        g2.gain.exponentialRampToValueAtTime(0.0001, now + n.t + n.dur * 0.7);
        o2.connect(g2).connect(master);
        o2.start(now + n.t);
        o2.stop(now + n.t + n.dur);
      });

      // 3) Sub bass thump (impact à l'apparition)
      const sub = ctx.createOscillator();
      sub.type = 'sine';
      sub.frequency.setValueAtTime(110, now);
      sub.frequency.exponentialRampToValueAtTime(55, now + 0.18);
      const subG = ctx.createGain();
      subG.gain.setValueAtTime(0.0001, now);
      subG.gain.exponentialRampToValueAtTime(0.30, now + 0.01);
      subG.gain.exponentialRampToValueAtTime(0.0001, now + 0.22);
      sub.connect(subG).connect(master);
      sub.start(now);
      sub.stop(now + 0.22);
    }

    // ===== UI click sound (synthétisé — punchy "tactile snap") ===============
    // 3 couches : noise transient large bande (snap), mid pop (corps), sub (poids).
    // Ajustables d'un coup via CLICK_VOL (master).
    const CLICK_VOL = 0.1;
    let _lastClickAt = 0;
    function playClickSound(opts){
      const ctx = getAudioCtx();
      if (!ctx) return;
      const nowMs = performance.now();
      if (nowMs - _lastClickAt < 35) return; // throttle anti-spam
      _lastClickAt = nowMs;
      try { if (ctx.state === 'suspended') ctx.resume(); } catch(e){}

      const now = ctx.currentTime;
      const intensity = (opts && opts.soft) ? 0.6 : 1;
      const master = ctx.createGain();
      master.gain.setValueAtTime(0.95 * CLICK_VOL * intensity, now);
      master.connect(ctx.destination);

      // 1) Transient SNAP : burst de bruit large bande, attaque ultra-rapide.
      const noiseLen = 0.030;
      const buf = ctx.createBuffer(1, Math.max(1, Math.floor(ctx.sampleRate * noiseLen)), ctx.sampleRate);
      const data = buf.getChannelData(0);
      for (let i = 0; i < data.length; i++) {
        // Petit boost en début pour un transient agressif.
        const env = (i < 4 ? 1 : (1 - i / data.length));
        data[i] = (Math.random() * 2 - 1) * env;
      }
      const noise = ctx.createBufferSource();
      noise.buffer = buf;
      // Bandpass plus bas qu'avant pour un click plus "corporel" (moins sifflant).
      const bp = ctx.createBiquadFilter();
      bp.type = 'bandpass';
      bp.frequency.value = 2200;
      bp.Q.value = 0.9;
      const noiseG = ctx.createGain();
      noiseG.gain.setValueAtTime(0.0001, now);
      noiseG.gain.exponentialRampToValueAtTime(0.85, now + 0.001);   // attaque quasi instantanée
      noiseG.gain.exponentialRampToValueAtTime(0.0001, now + noiseLen);
      noise.connect(bp).connect(noiseG).connect(master);
      noise.start(now);
      noise.stop(now + noiseLen);

      // 2) Mid POP : oscillateur square pour donner du grain (plus "plastic switch")
      const baseHz = 1300 + (Math.random() * 200 - 100); // 1200..1400 Hz
      const osc = ctx.createOscillator();
      osc.type = 'square';
      osc.frequency.setValueAtTime(baseHz, now);
      osc.frequency.exponentialRampToValueAtTime(baseHz * 0.55, now + 0.05);
      // On filtre le square pour pas qu'il sature les aigus.
      const oscFilt = ctx.createBiquadFilter();
      oscFilt.type = 'lowpass';
      oscFilt.frequency.value = 3200;
      oscFilt.Q.value = 0.5;
      const oscG = ctx.createGain();
      oscG.gain.setValueAtTime(0.0001, now);
      oscG.gain.exponentialRampToValueAtTime(0.55, now + 0.002);
      oscG.gain.exponentialRampToValueAtTime(0.0001, now + 0.075);
      osc.connect(oscFilt).connect(oscG).connect(master);
      osc.start(now);
      osc.stop(now + 0.08);

      // 3) Sub THUMP : sine basse pour le poids "haptique" du click.
      const sub = ctx.createOscillator();
      sub.type = 'sine';
      sub.frequency.setValueAtTime(160, now);
      sub.frequency.exponentialRampToValueAtTime(60, now + 0.07);
      const subG = ctx.createGain();
      subG.gain.setValueAtTime(0.0001, now);
      subG.gain.exponentialRampToValueAtTime(0.50, now + 0.003);
      subG.gain.exponentialRampToValueAtTime(0.0001, now + 0.085);
      sub.connect(subG).connect(master);
      sub.start(now);
      sub.stop(now + 0.09);
    }

    // Écouteur global : joue le son sur tout clic dans la boutique,
    // sauf clics sur inputs/textareas et sur éléments opt-out (data-no-click-sound).
    document.addEventListener('click', (e) => {
      if (document.body.classList.contains('hidden')) return;

      if (!(t instanceof Element)) return;
      if (t.closest('input, textarea, select')) return;
      if (t.closest('[data-no-click-sound]')) return;
      // Variante "soft" pour les clics sur des cibles non-interactives (fond / vide)
      const isInteractive = !!t.closest('button, a, [role="button"], .btn, .card, .menu .btn, .secondary, .primary, .uid-btn, .danger, .refresh-btn, .mystery-overlay, .modal, [tabindex]');

    function renderItems(content){

      updatePageSubtitle(pg);
      stopAllPackAuto();
      gridEl.innerHTML = '';

      const items = content.items || [];
      if (!items.length) {
        gridEl.innerHTML = pg === 'wishlist'
          ? `<div class="empty">Votre wishlist est vide. Cliquez sur le ♥ d'un produit pour l'ajouter.</div>`
          : `<div class="empty">Aucun résultat pour cette page.</div>`;
        return;
      }

      const mysteryMode = shouldUseMystery(pg);

      // Icône monétaire hoistée hors de la boucle : identique pour toutes les
      // cartes de la page, inutile de régénérer un SVG (+ ses <defs>) par item.
      const pageIsLoyalty = isLoyaltyPage(pg);
      const coinIco = pageIsLoyalty ? loyaltySVG() : coinSVG('shopCoinIco');

      // Rendu en une seule passe DOM : on construit dans un fragment détaché

      const frag = document.createDocumentFragment();

      items.forEach((item, idx) => {

        card.classList.add('card');

        // Mystery (daily reveal) state

        const isMystery = mysteryMode && !_revealedDaily.has(mysteryKey);
        if (isMystery) {
          card.classList.add('is-mystery');
          card.dataset.mvar = String((idx % 6) + 1);

        const pinfo = priceInfoFor(item);
        const priceStackHTML = pinfo.hasPromo
          ? `<div class="price-stack" aria-label="Prix en promotion">
              <div class="row old">
                <s>${fmt(pinfo.base)}</s>
                <span class="coin-ico">${coinIco}</span>
              </div>
              <div class="row new">
                <span>${fmt(pinfo.final)}</span>
                <span class="coin-ico">${coinIco}</span>
              </div>
            </div>`
          : `<div class="price-stack" aria-label="Prix">
              <div class="row new">
                <span>${fmt(pinfo.final)}</span>
                <span class="coin-ico">${coinIco}</span>
              </div>
            </div>`;

        // clic droit admin -> menu
        if (state.isAdmin) {
          card.addEventListener('contextmenu', (e)=>{
            e.preventDefault();
            showAdminCtx(item, e.clientX, e.clientY);
          });
        }

        // état stock / épuisé
        const isLimited = !!item.limited;
        const left = Number(item.stockLeft);
        const isSoldOut = isLimited && ( !!item.soldOut || (Number.isFinite(left) && left <= 0) );

        card.innerHTML = `
          <div class="thumb">
              <img src="${resolveImageUrl(item,'https://placehold.co/320x160/png')}" alt="${item.name}"/>
          </div>
          <div class="body">
            <div class="name">${item.name}</div>
            <div class="rarity-slot">${rarityBadgeHTML(item.rarity)}</div>
          </div>
          <div class="footer">
            ${priceStackHTML}
            <button class="buy${isSoldOut ? ' is-disabled' : ''}" data-id="${item.id}"
                    ${isSoldOut ? 'disabled aria-disabled="true" title="Épuisé"' : ''}>
              <span class="buy-label">Acheter</span>
            </button>
          </div>
          ${isMystery ? `
            <div class="mystery-overlay" role="button" tabindex="0" aria-label="Révéler l'objet">
              <div class="qmark">?</div>
              <div class="qlabel">Objet Mystérieux</div>
              <div class="reveal-hint">Cliquez pour découvrir</div>
            </div>
          ` : ''}
        `;

        // ✅ badge stock visible pour tous si limité
        if (item.limited) {
          const left = Number(item.stockLeft);
          const isSoldOut = !!item.soldOut || (Number.isFinite(left) && left <= 0);

          const badge = document.createElement('div');
          badge.className = 'stock-badge' + (isSoldOut ? ' is-soldout' : '');
          badge.setAttribute('role','status');
          badge.setAttribute('aria-live','polite');

          badge.innerHTML = isSoldOut
            ? `<span class="dot"></span><span class="txt">ÉPUISÉ</span>`
            : `<span class="dot"></span><span class="txt"><b>${fmt(left)}</b>EN STOCK !</span>`;

          card.appendChild(badge);
        }

        const thumbEl = card.querySelector('.thumb');
        const imgEl = card.querySelector('.thumb img');
        attachImgFallback(imgEl, item.img || 'https://placehold.co/320x160/png');

        if (pinfo.hasPromo) {
          const b = document.createElement('div');
          b.className = 'promo-badge';
          b.setAttribute('role','status');
          b.setAttribute('aria-live','polite');
          b.innerHTML = `<span class="flash">FLASH</span><span class="txt">${pinfo.badge}</span>`;
          thumbEl.style.position = 'relative';
          thumbEl.appendChild(b);
        }

        // ♥ Wishlist sur la carte (partage item.wished avec la modale)
        if (item.id != null) {
          const wishBtnCard = document.createElement('button');
          wishBtnCard.type = 'button';
          wishBtnCard.className = 'wish-card' + (item.wished ? ' active' : '');
          wishBtnCard.dataset.id = item.id;
          wishBtnCard.setAttribute('aria-pressed', String(!!item.wished));
          wishBtnCard.title = item.wished ? 'Retirer de la wishlist' : 'Ajouter à la wishlist';
          wishBtnCard.innerHTML = heartSVG(!!item.wished);
          wishBtnCard.addEventListener('click', (e) => {
            e.preventDefault();
            e.stopPropagation();
            toggleWish(item, card);
          });
          thumbEl.appendChild(wishBtnCard);
        }

        // Daily wishlisté mais absent du daily du jour : carte grisée, achat bloqué
        if (isDailyUnavailable(item)) {
          card.classList.add('is-unavailable');
          const off = document.createElement('div');
          off.className = 'daily-off-badge';
          off.setAttribute('role','status');
          off.innerHTML = `<span class="txt">HORS DAILY</span>`;
          card.appendChild(off);
          const buyEl = card.querySelector('.buy');
          if (buyEl) {
            buyEl.disabled = true;
            buyEl.classList.add('is-disabled');
            buyEl.setAttribute('aria-disabled', 'true');
            buyEl.title = "Pas dans votre Daily Store aujourd'hui";
          }
        }

        // Si c'est un pack: on installe le carrousel dans la carte
        if ((item.type||'').toLowerCase() === 'pack') {
          const imgs = packImages(item);
          // structure glissée
          thumbEl.classList.add('carousel');
          // remplace l'img unique par une scène de slide
          const stage = document.createElement('div');
          stage.className = 'slide-stage';
          const first = document.createElement('img');
          first.className = 'slide-img is-current';
          first.src = imgs[0] || resolveImageUrl(item,'https://placehold.co/320x160/png');
          stage.appendChild(first);
          thumbEl.innerHTML = '';             // on nettoie
          thumbEl.appendChild(stage);         // on met la scène
          // (ré)ajoute les boutons si >1 image
          if (imgs.length > 1) {
            thumbEl.insertAdjacentHTML('beforeend', `
              <button class="nav-btn prev" aria-label="Image précédente">${chevron('left')}</button>
              <button class="nav-btn next" aria-label="Image suivante">${chevron('right')}</button>
            `);
          }

          let idx = 0;
          let isAnimating = false;
          let autoId = null;

          const prevBtn = thumbEl.querySelector('.nav-btn.prev');
          const nextBtn = thumbEl.querySelector('.nav-btn.next');

          function slideTo(nextIdx, dir /* 'left' | 'right' */){
            if (isAnimating || nextIdx === idx) return;
            isAnimating = true;

            const cur = stage.querySelector('.slide-img.is-current');
            const incoming = document.createElement('img');
            incoming.className = 'slide-img ' + (dir === 'left' ? 'enter-from-right' : 'enter-from-left');
            incoming.src = imgs[nextIdx];
            stage.appendChild(incoming);

            // force reflow
            void incoming.offsetWidth;

            // lance l’anim
            incoming.classList.remove('enter-from-right','enter-from-left'); // => vers 0
            if (cur) cur.classList.add(dir === 'left' ? 'leave-left' : 'leave-right');

            let done = false;
            const finish = () => {
              if (done) return;
              done = true;
              if (cur) cur.remove();
              incoming.classList.add('is-current');
              incoming.classList.remove('leave-left','leave-right','enter-from-left','enter-from-right');
              isAnimating = false;
              idx = nextIdx;
            };

            // on écoute les deux, + un filet de sécurité
            if (cur) cur.addEventListener('transitionend', finish, { once:true });
            incoming.addEventListener('transitionend', finish, { once:true });
            setTimeout(finish, 600); // fallback au cas où 'transitionend' ne fire pas
          }

          function goNext(auto=false){
            const next = (idx + 1) % imgs.length;
            // auto = sens droite→gauche (le visuel glisse vers la gauche)
            slideTo(next, 'left');
          }
          function goPrev(){
            const prev = (idx - 1 + imgs.length) % imgs.length;
            slideTo(prev, 'right'); // sens inverse pour le bouton "précédent"
          }

          // boutons
          prevBtn?.addEventListener('click', (e)=>{ e.stopPropagation(); stopAuto(); goPrev(); });
          nextBtn?.addEventListener('click', (e)=>{ e.stopPropagation(); stopAuto(); goNext(); });

          // ----- Auto-défilement uniquement au survol -----
          function startAuto(){
            if (autoId || imgs.length < 2) return;
            autoId = setInterval(()=>goNext(true), 1000); // ⏱️ 1s
            packAutoTimers.add(autoId);
          }
          function stopAuto(){
            if (!autoId) return;
            clearInterval(autoId);
            packAutoTimers.delete(autoId);
            autoId = null;
          }

          // survol de la CARTE = on démarre; on stoppe en sortie
          card.addEventListener('mouseenter', startAuto);
          card.addEventListener('mouseleave', stopAuto);

          // on stoppe aussi si on clique/drag sur la vignette
          thumbEl.addEventListener('pointerdown', stopAuto, { once:false });

          // fallback: si la page change, stopAllPackAuto() nettoie
        }

        // Mystery reveal click handler (intercepts before any other action)
        if (isMystery) {
          const overlay = card.querySelector('.mystery-overlay');
          const reveal = (ev) => {
            if (ev) { ev.stopPropagation(); ev.preventDefault(); }
            if (!card.classList.contains('is-mystery')) return;
            _revealedDaily.add(card.dataset.mkey || mysteryKey);
            playRevealSound();
            card.classList.add('is-revealing');
            setTimeout(() => {
              card.classList.remove('is-mystery', 'is-revealing');
              if (overlay) overlay.remove();
            }, 600);
          };
          overlay?.addEventListener('click', reveal);
          overlay?.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' || e.key === ' ') reveal(e);
          });
        }

        // OUVERTURE FICHE PRODUIT AU CLIC SUR LA CARTE (hors bouton acheter)
        card.addEventListener('click', (e)=>{
          if (card.classList.contains('is-mystery')) return; // mystery handles its own click
          const isBuy = e.target.closest('.buy');
          if (isBuy) return; // le bouton gère son propre clic
          openProductModal(item);
        });

        // Acheter (bouton) — CONFIRMATION en 2 clics
        card.querySelector('.buy').addEventListener('click', (e) => {
          e.stopPropagation();
          const btn = e.currentTarget;

          // ⛔ épuisé -> rien
          if (btn.disabled || btn.classList.contains('is-disabled')) return;

          // 1er clic -> confirmer
          if (!buyArmState.get(btn)?.armed) { armCardBuy(btn); return; }

          // 2e clic -> achat
          const payload = buildPurchasePayload(item);
          postToLua('buyItem', payload);
          previewSpend(payload.totalPrice, payload.currency);
          btn.classList.add('selected');
          setTimeout(()=>btn.classList.remove('selected'), 700);
          disarmCardBuy(btn);
        });

        // Sur le daily store on force toutes les cartes à la même taille (span=1)
        const rawSpan = Number(item.span ?? item.slots ?? 1) || 1;
        const span = mysteryMode ? 1 : rawSpan;
        card.dataset.span = span;

        const sInfo = streakFrom(item);
        if (sInfo.active && (sInfo.count > 0 || sInfo.bonus > 0)){
          card.insertAdjacentHTML('afterbegin', makeStreakBadgeHTML(sInfo));
        }

        frag.appendChild(card);
      });

      gridEl.appendChild(frag);
      layoutGridSpans(gridEl);
      refreshGridAffordability();
    }

    function refreshGridAffordability() {
      const isL = isLoyaltyPage();
      const balance = isL ? (state.loyaltyPoints || 0) : (state.coins || 0);
      const items = state.pageItems || [];
      const byId = new Map();
      for (let i = 0; i < items.length; i++) byId.set(Number(items[i].id), items[i]);
      document.querySelectorAll('.card .buy[data-id]').forEach(btn => {
          const id = Number(btn.dataset.id);
          const item = byId.get(id);
          if (!item) return;
          const pinfo = priceInfoFor(item, isL);
          const left = Number(item.stockLeft);
          const isLimited = !!item.limited;
          const isSoldOut = isLimited && (!!item.soldOut || (Number.isFinite(left) && left <= 0));
          const unaffordable = pinfo.final > balance;
          const dailyOff = isDailyUnavailable(item);
          const disable = isSoldOut || unaffordable || dailyOff;
          btn.disabled = disable;
          btn.classList.toggle('is-disabled', disable);
          btn.setAttribute('aria-disabled', disable ? 'true' : 'false');
          btn.title = disable ? (dailyOff ? "Pas dans votre Daily Store aujourd'hui" : (isSoldOut ? 'Épuisé' : 'Fonds insuffisants')) : '';
      });
    }

    function openShop(data){
      try{
        document.body.classList.remove('hidden');
        veil?.classList.add('show');
        state.isOpen = true;

        const d = data?.data || {};

        state.coins         = d.coins   ?? state.coins;
        state.serverName    = d.serverName ?? state.serverName;
        state.serverLogo    = d.serverLogo ?? state.serverLogo;
        state.uniqueCode    = d.uniqueCode ?? state.uniqueCode;
        state.loyaltyPoints = d.loyaltyPoints ?? state.loyaltyPoints;
        state.isVip         = !!d.isVip;
        state.vipName       = d.vipName || d.vipStatus || null;

        coinsEl.textContent = state.coins;
        if (d.avatar && avatarEl) avatarEl.src = d.avatar;   // ✅ safe

        state.buttons = Array.isArray(d.buttons) ? d.buttons.slice() : buttonsConfigDefault.slice();

        // Force-remove des catégories désactivées sur ce serveur (Elite + Boost Farm)
        // au cas où le backend les renverrait dans `d.buttons`.
        state.buttons = state.buttons.filter(b => b.page !== 'elite' && b.page !== 'exclusive');

        // 👉 S'assure que le bouton 'fidelite' existe dans le menu (à la fin par défaut)
        const hasFidBtn = state.buttons.some(b => b.page === 'fidelite');
        if (!hasFidBtn) {
          state.buttons.push({ page:'fidelite', name:'Fidélité', icon:'loyalty_icon' });
        }

        // 👉 Idem pour la wishlist (au cas où le backend renverrait ses propres boutons)
        if (!state.buttons.some(b => b.page === 'wishlist')) {
          state.buttons.push({ page:'wishlist', name:'Wishlist', icon:'wishlist_icon', sub:'Vos coups de cœur' });
        }

        state.isAdmin = !!d.isAdmin;
        state.isElite = !!d.isElite;
        adminFab?.classList.toggle('hidden', !state.isAdmin);

        renderBrand();
        renderWallet();
        renderMenu();
        // top contributeurs du mois (plusieurs alias tolérés)
        renderTopContribs(
          d.topContributors || d.top_contributors || d.top || d.topDonators ||
          d.topDonatorsMonth || d.donators || d.contributors || []
        );
      } catch (e){

    function updateCoins(amount){
      amount = Number(amount) || 0;
      const changed = amount !== state.coins;
      state.coins = amount;
      coinsEl.textContent = fmt(amount);
      if (changed) {
        coinsEl.animate([
          { transform:'scale(1)', filter:'brightness(1)' },
          { transform:'scale(1.15)', filter:'brightness(1.3)' },
          { transform:'scale(1)', filter:'brightness(1)' }
        ], { duration: 400, easing: 'cubic-bezier(.2,.8,.2,1)' });
      }
      // dans updateCoins
      refreshGridAffordability();
      window.dispatchEvent(new Event('coinsChanged'));
    }

    function updateLoyalty(points){
      points = Number(points) || 0;
      const changed = points !== state.loyaltyPoints;
      state.loyaltyPoints = points;
      loyaltyEl.textContent = fmt(points);
      if (changed) {
        loyaltyEl.animate([
          { transform:'scale(1)', filter:'brightness(1)' },
          { transform:'scale(1.15)', filter:'brightness(1.3)' },
          { transform:'scale(1)', filter:'brightness(1)' }
        ], { duration: 400, easing: 'cubic-bezier(.2,.8,.2,1)' });
      }
      // dans updateLoyalty
      refreshGridAffordability();
      window.dispatchEvent(new Event('loyaltyChanged'));

    // Aperçu local après achat (optimiste)
    function previewSpend(amount, currency){
      const a = Math.max(0, Number(amount)||0);
      if (!a) return;
      markPendingSpend(currency, a);
      if (currency === 'loyalty'){
        updateLoyalty(Math.max(0, (state.loyaltyPoints||0) - a));
      } else {
        updateCoins(Math.max(0, (state.coins||0) - a));
      }
    }

    // 🔎 Applique le filtre sur la page courante et re-render
    function applySearchAndRender() {
      const q = (s => (s||'').toString().toLowerCase()
                          .normalize('NFD').replace(/[\u0300-\u036f]/g,''))(searchInput.value);

      // Page accessoires d'armes : rendu dynamique propre, pas de filtre produits
      if (state.current === 'weaponacc') {
        renderWeaponAcc();
        return;
      }

      // 👇 NEW: si on est en admin, on filtre le tableau admin et on rerend le panel
      if (state.current === 'admin') {
        const base = state.adminData;
        const filtered = !q ? base : base.filter(p => {
          const inName = p.name && p.name.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').includes(q);
          const inId   = String(p.id||'').includes(q);
          const inPrice= String(p.price||'').includes(q);
          const inSold = String(p.sold||'').includes(q);
          return inName || inId || inPrice || inSold;
        });
        renderAdmin(filtered);
        return; // 👈 important : on ne tombe pas dans le rendu produits
      }

      // 🔎 produits (comportement actuel)
      const filtered = !q ? state.pageItems : state.pageItems.filter(it=>{
        const inName = (it.name||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').includes(q);
        const inPrice = String(it.price||'').includes(q);
        const inId = String(it.id||'').includes(q);
        return inName || inPrice || inId;
      });
      renderItems({ page: state.current, title: state.pageTitle, items: filtered });
    }

    function accRow(cat, comp, installed, owned){
      const btnBase = 'padding:7px 12px;border-radius:8px;border:0;cursor:pointer;font-weight:600;font-size:13px;';
      // price vient du serveur (accessoryPrice) ; 500 = forfait par defaut.
      const price = Number.isFinite(Number(comp.price)) ? Number(comp.price) : 500;
      // installed = accessoire boutique monté dans cette catégorie (gérable: retrait)
      // owned     = déjà présent sur l'arme (boutique OU d'origine), donc pas à racheter
      let actionBtn;
      if (installed){
        actionBtn = `<button data-acc-act="remove" data-cat="${accEsc(cat)}" data-comp="${accEsc(comp.componentID)}" style="${btnBase}background:rgba(230,80,80,.9);color:#fff;">Retirer</button>`;
      } else if (owned){
        actionBtn = `<span style="${btnBase}background:rgba(255,255,255,.06);color:#9fb4c7;cursor:default;">Déjà possédé</span>`;
      } else {
        actionBtn = price > 0
          ? `<button data-acc-act="buy" data-cat="${accEsc(cat)}" data-comp="${accEsc(comp.componentID)}" style="${btnBase}background:#f0b429;color:#1a1a1a;">Acheter · ${price}</button>`
          : `<button data-acc-act="buy" data-cat="${accEsc(cat)}" data-comp="${accEsc(comp.componentID)}" style="${btnBase}background:#4fc98a;color:#0f1a14;">Équiper · Gratuit</button>`;
      }
      let badge;
      if (installed){
        badge = `<span style="font-size:11px;padding:2px 8px;border-radius:999px;background:rgba(80,200,120,.18);color:#7fe0a0;">Installé</span>`;
      } else if (owned){
        badge = `<span style="font-size:11px;padding:2px 8px;border-radius:999px;background:rgba(90,160,255,.18);color:#9fc4ff;">Sur l'arme</span>`;
      } else {
        badge = `<span style="font-size:11px;padding:2px 8px;border-radius:999px;background:rgba(255,255,255,.06);color:#8a93a0;">Non possédé</span>`;
      }
      return `<div style="display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 14px;margin:6px 0;border:1px solid rgba(255,255,255,.08);border-radius:10px;background:rgba(255,255,255,.03);">
        <div style="display:flex;align-items:center;gap:10px;min-width:0;">
          <span style="font-weight:600;">${accEsc(comp.label || comp.componentID)}</span>
          ${badge}
        </div>
        <div style="display:flex;gap:8px;flex:0 0 auto;">
          <button data-acc-act="test" data-cat="${accEsc(cat)}" data-comp="${accEsc(comp.componentID)}" style="${btnBase}background:rgba(255,255,255,.1);color:#fff;">Tester</button>
          ${actionBtn}
        </div>
      </div>`;
    }

    let accConfirmKeyHandler = null;

    function closeAccConfirm(){
      const root = document.getElementById('accConfirmRoot');
      if (root) root.innerHTML = '';
      if (accConfirmKeyHandler){
        window.removeEventListener('keydown', accConfirmKeyHandler, true);
        accConfirmKeyHandler = null;
      }
    }

    function showAccConfirm(title, sub, onYes){
      closeAccConfirm();
      let root = document.getElementById('accConfirmRoot');
      if (!root){ root = document.createElement('div'); root.id = 'accConfirmRoot'; document.body.appendChild(root); }
      root.innerHTML = `
        <div style="position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.6);">
          <div style="width:380px;max-width:90%;background:#1c1f26;border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:20px;text-align:center;">
            <div style="font-size:18px;font-weight:700;margin-bottom:8px;">${accEsc(title)}</div>
            <div style="font-size:13px;opacity:.75;margin-bottom:18px;">${accEsc(sub)}</div>
            <div style="display:flex;gap:10px;justify-content:center;">
              <button id="accConfirmNo" style="padding:9px 16px;border:0;border-radius:8px;cursor:pointer;background:rgba(255,255,255,.12);color:#fff;font-weight:600;">Annuler</button>
              <button id="accConfirmYes" style="padding:9px 16px;border:0;border-radius:8px;cursor:pointer;background:rgba(230,80,80,.9);color:#fff;font-weight:600;">Retirer</button>
            </div>
          </div>
        </div>`;
      document.getElementById('accConfirmNo').addEventListener('click', closeAccConfirm);
      document.getElementById('accConfirmYes').addEventListener('click', ()=>{ closeAccConfirm(); if (onYes) onYes(); });
      // Echap ferme le pop-up seulement (capture : passe avant le keydown
      // global de la boutique qui, lui, ferme toute l'interface).
      accConfirmKeyHandler = (e)=>{
        if (e.key !== 'Escape') return;
        e.preventDefault();
        e.stopImmediatePropagation();
        closeAccConfirm();
      };
      window.addEventListener('keydown', accConfirmKeyHandler, true);
    }

    function renderWeaponAcc(){
      const wa = state.weaponAcc || {};
      if (!wa.ready){
        gridEl.innerHTML = (wa.reason === 'noweapon')
          ? accMsgBox("Prenez une arme en main", "Équipez une arme via votre barre d'accès rapide, puis rouvrez cet onglet.")
          : accMsgBox("Chargement…", "Récupération de l'arme en main.");
        return;
      }
      const cats = wa.catalog || {};
      const present = ACC_CATEGORY_ORDER.filter(c => Array.isArray(cats[c]) && cats[c].length);
      if (!present.length){
        gridEl.innerHTML = accMsgBox("Aucun accessoire", "Cette arme ("+accEsc(wa.weapon||'')+") n'a pas d'accessoire disponible.");
        return;
      }
      const ownedSet = new Set(Array.isArray(wa.owned) ? wa.owned : []);
      let html = `<div style="grid-column:1/-1;font-size:13px;opacity:.7;margin:0 0 6px;">Arme en main : <b>${accEsc(wa.weapon||'')}</b></div>`;
      for (const c of present){
        html += `<section style="grid-column:1/-1;margin-bottom:14px;">
          <h3 style="margin:4px 0 8px;font-size:15px;letter-spacing:.3px;text-transform:uppercase;opacity:.85;">${accEsc(ACC_CATEGORY_LABELS[c]||c)}</h3>`;
        for (const comp of cats[c]){
          const installed = wa.current && wa.current[c] === comp.componentID;
          const owned = installed || ownedSet.has(comp.componentID);
          html += accRow(c, comp, installed, owned);
        }
        html += `</section>`;
      }
      gridEl.innerHTML = html;

      gridEl.querySelectorAll('button[data-acc-act]').forEach(btn=>{
        btn.addEventListener('click', ()=>{
          const act  = btn.getAttribute('data-acc-act');
          const cat  = btn.getAttribute('data-cat');
          const comp = btn.getAttribute('data-comp');
          if (act === 'test'){
            postToLua('weaponAccTest', { weapon: wa.weapon, componentID: comp, category: cat, owned: Array.isArray(wa.owned) ? wa.owned : [] });
          } else if (act === 'buy'){
            postToLua('weaponAccBuy', { weapon: wa.weapon, id: wa.id, category: cat, componentID: comp });
          } else if (act === 'remove'){
            showAccConfirm("Retirer cet accessoire ?", "L'accessoire sera détaché de l'arme. Aucun remboursement.", ()=>{
              postToLua('weaponAccRemove', { weapon: wa.weapon, id: wa.id, category: cat });
            });
          }
        });
      });
    }

    function openWeaponAccPage(){
      const pageEl = document.getElementById('page');
      pageEl.classList.remove('admin-scroll','daily-layout','no-page-scroll');
      gridEl.classList.remove('admin-mode');
      state.current = 'weaponacc';
      crumbEl.textContent = 'weaponacc';
      state.pageTitle = "Accessoires d'armes";
      pageTitleEl.textContent = state.pageTitle;
      if (dailyInterval){ clearInterval(dailyInterval); dailyInterval = null; }
      dailyTimerEl.classList.add('hidden');
      const dailyWrap = dailyRefreshBtn?.parentElement; if (dailyWrap) dailyWrap.classList.add('hidden');
      if (searchInput) searchInput.value = '';
      renderWeaponAcc();
    }

    function onWeaponAccList(data){
      if (!data || !data.ok){
        state.weaponAcc = { ready:false, reason:(data && data.reason) || 'noweapon', weapon:null, id:null, catalog:{}, current:{}, owned:[] };
      } else {
        state.weaponAcc = { ready:true, reason:null, weapon:data.weapon, id:data.id, catalog:data.catalog||{}, current:data.current||{}, owned:Array.isArray(data.owned)?data.owned:[] };
      }
      if (state.current === 'weaponacc') renderWeaponAcc();
    }

    function onWeaponAccUpdate(data){
      if (!state.weaponAcc) return;
      state.weaponAcc.current = state.weaponAcc.current || {};
      state.weaponAcc.owned = Array.isArray(state.weaponAcc.owned) ? state.weaponAcc.owned : [];
      if (data.removed){
        const old = state.weaponAcc.current[data.category];
        delete state.weaponAcc.current[data.category];
        if (old) state.weaponAcc.owned = state.weaponAcc.owned.filter(c => c !== old);
      } else {
        state.weaponAcc.current[data.category] = data.componentID;
        if (data.componentID && !state.weaponAcc.owned.includes(data.componentID)){
          state.weaponAcc.owned.push(data.componentID);
        }
      }
      if (state.current === 'weaponacc' && state.weaponAcc.ready) renderWeaponAcc();
    }

    function showPage(page, content){
      const pageEl = document.getElementById('page');
      pageEl.classList.remove('admin-scroll');
      document.getElementById('page').classList.remove('no-page-scroll');
      if (page !== 'home') pageEl.classList.remove('daily-layout');

      state.current = page;
      state.pageItems = Array.isArray(content?.items) ? content.items.slice() : [];

      renderMenu();

      if (page === 'admin'){
        // stocke les ventes envoyées par le serveur
        state.adminData = Array.isArray(content?.sales) ? content.sales.slice() : [];
        showAdmin();
        return;
      }

      if (page === 'elite'){
        showElite();
        return;
      }

      // reset vue admin si on revient sur un catalogue
      gridEl.classList.remove('admin-mode');

      crumbEl.textContent = page;
      state.pageTitle = content?.title || ('Catalogue - ' + page);
      pageTitleEl.textContent = state.pageTitle;

      const dailyWrap = dailyRefreshBtn?.parentElement;
      if (page === 'home') {
        dailyTimerEl.classList.remove('hidden');
        dailyWrap?.classList.remove('hidden');
        pageEl.classList.add('daily-layout');
        if (typeof content?.dailySeconds !== 'undefined') {
          startDailyCountdown(content.dailySeconds);
        }
      } else {
        if (dailyInterval) { clearInterval(dailyInterval); dailyInterval = null; }
        dailyTimerEl.classList.add('hidden');
        dailyWrap?.classList.add('hidden');
        pageEl.classList.remove('daily-layout');
      }

      searchInput.value = '';
      applySearchAndRender();
    }

    function closeShop(){
      state.isOpen = false;
      veil?.classList.remove('show');
      document.body.classList.add('hidden');
      // Jamais laisser un pop-up de confirmation orphelin : il recouvrirait
      // toute la boutique (z-index 99999) a la prochaine ouverture.
      closeAccConfirm();
    }

    // 🔎 Events de recherche (live + ESC pour clear)
    searchInput.addEventListener('input', applySearchAndRender);
    searchInput.addEventListener('keydown', (e)=>{
      if (e.key === 'Escape') {
        e.preventDefault();
        searchInput.value = '';
        applySearchAndRender();
      }
    });

    // NUI events
    window.addEventListener('message', (event)=>{
      const data = event.data || {};
      switch(data.action){
        case 'open': openShop(data); break;
        case 'updateCoins':
          if (!shouldIgnoreCoinsUpdate()) {
            updateCoins(data.coins);
          }
          break;

        case 'updateAdminData':
          state.adminData = Array.isArray(data.sales) ? data.sales.slice() : [];
          if (state.current === 'admin') {
            renderAdmin(state.adminData); // refresh direct si déjà dessus
          }
          break;

        case 'updateTopContributors':
          renderTopContribs(data.list || data.top || data.topContributors || []);
          break;

        case 'updateLoyalty':
          updateLoyalty(data.loyaltyPoints ?? data.points ?? data.value);
          if (state.pendingSpend?.currency === 'loyalty') {
            state.pendingSpend = null; // on consomme le pending une fois la bonne MAJ reçue
          }
          break;
        case 'showPage': showPage(data.page, data.content); break;
        case 'close': closeShop(); break;
        case 'coinOffer': renderCoinOffer(data.offer || {}); break;
        case 'weaponAccList': onWeaponAccList(data); break;
        case 'weaponAccUpdate': onWeaponAccUpdate(data); break;
      }
    });

    // === Offre "double ton achat de coins" =================================
    function openCoinsStore(){
      try {
        if (window.invokeNative) { window.invokeNative('openUrl', COINS_URL); }
        else { window.open(COINS_URL, "_blank", "noopener"); }
      } catch { window.open(COINS_URL, "_blank", "noopener"); }
    }

    function fmtCoins(n){
      try { return Number(n||0).toLocaleString('fr-FR'); } catch { return String(n||0); }
    }

    function closeCoinOfferPopup(){
      const root = document.getElementById('coinOfferModal');
      if (!root) return;
      root.classList.remove('show');
      root.innerHTML = '';
    }

    function showCoinOfferPopup(bonus){
      const root = document.getElementById('coinOfferModal');
      if (!root) return;
      root.innerHTML = `
        <div class="modal-card coin-offer-card">
          <div class="co-glow" aria-hidden="true"></div>
          <button class="co-x" id="coClose2" aria-label="Fermer">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none"><path d="M6 6l12 12M18 6l-12 12" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
          </button>
          <div class="co-badge">OFFRE LIMITÉE · 60 MIN</div>
          <div class="co-coin" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="64" height="64" fill="none">
              <ellipse cx="12" cy="6" rx="8" ry="2.6" fill="#FFE68A" stroke="#6a3f00" stroke-width="1"/>
              <path d="M4 6v5c0 1.4 3.6 2.6 8 2.6s8-1.2 8-2.6V6" fill="#FFC107" stroke="#6a3f00" stroke-width="1"/>
              <path d="M4 11v5c0 1.4 3.6 2.6 8 2.6s8-1.2 8-2.6v-5" fill="#FFB300" stroke="#6a3f00" stroke-width="1"/>
            </svg>
          </div>
          <h3 class="co-title">Doublez votre dernier achat de coins</h3>
          <p class="co-sub">Rachetez au moins le même montant de coins et recevez
            <b class="co-amt">+${fmtCoins(bonus)} coins</b> en bonus !</p>
          <div class="co-actions">
            <button class="primary co-buy" id="coBuy"><span class="co-btn-txt">Acheter</span></button>
            <button class="secondary co-close" id="coClose"><span class="co-btn-txt">Fermer</span></button>
          </div>
        </div>`;
      root.classList.add('show');
      const buy = document.getElementById('coBuy');
      const close = document.getElementById('coClose');
      const x = document.getElementById('coClose2');
      if (buy) buy.onclick = () => { openCoinsStore(); closeCoinOfferPopup(); };
      if (close) close.onclick = closeCoinOfferPopup;
      if (x) x.onclick = closeCoinOfferPopup;
      root.onclick = (e) => { if (e.target === root) closeCoinOfferPopup(); };
    }

    function renderCoinOffer(offer){
      const info = document.getElementById('coinOfferInfo');
      const amtEl = document.getElementById('coinOfferInfoAmt');
      if (!offer || !offer.active){
        info?.classList.add('hidden');
        closeCoinOfferPopup();
        return;
      }
      const bonus = Number(offer.bonus || 0);
      if (amtEl) amtEl.textContent = fmtCoins(bonus);
      info?.classList.remove('hidden');
      if (offer.popup) showCoinOfferPopup(bonus);
    }

    // NUI post helper
    function postToLua(name, payload = {}) {
      const resourceName = "sunlife_ui/boutique";
      fetch(`https://${resourceName}/${name}`, {
        method: "POST",
        headers: { "Content-Type": "application/json; charset=UTF-8" },
        body: JSON.stringify(payload)
      }).catch((err) => console.error("NUI fetch error:", err));
    }

    // Close preview
    document.getElementById('closeBtn').addEventListener('click', ()=>{
      closeShop();
      postToLua("close")
    });

    const addCoinsBtn = document.querySelector('.primary.add-coins');
    const COINS_URL = "https://sunliferp.com";

    if (addCoinsBtn) {
      addCoinsBtn.addEventListener('click', (e) => {
        e.preventDefault();

        // petite anim visuelle (facultatif)
        addCoinsBtn.classList.add('selected');
        setTimeout(() => addCoinsBtn.classList.remove('selected'), 600);

        // FiveM NUI → ouvre dans le navigateur
        try {
          if (window.invokeNative) {
            window.invokeNative('openUrl', COINS_URL);
          } else {
            // fallback web
            window.open(COINS_URL, "_blank", "noopener");
          }
        } catch {
          // fallback ultime
          window.open(COINS_URL, "_blank", "noopener");
        }
      });
    }

    // === Fermer la boutique sur ESC ou clic hors interface (gauche/droit) ===
    const appRoot = document.getElementById('app');

    function isInsideUI(target) {
      if (appRoot?.contains(target)) return true;
      // Autorise les clics sur les UI admin que tu crées hors #app
      const adminCtx = document.getElementById('adminCtx');
      const adminModal = document.getElementById('adminLimitedModal');
      if (adminCtx && adminCtx.contains(target)) return true;
      if (adminModal && adminModal.contains(target)) return true;
      // Pop-up de confirmation des accessoires d'armes (monte dans le body) :
      // sans cette ligne, un clic dessus est vu comme "hors UI" -> closeAll().
      const accConfirm = document.getElementById('accConfirmRoot');
      if (accConfirm && accConfirm.contains(target)) return true;
      return false;
    }

    const FADE_MS = 220; // durée en ms (à matcher avec le CSS)

    function closeAll(){
      if (!state.isOpen) return;
      closeShop();
      // laisse la transition se terminer avant de prévenir le jeu
      setTimeout(()=> postToLua('close'), FADE_MS);
    }

    document.getElementById('closeBtn').addEventListener('click', closeAll);

    window.addEventListener('keydown', (e) => {
      if (!state.isOpen) return;
      const isEsc = e.key === 'Escape';
      const isF1  = e.key === 'F1' || e.keyCode === 112;
      if (isEsc || isF1) {
        e.preventDefault();           // évite l’aide navigateur sur F1
        e.stopPropagation?.();
        closeAll();
      }
    });

    // Clic gauche/droit/tactile hors interface -> close
    const outsideHandler = (e) => {
      if (!state.isOpen) return;
      if (!isInsideUI(e.target)) {
        e.preventDefault();
        e.stopPropagation();
        closeAll();
      }
    };

        (function(){
        function ensurePurchaseStyles(){
            if (document.getElementById('purchaseStyles')) return;
            const css = `
            .purchase-ok{position:absolute;z-index:50;display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border-radius:999px;background:linear-gradient(135deg,#28a745,#1f8a39);color:#fff;font-weight:700;font-size:13px;box-shadow:0 6px 18px rgba(0,0,0,.25);transform:translateY(-6px);opacity:0;animation:purchaseIn .25s ease-out forwards}
            .purchase-ok .ico{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:999px;background:rgba(255,255,255,.15)}
            .purchase-ok .ico svg{width:14px;height:14px}
            .purchase-ok.--card{top:8px;right:8px}
            .purchase-ok.--modal{left:50%;bottom:12px;transform:translate(-50%,6px);animation:purchaseInModal .25s ease-out forwards}
            @keyframes purchaseIn{to{transform:translateY(0);opacity:1}}
            @keyframes purchaseInModal{to{transform:translate(-50%,0);opacity:1}}
            @keyframes purchaseOut{to{transform:translateY(-6px);opacity:0}}
            @keyframes purchaseOutModal{to{transform:translate(-50%,6px);opacity:0}}
            `;
            const s = document.createElement('style');
            s.id = 'purchaseStyles';
            s.textContent = css;
            document.head.appendChild(s);
        }

        function checkSVG(){
            return `<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M20 6L9 17l-5-5" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
        }

        function spawnBadge(host, text, kind, duration){
            ensurePurchaseStyles();
            const el = document.createElement('div');
            el.className = 'purchase-ok ' + (kind === 'modal' ? '--modal' : '--card');
            el.setAttribute('role','status');
            el.setAttribute('aria-live','polite');
            el.innerHTML = `<span class="ico">${checkSVG()}</span><span class="txt">${text||'Achat validé'}</span>`;
            host.appendChild(el);
            const outAnim = kind === 'modal' ? 'purchaseOutModal' : 'purchaseOut';
            setTimeout(()=>{ el.style.animation = outAnim + ' .25s ease-in forwards'; setTimeout(()=>{ el.remove(); }, 240); }, Math.max(800, Number(duration)||3500));
        }

        function findCardById(id){
            if (id==null) return null;
            const btn = document.querySelector(`.card .buy[data-id="${id}"]`);
            return btn ? btn.closest('.card') : null;
        }

        function findCardByName(name){
            if (!name) return null;
            const nodes = document.querySelectorAll('.card .body .name');
            const n = name.toString().trim().toLowerCase();
            for (const t of nodes){
                if (t.textContent.trim().toLowerCase() === n) return t.closest('.card');
            }
            return null;
        }

        function showOnCard(item, duration){
            const id = typeof item === 'object' ? (item.id ?? item.itemId ?? null) : (Number(item)||null);
            const name = typeof item === 'object' ? (item.name ?? '') : '';
            let card = findCardById(id) || findCardByName(name);
            if (!card) return false;
            const host = card.querySelector('.thumb') || card;
            spawnBadge(host, 'Achat validé', 'card', duration);
            return true;
        }

        function normalizedText(el){
            return (el?.textContent||'').toString().trim().toLowerCase();
        }

        function showInModalIfMatch(item, duration){
            const modal = document.getElementById('productModal');
            if (!modal || !modal.classList.contains('show')) return false;
            const wantId = typeof item === 'object' ? (item.id ?? item.itemId ?? null) : null;
            const wantName = typeof item === 'object' ? (item.name ?? '') : '';
            let matches = false;
            if (wantName){
                const titleEl = modal.querySelector('.header .title');
                if (titleEl && normalizedText(titleEl) === wantName.toString().trim().toLowerCase()) matches = true;
            }
            if (!matches && wantId!=null){
                const chip = modal.querySelector('#packChip .txt');
                const anyId = modal.querySelector('[data-current-id]');
                if (anyId && Number(anyId.getAttribute('data-current-id')) === Number(wantId)) matches = true;
            }
            if (!matches) {
                if (!wantName) return false;
            }
            const hero = modal.querySelector('.hero') || modal.querySelector('.dialog') || modal;
            spawnBadge(hero, 'Achat validé', 'modal', duration);
            return true;
        }

        function onPurchaseSuccess(data){
            const item = data?.item || {};
            const duration = data?.duration ?? 3500;
            const okModal = showInModalIfMatch(item, duration);
            const okCard = showOnCard(item, duration);
            if (!okCard && !okModal){
                const top = document.querySelector('.topbar .actions') || document.body;
                spawnBadge(top, 'Achat validé', 'card', duration);
            }
        }

        window.addEventListener('message', (ev)=>{
            const d = ev.data || {};
            if (d.action === 'purchaseSuccess') onPurchaseSuccess(d);
        });
    })();

    // on capte tôt pour éviter que d’autres handlers consomment l’event
    document.addEventListener('mousedown', outsideHandler, true);   // clic gauche/milieu/droit
    document.addEventListener('contextmenu', outsideHandler, true); // clic droit (menu contextuel)
    document.addEventListener('touchstart', outsideHandler, true);  // mobile
  </script>
</body>
