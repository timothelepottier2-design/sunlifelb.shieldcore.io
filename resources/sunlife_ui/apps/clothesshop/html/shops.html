<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clotheshop</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <style>
        /* =====================================================================
           SunLife — Clotheshop UI
           Refonte au style SNL_Boutique : dark + carré + Inter +
           orange SunLife pur (rgb 255,117,31). Aucun ton jaune/vert,
           tous les sélecteurs HTML/JS d'origine sont conservés.
           ===================================================================== */
        :root{
            /* Palette dark (boutique) */
            --bg-1:#0a0a0a;
            --bg-2:#101010;
            --bg-3:#181818;
            --panel:#141414;
            --panel-2:#1c1c1c;
            --panel-3:#252525;

            --line:rgba(255,255,255,.06);
            --line-strong:rgba(255,255,255,.10);

            --text:#f2f2f2;
            --text-2:#d0d0d0;
            --muted:#8a8a8a;

            /* Orange SunLife pur — RGB 255,117,31 = #ff751f */
            --accent:        #ff751f;
            --accent-2:      #ff8a3c;
            --accent-3:      #e6661a;
            --accent-soft:   rgba(255,117,31,.16);
            --accent-soft-2: rgba(255,117,31,.30);
            --accent-ring:   rgba(255,117,31,.55);
            --accent-shadow: rgba(255,117,31,.35);
            --accent-glow:   rgba(255,117,31,.45);

            /* Aliases compat (anciens noms réutilisés par l'HTML/JS) */
            --gold:  var(--accent);
            --gold2: var(--accent-2);
            --ring:  var(--accent-ring);
            --ghost: var(--accent-soft);
            --ghost2: var(--accent-soft-2);
            --bg:    transparent;
            --panel2: rgba(255,255,255,.06);

            --danger:#ff5c7a;

            --shadow-sm: 0 4px 12px rgba(0,0,0,.30);
            --shadow-md: 0 10px 28px rgba(0,0,0,.45);
            --shadow-lg: 0 20px 60px rgba(0,0,0,.55);
            --shadow:    0 10px 30px rgba(255,117,31,.20);

            /* Coins carrés partout (boutique) */
            --r: 0;

            --font: "Inter", ui-sans-serif, system-ui, -apple-system,
                    "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            --ease-smooth: cubic-bezier(.22,.61,.36,1);
            --ring-fill: rgba(255,117,31,.55);
        }

        :root{
            --fw-title: 800;
            --fw-strong: 700;
            --fw-text: 500;
        }

        *{ box-sizing:border-box; }

        html, body, button, input, textarea, select{
            font-family: var(--font) !important;
        }

        html, body{
            width:100%; height:100%; margin:0; padding:0;
            overflow:hidden;
            background:transparent;
            color: var(--text);
            font-family: var(--font);
        }
        body{
            display:flex; align-items:center; justify-content:flex-start;
            font-feature-settings: "ss01","cv11";
            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
        }

        /* =====================================================================
           Layout principal
           ===================================================================== */
        .wrap{
            /* Réduit (~ -6% = ~3cm sur écran 1080p) pour ne plus empiéter sur
               le rendu du perso qui est au centre de l'écran. */
            width: 36%;
            height: 84%;
            margin-left: 2%;
            display:grid;
            /* Sidebar bien plus fine (~10% au lieu de 26%) pour ne plus avoir
               de vide horizontal autour des boutons en colonne. Le panneau
               principal récupère la largeur. */
            grid-template-columns: 10% 90%;
            gap: 1.4%;
            padding: 1.2%;
            border-radius: 0;
            position: relative;
        }

        .sidebar{
            height: 100%;
            border-radius: 0;
            background: linear-gradient(180deg, rgba(20,20,20,.96), rgba(20,20,20,.92));
            border: 1px solid var(--line-strong);
            box-shadow: var(--shadow-md);
            display:flex;
            flex-direction:column;
            justify-content: flex-start;
            padding: .55rem .55rem .7rem;
            gap: .45rem;
            overflow:hidden;
            position: relative;
        }

        /* Liseré orange à gauche du sidebar */
        .sidebar::before{
            content:"";
            position:absolute; left:0; top:0; bottom:0;
            width: 3px;
            background: linear-gradient(180deg, var(--accent) 0%, transparent 100%);
            box-shadow: 0 0 14px var(--accent-glow);
        }

        /* Brand minimal : pas de titre "Clotheshop", on garde juste le
           pill genre (M/F) en haut à droite pour rester compact. */
        .brand{
            width:100%;
            display:flex;
            align-items:center;
            justify-content:flex-end;
            gap: .4rem;
            padding: 0;
            margin: 0;
            border-radius: 0;
            background: transparent;
            border: 0;
            position: relative;
            min-height: 0;
        }
        .brand::before{ display: none; }

        /* On masque tout le bloc gauche (icône + "Clotheshop" + sous-titre) */
        .brandLeft{ display: none !important; }

        .brandIcon{
            width: 2.4rem;
            height: 2.4rem;
            border-radius: 0;
            display:grid;
            place-items:center;
            background: rgba(255,117,31,.12);
            border: 1px solid rgba(255,117,31,.30);
            flex: 0 0 auto;
            color: var(--accent);
            box-shadow: inset 0 0 0 1px rgba(0,0,0,.20);
        }
        .brandIcon svg{
            width: 1.25rem; height: 1.25rem;
            fill:none; stroke: currentColor; stroke-width:2;
            stroke-linecap:round; stroke-linejoin:round;
        }

        .brand .t{ min-width:0; display:flex; flex-direction:column; gap:.05rem; }
        .brand .a{
            font-size: .92rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: .14em;
            color: var(--text);
            white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
        }
        .brand .b{
            font-size: .72rem;
            font-weight: 600;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: .12em;
            white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
        }

        .pill{
            min-width: 1.5rem;
            height: 1.5rem;
            padding: 0 .4rem;
            display:grid;
            place-items:center;
            border-radius: 0;
            background: var(--accent);
            color: #1a0d05;
            font-weight: 900;
            letter-spacing: .04em;
            font-size: .72rem;
            border: 1px solid var(--accent-3);
            box-shadow: 0 0 8px var(--accent-glow);
        }

        /* =====================================================================
           Menu (icônes catégories)
           - 1 SEULE colonne : toutes les icônes empilées sur la meme ligne
             verticale. Le sidebar fait 26% de la largeur de l'app, donc chaque
             cellule occupe toute la largeur dispo du sidebar.
           - flex: 1 1 auto + overflow-y: auto pour que la liste scroll si
             jamais elle dépasse la hauteur (15 catégories ~55rem total).
           - align-content: start pour packer les rangées en haut, sans gap
             vertical étiré.
           ===================================================================== */
        .menu, .menuGrid{
            flex: 1 1 auto;
            min-height: 0;
            overflow-y: auto;
            overflow-x: hidden;
            display: grid;
            /* 1 colonne pleine largeur de la sidebar (qui est elle-même
               réduite à ~10% de la wrap, cf. .wrap). Plus aucun vide
               horizontal autour des boutons. */
            grid-template-columns: 1fr;
            grid-auto-rows: 2.8rem;
            align-content: start;
            justify-items: stretch;
            gap: .3rem;
            padding-right: .15rem;
        }

        .mitem{
            position: relative;
            width: 100%;
            height: 100%;
            display: grid;
            place-items: center;
            border: 1px solid var(--line-strong);
            background: linear-gradient(180deg, var(--panel-2), var(--panel));
            color: var(--text-2);
            cursor: pointer;
            border-radius: 0;
            transition: transform .15s var(--ease-smooth),
                        background .15s ease,
                        border-color .15s ease,
                        color .15s ease;
        }
        .mitem:hover{
            background: linear-gradient(180deg, var(--panel-3), var(--panel-2));
            color: var(--text);
            border-color: rgba(255,117,31,.35);
        }
        .mitem.active{
            color: var(--accent);
            border-color: var(--accent-ring);
            background: linear-gradient(180deg, rgba(255,117,31,.10), rgba(255,117,31,.04));
            box-shadow: inset 0 0 0 1px var(--accent-soft),
                        0 0 14px var(--accent-soft);
        }
        .mitem.active::after{
            content:"";
            position:absolute; left:0; top:0; bottom:0;
            width: 2px;
            background: var(--accent);
            box-shadow: 0 0 10px var(--accent-glow);
        }
        .mitem .ico{
            width: 1.35rem;
            height: 1.35rem;
            display:grid; place-items:center;
            color: currentColor;
        }
        .mitem .ico svg{
            width: 100%; height: 100%;
            fill: currentColor; stroke: none;
        }

        /* Tooltip catégorie */
        .catTip{
            position: fixed;
            left: 0; top: 0;
            transform: translate3d(-9999px,-9999px,0);
            z-index: 9999;
            padding: .45rem .7rem;
            border-radius: 0;
            background: var(--panel);
            border: 1px solid var(--accent-ring);
            box-shadow: 0 12px 30px rgba(0,0,0,.55), 0 0 12px var(--accent-soft);
            color: var(--text);
            font-weight: 700;
            font-size: .80rem;
            text-transform: uppercase;
            letter-spacing: .12em;
            white-space: nowrap;
            pointer-events: none;
            opacity: 0;
            transition: opacity .10s ease;
        }
        .catTip.show{ opacity: 1; }

        /* =====================================================================
           Panel principal
           ===================================================================== */
        .panel{
            position: relative;
            height: 100%;
            display: flex;
            flex-direction: column;
            background: linear-gradient(180deg, rgba(20,20,20,.96), rgba(20,20,20,.92));
            border: 1px solid var(--line-strong);
            box-shadow: var(--shadow-md);
            border-radius: 0;
            padding: 1rem;
            gap: .85rem;
            overflow: hidden;
        }
        .panel::before{
            content:"";
            position:absolute; left:0; top:0; right:0;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--accent), transparent);
            opacity: .55;
        }

        .top{
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: .85rem;
            padding-bottom: .65rem;
            border-bottom: 1px solid var(--line);
        }

        .title{ display:flex; flex-direction:column; gap:.15rem; min-width:0; position: relative; padding-left: .75rem; }
        .title::before{
            content:"";
            position:absolute; left:0; top:.15rem; bottom:.15rem;
            width: 4px;
            background: var(--accent);
            box-shadow: 0 0 10px var(--accent-glow);
        }
        .title .h{
            font-size: 1.05rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: .14em;
            color: var(--text);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .title .p{
            font-size: .76rem;
            font-weight: 500;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: .12em;
        }

        .actions{
            display: flex;
            align-items: center;
            gap: .5rem;
        }

        .btn{
            height: 2.4rem;
            padding: 0 .9rem;
            border: 1px solid var(--line-strong);
            background: var(--panel-2);
            color: var(--text);
            cursor: pointer;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: .10em;
            font-size: .76rem;
            border-radius: 0;
            transition: background .15s ease, border-color .15s ease, color .15s ease, transform .15s var(--ease-smooth);
        }
        .btn:hover{
            background: var(--panel-3);
            border-color: var(--accent-ring);
            color: var(--accent);
        }
        .btn:active{ transform: translateY(1px); }
        .btn.primary{
            background: var(--accent);
            border-color: var(--accent);
            color: #0b0b0b;
        }
        .btn.primary:hover{
            background: var(--accent);
            border-color: var(--accent-ring);
            color: #0b0b0b;
            filter: brightness(1.08);
        }

        .body{
            flex: 1 1 auto;
            min-height: 0;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .card{
            flex: 1 1 auto;
            min-height: 0;
            display: flex;
            flex-direction: column;
            gap: .75rem;
            background: transparent;
        }

        /* Ligne avec en-tête et search */
        .row{
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: .65rem;
        }
        .rowHead{
            padding-bottom: .35rem;
            border-bottom: 1px dashed var(--line);
            margin-bottom: .25rem;
        }

        .khead{
            display: flex;
            align-items: center;
            gap: .55rem;
            min-width: 0;
        }
        .kicon{
            width: 2.05rem;
            height: 2.05rem;
            display:grid; place-items:center;
            background: var(--accent-soft);
            border: 1px solid var(--accent-ring);
            color: var(--accent);
            border-radius: 0;
        }
        .kicon svg{
            width: 1.1rem; height: 1.1rem;
            fill: currentColor;
        }

        .row .k{ display:flex; flex-direction:column; gap:.05rem; min-width:0; }
        .row .k .a{
            font-size: .82rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: .12em;
            color: var(--text);
        }
        .row .k .b{
            font-size: .72rem;
            font-weight: 500;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: .10em;
        }

        /* Search */
        .searchWrap{
            flex: 0 0 auto;
            min-width: 12rem;
            max-width: 16rem;
        }
        .searchBox{
            position: relative;
            display: flex;
            align-items: center;
            background: var(--bg-3);
            border: 1px solid var(--line-strong);
            border-radius: 0;
            padding: 0 .65rem 0 2rem;
            height: 2.35rem;
            transition: border-color .15s ease, background .15s ease;
        }
        .searchBox:focus-within{
            border-color: var(--accent-ring);
            background: var(--bg-2);
            box-shadow: inset 0 0 0 1px var(--accent-soft);
        }
        .searchIcon{
            position: absolute;
            left: .55rem;
            top: 50%;
            transform: translateY(-50%);
            width: .9rem; height: .9rem;
            display: grid; place-items: center;
            color: var(--muted);
        }
        .searchIcon svg{ width: 100%; height: 100%; fill: currentColor; }
        .searchBox:focus-within .searchIcon{ color: var(--accent); }

        .search{
            width: 100%;
            height: 100%;
            background: transparent;
            border: 0;
            outline: 0;
            color: var(--text);
            font-weight: 600;
            font-size: .85rem;
            padding: 0;
        }
        .search::placeholder{
            color: var(--muted);
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: .10em;
            font-size: .72rem;
        }

        /* Liste de modèles */
        .modelList{
            position: relative;
            flex: 1 1 auto;
            min-height: 0;
            overflow: auto;
            padding: .15rem .35rem .25rem 0;
            display: flex;
            flex-direction: column;
            gap: .4rem;
        }
        .modelList::-webkit-scrollbar{ width: 8px; }
        .modelList::-webkit-scrollbar-track{ background: rgba(255,255,255,.04); }
        .modelList::-webkit-scrollbar-thumb{
            background: linear-gradient(180deg, var(--accent), var(--accent-3));
            border: 2px solid var(--panel);
        }

        .modelBtn{
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: .5rem;
            padding: .65rem .85rem;
            background: var(--panel-2);
            border: 1px solid var(--line-strong);
            color: var(--text-2);
            cursor: pointer;
            border-radius: 0;
            font-weight: 700;
            font-size: .85rem;
            letter-spacing: .04em;
            transition: background .15s ease, border-color .15s ease, color .15s ease, transform .12s var(--ease-smooth);
        }
        .modelBtn:hover{
            background: var(--panel-3);
            color: var(--text);
            border-color: rgba(255,117,31,.30);
        }
        .modelBtn.active{
            background: linear-gradient(180deg, rgba(255,117,31,.10), rgba(255,117,31,.04));
            border-color: var(--accent-ring);
            color: var(--accent);
            box-shadow: inset 0 0 0 1px var(--accent-soft);
        }
        .modelBtn:active{ transform: translateY(1px); }

        .modelPrice{
            font-weight: 800;
            font-size: .78rem;
            color: var(--muted);
            background: var(--bg-3);
            border: 1px solid var(--line-strong);
            padding: .25rem .55rem;
            border-radius: 0;
            text-transform: uppercase;
            letter-spacing: .08em;
            white-space: nowrap;
        }
        .modelBtn.active .modelPrice{
            color: var(--accent);
            border-color: var(--accent-ring);
            background: var(--accent-soft);
        }

        /* Variant footer (arrows + slider + payment) */
        .variantFooter{
            margin-top: .35rem;
            padding-top: .65rem;
            border-top: 1px solid var(--line);
            display: flex;
            flex-direction: column;
            gap: .55rem;
        }

        .ctrl{
            display: flex;
            align-items: center;
            gap: .45rem;
        }

        .arrow{
            width: 2.25rem;
            height: 2.25rem;
            display: grid;
            place-items: center;
            background: var(--panel-2);
            border: 1px solid var(--line-strong);
            color: var(--text-2);
            cursor: pointer;
            border-radius: 0;
            transition: background .15s ease, border-color .15s ease, color .15s ease;
        }
        .arrow:hover{
            background: var(--panel-3);
            color: var(--accent);
            border-color: var(--accent-ring);
        }
        .arrow:disabled{ opacity:.4; cursor:not-allowed; color: var(--muted); }
        .arrow svg{ width: 1rem; height: 1rem; }

        .val{
            min-width: 2.5rem;
            height: 2.25rem;
            padding: 0 .55rem;
            display: grid;
            place-items: center;
            background: var(--bg-3);
            border: 1px solid var(--line-strong);
            color: var(--text);
            font-weight: 800;
            font-size: .85rem;
            border-radius: 0;
            text-align: center;
        }

        .range{
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 6px;
            background: linear-gradient(90deg, var(--accent) 0%, rgba(255,117,31,.15) 0%, var(--bg-3) 0%);
            border: 1px solid var(--line-strong);
            border-radius: 0;
            outline: none;
            cursor: pointer;
        }
        .range::-webkit-slider-runnable-track{
            height: 6px;
            background: transparent;
            border-radius: 0;
        }
        .range::-webkit-slider-thumb{
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            margin-top: -6px;
            background: var(--accent);
            border: 1px solid var(--accent-3);
            border-radius: 0;
            box-shadow: 0 0 12px var(--accent-glow);
            cursor: pointer;
        }
        .range::-moz-range-thumb{
            width: 16px;
            height: 16px;
            background: var(--accent);
            border: 1px solid var(--accent-3);
            border-radius: 0;
            box-shadow: 0 0 12px var(--accent-glow);
        }

        /* Pay zone (total + methods + buttons) */
        .payWrap{
            margin-top: .35rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: .55rem;
        }
        .totalBox{
            flex: 1 1 auto;
            min-width: 0;
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: space-between;
            gap: .55rem;
            padding: .5rem .7rem;
            background: var(--bg-3);
            border: 1px solid var(--accent-ring);
            border-radius: 0;
            position: relative;
        }
        .totalBox::before{
            content:"";
            position:absolute; left:0; top:0; bottom:0;
            width: 3px;
            background: var(--accent);
            box-shadow: 0 0 10px var(--accent-glow);
        }
        .totalLabel{
            color: var(--muted);
            font-weight: 800;
            font-size: .72rem;
            text-transform: uppercase;
            letter-spacing: .14em;
        }
        .totalVal{
            font-weight: 900;
            font-size: 1.0rem;
            color: var(--accent);
            letter-spacing: .03em;
            white-space: nowrap;
        }

        .payMethods{
            display: flex;
            gap: .35rem;
            flex: 0 0 auto;
        }
        .payMethod{
            width: 2.35rem;
            height: 2.35rem;
            display: grid;
            place-items: center;
            background: var(--panel-2);
            border: 1px solid var(--line-strong);
            color: var(--text-2);
            cursor: pointer;
            border-radius: 0;
            transition: background .15s ease, border-color .15s ease, color .15s ease, transform .12s var(--ease-smooth);
        }
        .payMethod:hover{
            background: var(--panel-3);
            color: var(--accent);
            border-color: var(--accent-ring);
        }
        .payMethod.active{
            background: var(--accent-soft);
            border-color: var(--accent-ring);
            color: var(--accent);
            box-shadow: inset 0 0 0 1px var(--accent-soft-2);
        }
        .payMethod svg{
            width: 1.1rem; height: 1.1rem;
            fill: none; stroke: currentColor; stroke-width: 2;
            stroke-linecap: round; stroke-linejoin: round;
        }

        .payBtn{
            width: 100%;
            height: 2.85rem;
            padding: 0 1rem;
            background: var(--accent);
            color: #1a0d05;
            border: 1px solid var(--accent-3);
            cursor: pointer;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: .14em;
            font-size: .82rem;
            border-radius: 0;
            box-shadow: 0 0 18px var(--accent-soft), 0 6px 20px rgba(0,0,0,.45);
            transition: background .15s ease, transform .12s var(--ease-smooth), box-shadow .15s ease;
        }
        .payBtn:hover{
            background: var(--accent-2);
            box-shadow: 0 0 22px var(--accent-soft-2), 0 8px 26px rgba(0,0,0,.55);
        }
        .payBtn:active{ transform: translateY(1px); }
        .payBtn:disabled{
            opacity: .45;
            cursor: not-allowed;
            transform: none;
            background: var(--panel-3);
            color: var(--muted);
            border-color: var(--line-strong);
            box-shadow: none;
        }

        .payRow{

        /* Désactiver la sélection de texte */
        body, #app, #camHud, .wrap, .sidebar, .panel, .card,
        .menu, .menuGrid, .mitem, .top, .body, .brand, .xclose{
            -webkit-user-select: none;

            border: 2px solid var(--panel);
        }

        /* Réduction d'animation */
        @media (prefers-reduced-motion: reduce){
            *{ transition: none !important; animation: none !important; }
        }

        /* Petits écrans */
        @media (max-width: 1280px){
            .wrap{ width: 56%; }
        }
        @media (max-width: 1024px){
            /* Légèrement plus large sur petit écran (les icônes ont besoin

            .wrap{ width: 78%; grid-template-columns: 13% 87%; }

            .cam-hud{ top: auto; bottom: 3%; left: 50%; transform: translateX(-50%); }

        const ResourceName = "sunlife_ui/clothesshop"
        let vipEnabled = false

        const post = async (name, data = {}) => {
            // Garde-fou : un callback Lua qui n'appelle jamais son cb (ex: RPC
            // serveur sans reponse) laisserait ce fetch en attente indefinie et
            // pourrait figer l'UI. On abort au bout de 10s et on renvoie null,
            // que les appelants gerent deja (ils testent res && res.ok).
            const controller = new AbortController()
            const timer = setTimeout(() => controller.abort(), 10000)
            try {
                const res = await fetch(`https://${ResourceName}/${name}`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json; charset=UTF-8" },
                    body: JSON.stringify(data),
                    signal: controller.signal
                })
                const txt = await res.text()
                let json = null
                try { json = JSON.parse(txt) } catch {}
                console.log("[NUI]", name, "->", data, "RESP:", json || txt)
                return json || txt
            } catch (e) {
                console.error("[NUI ERROR]", name, e)
                return null
            } finally {
                clearTimeout(timer)
            }
        }

        const calcItemTotal = () => {
            const c = current
            const cur = values[c.id] || { d: 0, t: 0 }
            const base = baseValues[c.id] || { d: 0, t: 0 }

            let total = 0
            if (cur.d !== base.d) total += 250
            if (c.texture && cur.t !== base.t) total += 50
            return total
        }

        const buildPayValues = (mode) => {
            if (mode === "item") {
                const out = {}
                out[current.id] = deepCopy(values[current.id] || { d: 0, t: 0 })
                return out
            }
            return values
        }

        const calcTotal = () => {
            let total = 0

            for (const c of CATS) {
                const cur = values[c.id] || { d: 0, t: 0 }
                const base = baseValues[c.id] || { d: 0, t: 0 }

                if (cur.d !== base.d) total += 250
                if (c.texture && cur.t !== base.t) total += 50
            }

            return total
        }

        const updatePayUI = () => {
            const totalOutfit = calcTotal()
            const totalItem = calcItemTotal()

            if (elPayTotal) elPayTotal.textContent = `${totalOutfit}$`

            if (elPayOutfitBtn) elPayOutfitBtn.disabled = totalOutfit <= 0
            if (elPayItemBtn) elPayItemBtn.disabled = totalItem <= 0
        }

        const setPayMethod = (m) => {
            payMethod = m === "bank" ? "bank" : "cash"
            elPayCash.classList.toggle("active", payMethod === "cash")
            elPayBank.classList.toggle("active", payMethod === "bank")
            elPayCash.setAttribute("aria-pressed", payMethod === "cash" ? "true" : "false")
            elPayBank.setAttribute("aria-pressed", payMethod === "bank" ? "true" : "false")
        }

        elPayCash.addEventListener("click", () => setPayMethod("cash"))
        elPayBank.addEventListener("click", () => setPayMethod("bank"))

        // elPayBtn.addEventListener("click", async () => {
        //     const total = calcTotal()
        //     if (total <= 0) return
        //     await post("payClotheshop", {
        //         method: payMethod,
        //         total,
        //         values
        //     })
        // })

        elPayOutfitBtn.addEventListener("click", async () => {
            const total = calcTotal()
            if (total <= 0) return

            pendingPayMethod = payMethod

            const now = new Date()
            const dd = String(now.getDate()).padStart(2, "0")
            const mm = String(now.getMonth() + 1).padStart(2, "0")
            const yyyy = String(now.getFullYear())
            const def = `Tenue ${dd}/${mm}/${yyyy}`

            openRename({ id: "__pay_outfit__", name: def })
        })

        elPayItemBtn.addEventListener("click", async () => {
            console.log("CLICK payItemBtn", { current: current.id })
            const total = calcItemTotal()
            console.log("TOTAL item =", total)
            if (total <= 0) return

            await post("payClotheshop", {
                method: payMethod,
                total,
                values: buildPayValues("item"),
                itemOnly: true,
                itemCat: current.id
            })
        })

        const showCatTip = (text, rect) => {
            if (!elCatTip) return
            elCatTip.textContent = text
            const x = rect.right + 12
            const y = rect.top + (rect.height / 2)
            elCatTip.style.transform = `translate3d(${Math.round(x)}px, ${Math.round(y)}px, 0) translateY(-50%)`
            elCatTip.classList.add("show")
        }

        const hideCatTip = () => {
            if (!elCatTip) return
            elCatTip.classList.remove("show")
            elCatTip.style.transform = "translate3d(-9999px,-9999px,0)"
        }

        let searchQuery = ""

        let open = false
        let current = CATS[0]
        let values = {}
        let sex = "male"

        const pushPreview = async (drawable, texture) => {
            const st = getState(current.id)
            await post("skinPreview", {
                drawableKey: current.drawable,
                textureKey: current.texture,
                drawable: drawable,
                texture: (current.texture ? texture : 0)
            })
        }

        const renderModels = () => {
            const st = getState(current.id)
            const count = Number(current.rangeD) + 1

            elModelList.innerHTML = ""

            const frag = document.createDocumentFragment()
            const baseLabel = current.id === "torso" ? "Veste" : current.label

            const q = (searchQuery || "").toLowerCase()
            visibleModelDs = []

            for (let i = 0; i < count; i++) {
                if (isBlacklisted(current.id, i)) continue

                const b = document.createElement("button")
                b.type = "button"
                b.className = "modelBtn" + (i === st.d ? " active" : "")
                b.dataset.d = String(i)

                const fallbackName = `${baseLabel} #${i + 1}`
                const displayName = getItemLabel(current.id, i, fallbackName)

                const text = String(displayName).toLowerCase()
                const text2 = `${baseLabel} #${i + 1}`.toLowerCase()
                if (q && !text.includes(q) && !text2.includes(q)) {
                    continue
                }

                visibleModelDs.push(i)

                b.innerHTML = `
                    <span>${displayName}</span>
                    <span class="modelPrice">250$</span>
                `

                b.addEventListener("mouseenter", async () => {
                    const cur = getState(current.id)
                    await pushPreview(i, cur.t)
                })

                b.addEventListener("mouseleave", async () => {
                    const cur = getState(current.id)
                    await pushPreview(cur.d, cur.t)
                })

                frag.appendChild(b)
            }

            elModelList.appendChild(frag)
        }

        const clampi = (v, a, b) => {
            v = Number(v)
            if (Number.isNaN(v)) v = a
            if (v < a) v = a
            if (v > b) v = b
            return Math.round(v)
        }

        const ensureState = () => {
            for (const c of CATS) {
                if (!values[c.id]) values[c.id] = { d: 0, t: 0 }
            }
        }

        const renderMenu = () => {
            elMenu.innerHTML = ""
            for (const c of CATS) {
                const b = document.createElement("button")
                b.className = "mitem" + (c.id === current.id ? " active" : "")
                b.type = "button"
                b.dataset.id = c.id

                b.innerHTML = `<span class="ico">${ICONS[c.id] || ICONS.tshirt}</span>`

                b.addEventListener("mouseenter", () => showCatTip(c.label, b.getBoundingClientRect()))
                b.addEventListener("mousemove", () => showCatTip(c.label, b.getBoundingClientRect()))
                b.addEventListener("mouseleave", hideCatTip)

                b.addEventListener("click", () => {
                    hideCatTip()
                    selectCat(c.id)
                })

                elMenu.appendChild(b)
            }
        }

        const toggleVipPeds = async (state) => {
            if (!vipEnabled) return
            const show = typeof state === "boolean" ? state : (panelMode !== "vipPeds")
            panelMode = show ? "vipPeds" : "shop"
            updatePanel()
        }

        elVipBtn.addEventListener("click", () => {
            // Bloqué uniquement en vestiaire standalone (sinon on doit pouvoir
            // basculer vers Peds VIP depuis n'importe quel sous-panel).
            if (panelMode === "locker" && standaloneLocker) return
            if (panelMode === "locker") {
                panelMode = "shop"
                elLockerBtn.setAttribute("aria-expanded", "false")
            }
            if (panelMode === "outfits") {
                panelMode = "shop"
                elOutfitBtn.setAttribute("aria-expanded", "false")
            }
            toggleVipPeds()
        })

        const updatePanel = () => {
            if (panelMode === "vipPeds") {
                elPanelTitle.textContent = "Peds VIP"
                elPanelDesc.textContent = `${vipNpcs.length} ped(s) • Cliquez un ped puis Valider`

                if (elRowHead) elRowHead.style.display = ""
                if (elVariantFooter) elVariantFooter.style.display = "none"

                if (elActions) {
                    elActions.innerHTML = `<button class="btn" id="vipBack" type="button">Retour</button><button class="btn primary" id="vipConfirm" type="button">Valider</button>`
                    document.getElementById("vipBack").addEventListener("click", () => {
                        panelMode = "shop"
                        updatePanel()
                    })
                    document.getElementById("vipConfirm").addEventListener("click", async () => {
                        // Ferme le menu en conservant le ped VIP applique.
                        await post("vipPedConfirm", {})
                    })
                }

                renderVipPeds()
                return
            }

            if (panelMode === "outfits") {
                elPanelTitle.textContent = "Tenues sauvegardées"
                elPanelDesc.textContent = `${outfits.length} tenue(s) • Charger / Supprimer`

                if (elRowHead) elRowHead.style.display = "none"
                if (elVariantFooter) elVariantFooter.style.display = "none"
                if (elOutfitFooter) elOutfitFooter.style.display = ""

                if (elActions) {
                    elActions.innerHTML = `<button class="btn" id="outfitBack" type="button">Retour</button>`
                    document.getElementById("outfitBack").addEventListener("click", () => toggleOutfits(false))
                }

                renderOutfits()
                return
            }

            if (panelMode === "locker") {
                elPanelTitle.textContent = "Vestiaire"
                elPanelDesc.textContent = `${lockerItems.length} tenue(s) • Prévisualiser / Acheter / Renommer / Supprimer`

                if (elRowHead) elRowHead.style.display = "none"
                if (elVariantFooter) elVariantFooter.style.display = "none"
                if (elOutfitFooter) elOutfitFooter.style.display = ""

                if (elActions) {
                    if (standaloneLocker) {
                        // Vestiaire standalone : pas de retour vers le shop.
                        elActions.innerHTML = ""
                    } else {
                        // Vestiaire dans le shop : on peut revenir à la boutique.
                        elActions.innerHTML = `<button class="btn" id="lockerBack" type="button">Retour</button>`
                        document.getElementById("lockerBack").addEventListener("click", () => toggleLocker(false))
                    }
                }

                if (elOutfitSaveBottom) {
                    elOutfitSaveBottom.textContent = "ENREGISTRER UNE TENUE"
                    elOutfitSaveBottom.onclick = () => {
                        const now = new Date()
                        const dd = String(now.getDate()).padStart(2, "0")
                        const mm = String(now.getMonth() + 1).padStart(2, "0")
                        const yyyy = String(now.getFullYear())
                        openRename({ id: "__locker_new__", name: `Tenue ${dd}/${mm}/${yyyy}` })
                    }
                }

                renderLocker()
                return
            }

            if (elOutfitFooter) elOutfitFooter.style.display = "none"
            if (elRowHead) elRowHead.style.display = ""
            if (elVariantFooter) elVariantFooter.style.display = ""
            if (elActions) elActions.innerHTML = ""

            const st = getState(current.id)

            elPanelTitle.textContent = current.label
            const count = (Number(current.rangeD) + 1)
            elPanelDesc.textContent = `${count} articles • Modèle / Variante`

            renderModels()

            if (current.texture) {
                elTRange.disabled = false
                elTPrev.disabled = false
                elTNext.disabled = false
                elTRange.max = String(current.rangeT)
                elTRange.value = String(st.t)
                elTVal.textContent = String(st.t)
                elTRange.style.opacity = "1"
            } else {
                elTRange.disabled = true
                elTPrev.disabled = true
                elTNext.disabled = true
                elTRange.value = "0"
                elTVal.textContent = "—"
                elTRange.style.opacity = ".45"
            }
        }

        const pushChange = async () => {
            const st = getState(current.id)
            await post("skinChange", {
                drawableKey: current.drawable,
                textureKey: current.texture,
                drawable: st.d,
                texture: st.t
            })
        }

        const pushCam = async (mode) => {
            document.querySelectorAll(".cam-btn").forEach(x => {
                const on = x.dataset.cam === mode
                x.classList.toggle("selected", on)
                x.setAttribute("aria-pressed", on ? "true" : "false")
            })
            await post("setCamera", { mode })
        }

        const selectCat = async (id) => {
            current = CATS.find(x => x.id === id) || CATS[0]
            searchQuery = ""
            if (elSearch) elSearch.value = ""
            renderMenu()
            updatePanel()
            await pushCam(current.cam)
            await pushChange()
            updatePayUI()
        }

        const setDrawable = async (v) => {
            const st = getState(current.id)
            st.d = clampi(v, 0, Number(current.rangeD))

            if (current.texture) {
                const r = await post("getTextureMax", { catId: current.id, drawable: st.d })
                const maxT = (r && r.ok) ? Number(r.max || 0) : Number(current.rangeT || 0)
                current.rangeT = maxT
                elTRange.max = String(maxT)
                if (st.t > maxT) st.t = maxT
                elTRange.value = String(st.t)
                elTVal.textContent = String(st.t)
            }

            updatePayUI()

            elModelList.querySelectorAll(".modelBtn.active").forEach(x => x.classList.remove("active"))
            const sel = elModelList.querySelector(`.modelBtn[data-d="${st.d}"]`)
            if (sel) sel.classList.add("active")

            await pushChange()
        }

        const setTexture = async (v) => {
            if (!current.texture) return
            const st = getState(current.id)
            st.t = clampi(v, 0, Number(current.rangeT))

            updatePayUI()

            elTRange.value = String(st.t)
            elTVal.textContent = String(st.t)
            await pushChange()
        }

        const isTypingTarget = (t) => {
            const tag = (t && t.tagName) ? t.tagName.toLowerCase() : ""
            return tag === "input" || tag === "textarea" || (t && t.isContentEditable)
        }

        const stepDrawableVisible = async (dir) => {
            if (panelMode !== "shop") return
            if (!visibleModelDs.length) return

            const st = getState(current.id)
            let pos = visibleModelDs.indexOf(st.d)
            if (pos === -1) pos = 0

            pos += dir
            if (pos < 0) pos = visibleModelDs.length - 1
            if (pos >= visibleModelDs.length) pos = 0

            await setDrawable(visibleModelDs[pos])

            const sel = elModelList.querySelector(`.modelBtn[data-d="${visibleModelDs[pos]}"]`)
            if (sel) sel.scrollIntoView({ block: "nearest" })
        }

        elTRange.addEventListener("input", async (e) => setTexture(e.target.value))

        elTPrev.addEventListener("click", async () => setTexture(getState(current.id).t - 1))
        elTNext.addEventListener("click", async () => setTexture(getState(current.id).t + 1))
        elXClose.addEventListener("click", async () => post("closeUI", {}))

        elModelList.addEventListener("click", async (e) => {
            if (panelMode !== "outfits") return

            const btn = e.target.closest("button")
            if (!btn) return

            const act = btn.dataset.act
            const id = Number(btn.dataset.id)
            const o = outfits.find(x => x.id === id)
            if (!o) return

            if (act === "del") {
                outfits = outfits.filter(x => x.id !== id)
                renderOutfits()
                updatePanel()
                return
            }

            if (act === "load") {
                if (o.values) {
                    values = deepCopy(o.values)
                    ensureState()
                    panelMode = "shop"
                    updatePanel()
                    await pushCam(current.cam)
                    await pushChange()
                    updatePayUI()
                } else {
                    toggleOutfits(false)
                }
            }
        })

        elSearch.addEventListener("input", () => {
            searchQuery = (elSearch.value || "").trim().toLowerCase()
            renderModels()
        })

        document.getElementById("camHud").addEventListener("click", async (e) => {
            const btn = e.target.closest(".cam-btn")
            if (!btn) return
            await pushCam(btn.dataset.cam)
        })

        window.addEventListener("keydown", async (e) => {
            if (!open) return

            if (isTypingTarget(e.target)) {
                if (e.key === "Escape") {
                    await post("closeUI", {})
                }
                return
            }

            if (e.key === "a" || e.key === "A") {
                e.preventDefault()
                await post("rotateHeading", { dir: -1, step: 4.0 })
                return
            }

            if (e.key === "e" || e.key === "E") {
                e.preventDefault()
                await post("rotateHeading", { dir: 1, step: 4.0 })
                return
            }

            if (e.key === "Escape") {
                await post("closeUI", {})
                return
            }

            if (e.key === "Backspace") {
                await post("closeUI", {})
                return
            }

            if (panelMode !== "shop") return

            if (e.key === "ArrowUp") {
                e.preventDefault()
                await stepDrawableVisible(-1)
                return
            }

            if (e.key === "ArrowDown") {
                e.preventDefault()
                await stepDrawableVisible(1)
                return
            }

            if (e.key === "ArrowLeft") {
                if (!current.texture) return
                e.preventDefault()
                await setTexture(getState(current.id).t - 1)
                return
            }

            if (e.key === "ArrowRight") {
                if (!current.texture) return
                e.preventDefault()
                await setTexture(getState(current.id).t + 1)
                return
            }
        })

        const renderVipPeds = () => {
            if (!elModelList) return
            elModelList.innerHTML = ""

            const frag = document.createDocumentFragment()
            const q = (searchQuery || "").toLowerCase()

            for (const npc of vipNpcs) {
                const name = String(npc.name || "Ped")
                const model = String(npc.model || "")
                if (!model) continue
                if (q && !name.toLowerCase().includes(q) && !model.toLowerCase().includes(q)) continue

                const b = document.createElement("button")
                b.className = "modelBtn"
                b.type = "button"

                const left = document.createElement("span")
                left.textContent = name

                const right = document.createElement("span")
                right.className = "modelPrice"
                right.textContent = model

                b.appendChild(left)
                b.appendChild(right)

                b.addEventListener("click", async () => {
                    await post("vipPedSelect", { model })
                })

                frag.appendChild(b)
            }

            elModelList.appendChild(frag)
        }

        window.addEventListener("message", async (event) => {
            const data = event.data || {}
            // NE PAS awaiter un sync serveur ici : ce handler traite l'ouverture
            // ET la fermeture du menu. Si un RPC outfits:get ne repond pas (lag /
            // reply perdu apres des heures), l'await bloquait tout -> le focus NUI
            // etait deja pris cote Lua (curseur visible) mais le panneau ne
            // s'affichait jamais et la fermeture etait bloquee -> deco/reco.
            // Les tenues arrivent de toute facon via le message "outfits:set"
            // pousse par le Lua, et chaque action fait son propre sync si besoin.

            if (data.action === "outfits:set") {
                outfits = (data.outfits || []).map(o => ({
                    id: Number(o.id),
                    name: String(o.name || "Tenue"),
                    date: fmtDate(o.created_at || o.updated_at),
                }))
                if (panelMode === "outfits") renderOutfits()
                updatePanel()
            }

            if (data.action === "openVestiaire") {
                open = true
                panelMode = "locker"
                standaloneLocker = true
                sex = data.sex || "male"
                elSex.textContent = sex === "female" ? "F" : "M"

                values = (data.values && typeof data.values === "object") ? data.values : {}
                ensureState()

                elOutfitBtn.style.display = "none"
                elOutfitBtn.setAttribute("aria-expanded", "false")
                setLockerBtnLeft(LOCKER_LEFT_VESTIAIRE)
                setLockerBtnDisabled(true)

                if (data.hideOutfits) {
                    document.querySelector("#btn-outfits")?.classList.add("hidden")
                    document.querySelector("#tab-outfits")?.classList.add("hidden")
                } else {
                    document.querySelector("#btn-outfits")?.classList.remove("hidden")
                    document.querySelector("#tab-outfits")?.classList.remove("hidden")
                }

                elApp.style.display = "grid"
                elCamHud.classList.add("show")
                elXClose.classList.add("show")
                if (elKeyHud) elKeyHud.classList.remove("show")

                renderMenu()
                await syncLockerFromServer()

                updatePanel()
                await pushCam("body")

                const payWrap = document.querySelector(".payWrap")
                const payRow = document.querySelector(".payRow")
                if (payWrap) payWrap.style.display = "none"
                if (payRow) payRow.style.display = "none"

                const menu = document.getElementById("menu")
                if (menu) menu.style.display = "none"

                vipEnabled = !!data.isVip
                vipNpcs = Array.isArray(data.vipNpcs) ? data.vipNpcs : []
                setVipBtnVisible(vipEnabled)
                // En vestiaire standalone, VIP doit être collé au Vestiaire
                // (Tenues est masqué) et non à 20rem.
                setVipBtnLeft(VIP_LEFT_VESTIAIRE)
            }

            if (data.action === "openWardrobe") {
                open = true
                panelMode = "outfits"
                standaloneLocker = false

                sex = data.sex || "male"
                elSex.textContent = sex === "female" ? "F" : "M"

                current = CATS.find(x => x.id === (data.defaultCat || "tshirt")) || CATS[0]

                values = (data.values && typeof data.values === "object") ? data.values : {}
                ensureState()

                elOutfitBtn.style.display = ""
                setLockerBtnLeft(LOCKER_LEFT_NORMAL)
                setLockerBtnDisabled(false)

                elApp.style.display = "grid"
                elCamHud.classList.add("show")
                elXClose.classList.add("show")
                if (elKeyHud) elKeyHud.classList.remove("show")

                renderMenu()
                await syncOutfitsFromServer()

                elOutfitBtn.setAttribute("aria-expanded", "true")
                updatePanel()
                await pushCam("body")

                updatePayUI()

                const payWrap = document.querySelector(".payWrap")
                const payRow = document.querySelector(".payRow")
                if (payWrap) payWrap.style.display = "none"
                if (payRow) payRow.style.display = "none"

                const menu = document.getElementById("menu")
                if (menu) menu.style.display = "none"

                vipEnabled = !!data.isVip
                vipNpcs = Array.isArray(data.vipNpcs) ? data.vipNpcs : []
                setVipBtnVisible(vipEnabled)
                setVipBtnLeft(VIP_LEFT)
            }

            if (data.action === "openClotheshop") {
                open = true
                panelMode = "shop"
                standaloneLocker = false

                sex = data.sex || "male"
                elSex.textContent = sex === "female" ? "F" : "M"

                current = CATS.find(x => x.id === (data.defaultCat || "tshirt")) || CATS[0]

                values = (data.values && typeof data.values === "object") ? data.values : {}
                ensureState()

                elOutfitBtn.style.display = ""
                elLockerBtn.style.display = ""
                setLockerBtnLeft(LOCKER_LEFT_NORMAL)
                setLockerBtnDisabled(false)

                elApp.style.display = "grid"
                elCamHud.classList.add("show")
                elXClose.classList.add("show")
                if (elKeyHud) elKeyHud.classList.add("show")

                snapshotBase()
                setPayMethod("cash")
                updatePayUI()

                await applyLimits()
                renderMenu()
                updatePanel()
                await pushCam(current.cam)
                await pushChange()

                const payWrap = document.querySelector(".payWrap")
                const payRow = document.querySelector(".payRow")
                if (payWrap) payWrap.style.display = ""
                if (payRow) payRow.style.display = ""

                const menu = document.getElementById("menu")
                if (menu) menu.style.display = ""

                vipEnabled = !!data.isVip
                vipNpcs = Array.isArray(data.vipNpcs) ? data.vipNpcs : []
                setVipBtnVisible(vipEnabled)
                setVipBtnLeft(VIP_LEFT)
            }

            if (data.action === "closeClotheshop") {
                open = false
                elApp.style.display = "none"
                if (elLockerBtn) elLockerBtn.style.display = ""

                setLockerBtnDisabled(false)
                setLockerBtnLeft(LOCKER_LEFT_NORMAL)

                elXClose.classList.remove("show")
                elCamHud.classList.remove("show")
                if (elKeyHud) elKeyHud.classList.remove("show")

                vipEnabled = false
                vipNpcs = []
                setVipBtnVisible(false)
            }
        })
    </script>

    <!-- ============================================================
         Click sound (identique à SNL_Boutique).
         Web Audio synthétisé : 3 couches (snap + pop + sub) pour un
         click "tactile/punchy". Aucun asset audio requis.
         Throttle 35ms anti-spam, opt-out via [data-no-click-sound].
         Ne joue que quand l'app est visible (#app non display:none).
         ============================================================ -->
    <script>
    (() => {
        let _audioCtx = null;
        function getAudioCtx(){
            try {
                if (!_audioCtx) {
                    const Ctx = window.AudioContext || window.webkitAudioContext;
                    if (!Ctx) return null;
                    _audioCtx = new Ctx();
                }
                if (_audioCtx.state === 'suspended') { try { _audioCtx.resume(); } catch(_){} }
                return _audioCtx;
            } catch(_) { return null; }
        }

        const CLICK_VOL = 0.1;
        let _lastClickAt = 0;

        function playClickSound(opts){
            const ctx = getAudioCtx();
            if (!ctx) return;
            const now = performance.now();
            if (now - _lastClickAt < 35) return;
            _lastClickAt = now;

            const t0 = ctx.currentTime;
            const soft = !!(opts && opts.soft);
            const masterVol = soft ? CLICK_VOL * 0.55 : CLICK_VOL;

            // Layer 1 — snap (haut, court, percussif)
            try {
                const o1 = ctx.createOscillator();
                const g1 = ctx.createGain();
                const f1 = ctx.createBiquadFilter();
                f1.type = 'highpass'; f1.frequency.value = 1400; f1.Q.value = 0.7;
                o1.type = 'square';
                o1.frequency.setValueAtTime(2400, t0);
                o1.frequency.exponentialRampToValueAtTime(900, t0 + 0.040);
                g1.gain.setValueAtTime(0.0001, t0);
                g1.gain.exponentialRampToValueAtTime(0.42 * masterVol, t0 + 0.004);
                g1.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.060);
                o1.connect(f1); f1.connect(g1); g1.connect(ctx.destination);
                o1.start(t0); o1.stop(t0 + 0.075);
            } catch(_){}

            // Layer 2 — pop (corps mid)
            try {
                const o2 = ctx.createOscillator();
                const g2 = ctx.createGain();
                o2.type = 'triangle';
                o2.frequency.setValueAtTime(1200, t0);
                o2.frequency.exponentialRampToValueAtTime(420, t0 + 0.060);
                g2.gain.setValueAtTime(0.0001, t0);
                g2.gain.exponentialRampToValueAtTime(0.32 * masterVol, t0 + 0.006);
                g2.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.090);
                o2.connect(g2); g2.connect(ctx.destination);
                o2.start(t0); o2.stop(t0 + 0.110);
            } catch(_){}

            // Layer 3 — sub (basse pour le punch)
            try {
                const o3 = ctx.createOscillator();
                const g3 = ctx.createGain();
                o3.type = 'sine';
                o3.frequency.setValueAtTime(180, t0);
                o3.frequency.exponentialRampToValueAtTime(90, t0 + 0.080);
                g3.gain.setValueAtTime(0.0001, t0);
                g3.gain.exponentialRampToValueAtTime(0.20 * masterVol, t0 + 0.006);
                g3.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.110);
                o3.connect(g3); g3.connect(ctx.destination);
                o3.start(t0); o3.stop(t0 + 0.140);
            } catch(_){}
        }

        document.addEventListener('click', (e) => {
            const app = document.getElementById('app');
            // Ne joue que si l'UI clotheshop est visible
            if (!app || app.style.display === 'none') return;
            const t = e.target;
            if (!(t instanceof Element)) return;
            if (t.closest('input, textarea, select')) return;
            if (t.closest('[data-no-click-sound]')) return;
            const isInteractive = !!t.closest(
                'button, a, [role="button"], .btn, .mitem, .modelBtn, .arrow, ' +
                '.cam-btn, .payBtn, .payMethod, .outfitBtn, .outfitAct, ' +
                '.outfitClose, .outfitSave, .renameBtn, .renameClose, .xclose, ' +
                '[tabindex]'
            );
            playClickSound({ soft: !isInteractive });
        }, true);
    })();
    </script>
