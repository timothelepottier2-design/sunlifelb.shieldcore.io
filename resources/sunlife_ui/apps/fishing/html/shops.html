<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Classement</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --accent: #f6e05e;
            --accent-soft: rgba(246, 224, 94, 0.22);
            --text-main: #f7fafc;
            --text-soft: #a0aec0;
            --shadow-soft: 0 0.45vh 1.4vh rgba(0, 0, 0, 0.65);
            --bg-panel: rgba(7, 11, 20, 0.96);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: "Montserrat", sans-serif;
            background: transparent;
        }

        #app {
            position: fixed;
            inset: 0;
            pointer-events: none;
        }

        .shell {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding-bottom: 10vh;
            pointer-events: none;
        }

        .shell-inner {
            pointer-events: auto;
        }

        .container {
            display: flex;
            align-items: center;
            gap: 0.9vw;
            transform: translateY(2.6vh);
            opacity: 0;
            transition: transform 0.14s ease-out, opacity 0.14s ease-out;
        }

        .visible .container {
            opacity: 1;
            transform: translateY(0);
        }

        .key-circle {
            width: 3.4vh;
            height: 3.4vh;
            border-radius: 0.4rem;
            border: 0.12rem solid rgba(0, 0, 0, 0.35);
            background: #fdfdfd;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0.4vh 1.2vh rgba(0, 0, 0, 0.65);
            animation: keyFloat 1.4s ease-in-out infinite alternate;
            transition: transform 0.08s ease-out, box-shadow 0.08s ease-out;
        }

        .key-circle span {
            font-size: 1.6vh;
            font-weight: 700;
            line-height: 1;
            letter-spacing: 0;
            color: #111827;
        }

        @keyframes keyFloat {
            0% { transform: translateY(0); }
            100% { transform: translateY(-0.3vh); }
        }

        .key-circle.pressed {
            transform: translateY(0.15vh) scale(0.96);
            box-shadow: 0 0.15vh 0.5vh rgba(0, 0, 0, 0.7);
            animation: none;
        }

        .right-block {
            min-width: 14rem;
            width: 22vw;
            max-width: 26rem;
            display: flex;
            flex-direction: column;
            gap: 0.35vh;
        }

        .top-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            transform: translateY(0.1vh);
        }

        .percent {
            font-size: 1.2vh;
            font-weight: 600;
            color: var(--text-main);
            text-shadow: 0 0.15vh 0.35vh rgba(0, 0, 0, 0.65);
        }

        .timer-pill {
            padding: 0.15vh 0.7vw;
            border-radius: 999px;
            background: var(--accent-soft);
            display: inline-flex;
            align-items: center;
            gap: 0.25vw;
            font-size: 1.05vh;
            color: rgba(252, 255, 240, 0.96);
            box-shadow: var(--shadow-soft);
        }

        .timer-pill span:first-child {
            font-size: 1.2vh;
        }

        .step-label {
            font-size: 1vh;
            font-weight: 600;
            color: rgba(252, 255, 240, 0.9);
        }

        .progress-outer {
            width: 100%;
            height: 1.2vh;
            border-radius: 999px;
            background: rgba(15, 23, 42, 0.9);
            overflow: hidden;
            position: relative;
            box-shadow: 0 0.4vh 1.2vh rgba(0, 0, 0, 0.7);
        }

        .progress-inner {
            width: 0%;
            height: 100%;
            border-radius: inherit;
            background-color: #f6e05e;
            background-image:
                repeating-linear-gradient(
                    135deg,
                    rgba(246, 224, 94, 1) 0,
                    rgba(246, 224, 94, 1) 8px,
                    #c8a93c 8px,
                    #c8a93c 16px
                );
            box-shadow: 0 0.35vh 0.9vh rgba(246, 224, 94, 0.9);
            transform-origin: left center;
            transition: width 0.08s linear, transform 0.06s ease-out;
        }

        .progress-inner.pulse {
            animation: pulseBar 0.18s ease-out;
        }

        @keyframes pulseBar {
            0% { transform: scaleX(1); }
            50% { transform: scaleX(1.03); }
            100% { transform: scaleX(1); }
        }

        .progress-gloss {
            position: absolute;
            inset: 0;
            background-image: linear-gradient(
                120deg,
                rgba(255, 255, 255, 0.18),
                transparent 40%,
                transparent 60%,
                rgba(255, 255, 255, 0.18)
            );
            background-size: 38% 100%;
            mix-blend-mode: soft-light;
            pointer-events: none;
        }

        /* Overlay classement */

        .leaderboard-shell {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
        }

        .leaderboard-shell.visible {
            pointer-events: auto;
        }

        .leaderboard-panel {
            min-width: 46rem;
            max-width: 72rem;
            width: 70vw;
            max-height: 80vh;
            background: var(--bg-panel);
            border-radius: 1.4rem;
            border: 1px solid rgba(148, 163, 184, 0.35);
            box-shadow: 0 1.6vh 3.6vh rgba(0, 0, 0, 0.9);
            padding: 2.4vh 3vw;
            display: flex;
            flex-direction: column;
            gap: 1.8vh;
            opacity: 0;
            transform: translateY(2vh) scale(0.97);
            transition: opacity 0.16s ease-out, transform 0.16s ease-out;
        }

        .leaderboard-shell.visible .leaderboard-panel {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        .lb-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .lb-title-block {
            display: flex;
            flex-direction: column;
            gap: 0.4vh;
        }

        .lb-eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 0.6vw;
            font-size: 1.1vh;
            letter-spacing: 0.32em;
            text-transform: uppercase;
            color: var(--accent);
            font-weight: 600;
        }

        .lb-eyebrow svg {
            flex-shrink: 0;
        }

        .lb-title {
            font-size: 2.1vh;
            color: var(--text-main);
            font-weight: 700;
        }

        .lb-sub {
            font-size: 1.25vh;
            color: var(--text-soft);
        }

        .lb-tabs {
            display: flex;
            gap: 0.5vw;
            margin-top: 0.6vh;
        }

        .lb-tab-label {
            font-size: 1.05vh;
            color: var(--text-soft);
        }

        /* Onglets d'activités */

        .lb-activities {
            display: inline-flex;
            gap: 0.4vw;
            margin-top: 1.4vh;
            border-radius: 999px;
            background: rgba(15, 23, 42, 0.8);
            padding: 0.25vh 0.3vw;
        }

        .lb-activity-tab {
            border: none;
            outline: none;
            padding: 0.45vh 1vw;
            border-radius: 999px;
            font-size: 1.1vh;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            background: transparent;
            color: var(--text-soft);
            cursor: pointer;
            transition: background 0.12s ease-out, color 0.12s ease-out;
            display: inline-flex;
            align-items: center;
            gap: 0.35vw;
        }

        .lb-activity-icon {
            width: 1.4vh;
            height: 1.4vh;
            flex-shrink: 0;
        }

        .lb-activity-label {
            display: inline-block;
        }

        .lb-activity-tab.active {
            background: var(--accent-soft);
            color: var(--text-main);
        }

        .lb-activity-tab:hover {
            background: rgba(148, 163, 184, 0.18);
        }

        .lb-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.6vw;
            margin-top: 1vh;
        }

        .lb-column {
            background: radial-gradient(circle at top, rgba(15, 23, 42, 0.9), rgba(15, 23, 42, 0.98));
            border-radius: 0.9rem;
            border: 1px solid rgba(148, 163, 184, 0.33);
            padding: 1.6vh 1.6vw;
            display: flex;
            flex-direction: column;
            gap: 0.9vh;
        }

        .lb-col-title {
            font-size: 1.15vh;
            letter-spacing: 0.26em;
            text-transform: uppercase;
            color: var(--text-soft);
            font-weight: 600;
        }

        .lb-col-sub {
            font-size: 1.1vh;
            color: var(--text-soft);
        }

        .lb-list {
            display: flex;
            flex-direction: column;
            gap: 0.35vh;
            margin-top: 0.4vh;
        }

        .lb-row {
            display: grid;
            grid-template-columns: 2.2rem 1fr auto;
            align-items: center;
            font-size: 1.05vh;
            padding: 0.3vh 0.5vw;
            border-radius: 0.5rem;
            background: rgba(15, 23, 42, 0.7);
        }

        .lb-row:nth-child(1) {
            background: linear-gradient(90deg, rgba(246, 224, 94, 0.2), rgba(15, 23, 42, 0.85));
        }

        .lb-rank {
            color: var(--accent);
            font-weight: 700;
            letter-spacing: 0.14em;
        }

        .lb-name {
            color: var(--text-main);
            font-weight: 600;
        }

        .lb-value {
            color: var(--text-soft);
            font-weight: 500;
            font-size: 1.0vh;
        }

        .lb-footer {
            display: flex;
            justify-content: flex-end;
            margin-top: 0.8vh;
        }

        .lb-close-hint {
            font-size: 1.0vh;
            color: var(--text-soft);
            letter-spacing: 0.18em;
            text-transform: uppercase;
        }

        .lb-close-key {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0.06rem 0.4rem;
            margin-left: 0.4rem;
            border-radius: 0.3rem;
            border: 1px solid rgba(148, 163, 184, 0.6);
            font-size: 0.9vh;
            color: var(--text-main);
        }

        @media (max-width: 900px) {
            .right-block {
                width: 46vw;
            }
            .leaderboard-panel {
                width: 86vw;
                min-width: 0;
            }
        }

        @media (max-width: 600px) {
            .shell {
                padding-bottom: 8vh;
            }
            .right-block {
                width: 70vw;
            }
            .lb-grid {
                grid-template-columns: 1fr;
            }
        }

        .zone-hud {
            position: fixed;
            top: 50%;
            right: 2.4vw;
            transform: translateY(-50%) translateX(2vw) scale(1.12);
            transform-origin: top right;
            display: flex;
            flex-direction: column;
            gap: 0.55vh;
            color: var(--text-main);
            font-size: 1.1vh;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.16s ease-out, transform 0.16s ease-out;
        }

        .zone-hud.visible {
            opacity: 1;
            transform: translateY(-50%) translateX(0) scale(1.12);
        }

        .zh-row {
            display: flex;
            align-items: center;
            gap: 0.55vw;
        }

        .zh-main {
            margin-bottom: 0.6vh;
        }

        .zh-icon {
            width: 3.2vh;
            height: 3.2vh;
            display: flex;
            align-items: center;
            justify-content: center;
            /* plus de background ni d'ombre */
            background: transparent;
            box-shadow: none;
        }

        .zh-icon.small {
            width: 2.4vh;
            height: 2.4vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent;
            box-shadow: none;
        }

        .zh-icon svg {
            width: 100%;
            height: 100%;
            color: var(--accent);
        }

        .zh-text {
            display: flex;
            flex-direction: column;
            gap: 0.25vh;
        }

        .zh-zone-name {
            font-size: 1.25vh;
            font-weight: 700;
            letter-spacing: 0.14em;
            text-transform: uppercase;
        }

        .zh-tags {
            display: inline-flex;
            gap: 0.35vw;
        }

        .zh-tag {
            padding: 0.15vh 0.6vw;
            border-radius: 999px;
            font-size: 0.95vh;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            border: 1px solid rgba(148, 163, 184, 0.55);
            background: rgba(15, 23, 42, 0.7);
            color: var(--text-soft);
        }

        .zh-tag-legal {
            border-color: rgba(52, 211, 153, 0.7);
            color: #bbf7d0;
        }

        .zh-tag-illegal {
            border-color: rgba(248, 113, 113, 0.8);
            color: #fecaca;
        }

        .zh-tag-req {
            border-style: dashed;
        }

        .zh-line {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 0.05vh;
        }

        .zh-label {
            font-size: 0.95vh;
            color: var(--text-soft);
            text-transform: uppercase;
            letter-spacing: 0.16em;
        }

        .zh-value {
            font-size: 1.15vh;
            font-weight: 600;
        }

        @media (max-width: 900px) {
            .zone-hud {
                right: 3vw;
            }
        }

        @media (max-width: 600px) {
            .zone-hud {
                top: 56%;
                right: 4vw;
            }
        }
    </style>
</head>
<body>
<div id="app">
    <div class="shell">
        <div class="shell-inner" id="shell">
            <div class="container" id="container">
                <div class="key-circle" id="keyCircle" title="Appuie une fois">
                    <span id="keyCircleLabel">E</span>

                <div class="right-block">

                        <div class="timer-pill">
                            <span>⏱</span>

                    </div>
                    <div class="progress-outer">
                        <div class="progress-inner" id="progressInner"></div>
                        <div class="progress-gloss"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- CLASSEMENT GLOBAL -->

            <div class="lb-tabs">

            <!-- Onglets d'activités -->
            <div class="lb-activities" id="lbActivities"></div>

            <!-- Colonnes dynamiques de la catégorie sélectionnée -->

    </div>

        <div class="zone-hud" id="zoneHud">

    </div>
</div>

    const progressInner = document.getElementById("progressInner")

    function setVisible(state) {
        visible = state
        if (visible) {
            shell.classList.add("visible")
        } else {
            shell.classList.remove("visible")
        }
    }

    function clamp(val, min, max) {
        return val < min ? min : (val > max ? max : val)
    }

    function playKeyPress() {
        keyCircle.classList.remove("pressed")
        void keyCircle.offsetWidth
        keyCircle.classList.add("pressed")
        setTimeout(() => {
            keyCircle.classList.remove("pressed")
        }, 90)
    }

    function updateProgress(pct, pulse) {
        currentProgress = clamp(pct, 0, 100)
        progressInner.style.width = currentProgress.toFixed(1) + "%"
        percentText.textContent = currentProgress.toFixed(0) + "%"

        if (pulse) {
            progressInner.classList.remove("pulse")
            void progressInner.offsetWidth
            progressInner.classList.add("pulse")
            playKeyPress()
        }
    }

    function updateTimeLeft(ms) {
        remainingMs = ms
        if (ms < 0) ms = 0
        const s = ms / 1000
        timeLeftEl.textContent = s.toFixed(1) + "s"
    }

    function renderActivityTabs() {
        lbActivities.innerHTML = ""
        Object.keys(leaderboardData).forEach(key => {
            const activity = leaderboardData[key]
            const btn = document.createElement("button")
            const isActive = key === currentActivity
            btn.className = "lb-activity-tab" + (isActive ? " active" : "")
            btn.dataset.activity = key

            const iconHtml = activity.icon || ""
            btn.innerHTML = iconHtml + '<span class="lb-activity-label">' + activity.label + "</span>"

            btn.addEventListener("click", () => {
                if (currentActivity === key) return
                currentActivity = key
                renderActivityTabs()
                renderLeaderboard()
            })
            lbActivities.appendChild(btn)
        })
    }

    function requestCloseLeaderboard() {
        if (!leaderboardVisible) return

        fetch(`https://sunlife_ui/fishing/closeLeaderboard`, {
            method: "POST",
            headers: {
                "Content-Type": "application/json; charset=UTF-8"
            },
            body: "{}"
        }).catch(() => {})
    }

    function renderLeaderboard() {
        lbGrid.innerHTML = ""
        const activity = leaderboardData[currentActivity]
        if (!activity) return

        activity.sections.forEach(section => {
            const col = document.createElement("div")
            col.className = "lb-column"
            col.innerHTML = `
                <div class="lb-col-title">${section.title}</div>
                <div class="lb-col-sub">${section.subtitle}</div>
                <div class="lb-list"></div>
            `
            const list = col.querySelector(".lb-list")

            section.entries.forEach(entry => {
                const row = document.createElement("div")
                row.className = "lb-row"
                row.innerHTML = `
                    <div class="lb-rank">#${entry.rank}</div>
                    <div class="lb-name">${entry.name}</div>
                    <div class="lb-value">${entry.value}</div>
                `
                list.appendChild(row)
            })

            lbGrid.appendChild(col)
        })
    }

    function setLeaderboardVisible(state) {
        leaderboardVisible = state
        if (leaderboardVisible) {
            renderActivityTabs()
            renderLeaderboard()
            lbShell.classList.add("visible")
        } else {
            lbShell.classList.remove("visible")
        }
    }

        function formatRank(val) {
        if (typeof val !== "number") {
            return "Non classé"
        }
        return "#" + val
    }

    function formatXP(profile) {
        if (!profile) return "0 XP"
        const xp = profile.xp || 0
        if (profile.nextLevelXP && typeof profile.nextLevelXP === "number") {
            return xp.toLocaleString("fr-FR") + " / " + profile.nextLevelXP.toLocaleString("fr-FR") + " XP"
        }
        return xp.toLocaleString("fr-FR") + " XP"
    }

    function updateZoneHud(payload) {
        if (!payload || !payload.visible) {
            zoneHud.classList.remove("visible")
            return
        }

        const zone = payload.zone || {}
        const profile = payload.profile || null
        const ranking = payload.ranking || null

        zhZoneName.textContent = zone.name || "Zone de pêche"

        const illegal = !!zone.illegal
        zhZoneTag.textContent = illegal ? "ILLÉGALE" : "LÉGALE"
        zhZoneTag.classList.remove("zh-tag-legal", "zh-tag-illegal")
        zhZoneTag.classList.add(illegal ? "zh-tag-illegal" : "zh-tag-legal")

        const minLevel = zone.minLevel || 1
        zhZoneReq.textContent = "NIV. " + minLevel + "+"

        if (profile && typeof profile.level === "number") {
            zhLevel.textContent = profile.level
        } else {
            zhLevel.textContent = "1"
        }

        zhXPText.textContent = formatXP(profile)

        if (ranking) {
            zhFishersRank.textContent = formatRank(ranking.fishersRank)
            zhSellersRank.textContent = formatRank(ranking.sellersRank)
        } else {
            zhFishersRank.textContent = "Non classé"
            zhSellersRank.textContent = "Non classé"
        }

        zoneHud.classList.add("visible")
    }

    window.addEventListener("message", function (event) {
        const data = event.data
        if (!data || !data.action) return

        if (data.action === "show") {
            setVisible(true)
            updateProgress(0, false)
            if (data.totalDuration) {
                updateTimeLeft(data.totalDuration)
            }
        } else if (data.action === "show_auto") {
            setVisible(true)
            keyCircleLabel.textContent = "VIP"
            stepLabelEl.textContent = data.label || "Pêche auto (VIP Legendary ou Platinium)"
            updateProgress(100, false)
            if (typeof data.remainingMs === "number") {
                updateTimeLeft(data.remainingMs)
            }
        } else if (data.action === "show_sequence") {
            setVisible(true)
            const total = data.totalSteps || 1
            const step = data.currentStep ?? 0
            keyCircleLabel.textContent = data.keyLabel || "E"
            stepLabelEl.textContent = (step + 1) + "/" + total
            updateProgress((step / total) * 100, false)
        } else if (data.action === "sequence_step") {
            const total = data.totalSteps || 1
            const step = data.currentStep ?? 0
            keyCircleLabel.textContent = data.keyLabel || "?"
            stepLabelEl.textContent = (step + 1) + "/" + total
            updateProgress((step / total) * 100, false)
            playKeyPress()
        } else if (data.action === "sequence_complete") {
            keyCircleLabel.textContent = "OK"
            stepLabelEl.textContent = "Attends..."
        } else if (data.action === "hide") {
            setVisible(false)
        } else if (data.action === "progress") {
            if (typeof data.value === "number") {
                updateProgress(data.value, !!data.pulse)
            }
            if (typeof data.remainingMs === "number") {
                updateTimeLeft(data.remainingMs)
            }
        } else if (data.action === "leaderboard_set") {
            setLeaderboardVisible(!!data.state)
        } else if (data.action === "leaderboard_data") {
            const payload = data.data || {}
            const fishing = leaderboardData.fishing
            if (fishing) {
                fishing.sections.forEach(section => {
                    if (section.id === "fishers") {
                        const list = payload.fishers || []
                        section.entries = list.map((row, idx) => {
                            const n = row.name || "Inconnu"
                            const c = row.count || 0
                            return {
                                rank: idx + 1,
                                name: n,
                                value: c + " poissons"
                            }
                        })
                    } else if (section.id === "sellers") {
                        const list = payload.sellers || []
                        section.entries = list.map((row, idx) => {
                            const n = row.name || "Inconnu"
                            const t = row.total || 0
                            return {
                                rank: idx + 1,
                                name: n,
                                value: t.toLocaleString("fr-FR") + " $"
                            }
                        })
                    }
                })
            }
            currentActivity = "fishing"
            setLeaderboardVisible(true)
        } else if (data.action === "zone_hud") {
            updateZoneHud(data)
        }
    })

    document.addEventListener("keydown", function (e) {
        if (!leaderboardVisible) return

        const key = e.key
        if (key === "Escape" || key === "Esc" || key === "Enter" || key === "e" || key === "E") {
            e.preventDefault()
            requestCloseLeaderboard()
        }
    })

    lbShell.addEventListener("mousedown", function (e) {
        if (!leaderboardVisible) return
        if (!lbPanel.contains(e.target)) {
            requestCloseLeaderboard()
        }
    })
</script>
