<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NUI Rent — Amber Panel</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />

  <style>
    /* ========= Thème SunLife — style boutique (dark + carré + orange pur) ========= */
    :root{
      --bg-1:#0a0a0a;
      --bg-2:#101010;
      --bg-3:#181818;
      --panel:#141414;
      --panel-2:#1c1c1c;
      --panel-3:#252525;

      --line:rgba(255,255,255,.06);
      --line-strong:rgba(255,255,255,.10);

      --text:#f2f2f2;
      --text-2:#d0d0d0;
      --muted:#8a8a8a;

      /* Orange SunLife pur — RGB 255,117,31 = #ff751f */
      --accent:        #ff751f;
      --accent-2:      #ff8a3c;
      --accent-3:      #e6661a;
      --accent-soft:   rgba(255,117,31,.16);
      --accent-soft-2: rgba(255,117,31,.30);
      --accent-ring:   rgba(255,117,31,.55);
      --accent-shadow: rgba(255,117,31,.35);
      --accent-glow:   rgba(255,117,31,.45);

      --danger:#ff5c7a;

      --shadow-sm: 0 4px 12px rgba(0,0,0,.30);
      --shadow-md: 0 10px 28px rgba(0,0,0,.45);
      --shadow-lg: 0 20px 60px rgba(0,0,0,.55);
      --shadow:    0 10px 30px rgba(255,117,31,.20);

      --font-sans: "Inter", ui-sans-serif, system-ui, -apple-system,
                   "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      --ease-smooth: cubic-bezier(.22,.61,.36,1);
    }

    *{ box-sizing: border-box; }
    html, body{ height:100%; }
    body{
      margin:0; background:transparent; color:var(--text);
      font: 500 15px/1.5 var(--font-sans);
      -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
      letter-spacing:.005em;
      display:grid; place-items:center;
    }

    /* ==== Overlay + Panel ==== */
    .overlay{ position:fixed; inset:0; background:rgba(0,0,0,.45); opacity:0; pointer-events:none; transition:.2s var(--ease-smooth); }
    .overlay.show{ opacity:1; pointer-events:auto; }

    .panel{
      position:fixed; left:50%; top:50%;
      transform:translate(-50%,-46%) scale(.99);
      width:min(980px, 90vw); height:min(82vh, 820px);
      display:flex; flex-direction:column; overflow:hidden;
      background:
        radial-gradient(1100px 700px at 0% -10%, rgba(255,255,255,.04), transparent 60%),
        radial-gradient(900px 700px at 100% 110%, rgba(255,117,31,.06), transparent 55%),
        linear-gradient(180deg, var(--bg-2) 0%, var(--bg-1) 100%);
      border:1px solid rgba(255,255,255,.05);
      border-radius:0;
      box-shadow: var(--shadow-lg), inset 0 1px 0 rgba(255,255,255,.04);
      opacity:0; pointer-events:none;
      transition: opacity .22s var(--ease-smooth), transform .22s var(--ease-smooth);
    }
    .panel.show{ opacity:1; pointer-events:auto; transform:translate(-50%,-50%) scale(1); }

    .top{
      display:flex; align-items:center; justify-content:space-between; gap:12px;
      padding:14px 22px;
      border-bottom:1px solid var(--line);
      background:
        linear-gradient(180deg, rgba(255,255,255,.025), rgba(255,255,255,0)),
        rgba(10,10,10,.85);
    }
    .title{
      display:flex; align-items:center; gap:10px;
      font-weight:800; letter-spacing:.04em; text-transform:uppercase; font-size:13px;
      margin:0;
    }
    .title .ico{
      width:30px; height:30px; border-radius:0;
      display:grid; place-items:center;
      color:var(--accent);
      border:1px solid var(--accent-ring);
      background:var(--accent-soft);
    }

    .head-left{ display:flex; align-items:center; gap:14px; }

    .close{
      display:grid; place-items:center;
      width:34px; height:34px; border-radius:0; cursor:pointer;
      border:1px solid var(--line-strong);
      background:rgba(255,255,255,.04);
      color:#fff; font:800 14px/1 var(--font-sans);
      transition:.18s var(--ease-smooth);
    }
    .close:hover{
      background:rgba(255,92,122,.18);
      border-color:rgba(255,92,122,.55);
      box-shadow:0 8px 22px rgba(255,92,122,.25);
    }

    .body{ flex:1 1 auto; min-height:0; padding:18px 22px; overflow:auto; }

    .filters{ display:none; }

    /* ==== Recherche ==== */
    .search{ margin-left:auto; position:relative; }
    .search input{
      width:280px;
      background:rgba(255,255,255,.04);
      color:#fff;
      border:1px solid var(--line-strong);
      border-radius:0;
      padding:10px 36px 10px 12px;
      outline:none;
      font: 500 13px/1 var(--font-sans);
      letter-spacing:.02em;
      transition: border-color .18s var(--ease-smooth), background .18s var(--ease-smooth), box-shadow .18s var(--ease-smooth);
    }
    .search input::placeholder{ color: rgba(255,255,255,.30); }
    .search input:focus{
      border-color: var(--accent-ring);
      background: rgba(255,117,31,.04);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }
    .search .icon{ position:absolute; right:10px; top:50%; transform:translateY(-50%); opacity:.7; color:#fff; }

    /* ==== Grille véhicules ==== */
    .grid{ display:grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap:14px; }
    @media (max-width:860px){ .grid{ grid-template-columns: 1fr; } }

    .car{
      position:relative;
      display:grid; grid-template-columns: 200px 1fr; gap:12px; align-items:stretch;
      border-radius:0; overflow:hidden; padding:10px;
      background: var(--panel-2);
      border:1px solid var(--line-strong);
      transition: transform .22s var(--ease-smooth), border-color .22s var(--ease-smooth), box-shadow .22s var(--ease-smooth);
    }
    .car:hover{
      transform: translateY(-2px);
      border-color: rgba(255,255,255,.20);
      box-shadow: 0 12px 28px rgba(0,0,0,.40);
    }
    .car.selected{
      border-color: var(--accent);
      box-shadow:
        0 0 0 2px var(--accent-soft) inset,
        0 14px 38px var(--accent-shadow);
    }

    .thumb{
      position:relative; border-radius:0; overflow:hidden;
      background:var(--bg-1);
      min-height:140px;
      border:1px solid var(--line);
    }
    .thumb img{
      width:100%; height:100%; object-fit:cover; display:block;
      transform: scale(1);
      transition: transform .45s var(--ease-smooth);
    }
    .car:hover .thumb img{ transform: scale(1.05); }

    .info{ display:flex; flex-direction:column; gap:8px; }
    .name{
      font-weight:800;
      letter-spacing:.02em;
      display:flex; align-items:center; gap:8px;
      font-size:16px;
    }
    .badge{
      display:inline-flex; align-items:center; gap:6px;
      padding:3px 8px;
      font-size:11px; font-weight:700; letter-spacing:.04em; text-transform:uppercase;
      background: var(--accent-soft);
      border:1px solid var(--accent-ring);
      color:#fff;
    }

    .desc{
      color: var(--text-2);
      font-size:13px; line-height:1.45;
      display:flex; gap:8px; align-items:flex-start;
    }
    .desc .ico{
      display:inline-grid; place-items:center;
      width:18px; height:18px; flex-shrink:0; margin-top:1px;
      color: var(--accent);
    }
    .desc .ico svg{ width:18px; height:18px; }

    .row{ margin-top:auto; display:flex; align-items:center; gap:10px; }
    .choose{
      margin-left:auto;
      display:inline-flex; align-items:center; gap:8px;
      padding: 9px 14px;
      background: var(--accent);
      color: #1a0d04;
      border: 1px solid var(--accent-ring);
      cursor: pointer;
      font-weight: 800;
      letter-spacing: .04em;
      text-transform: uppercase;
      font-size: 12px;
      box-shadow: 0 4px 14px var(--accent-shadow);
      transition: .18s var(--ease-smooth);
    }
    .choose:hover{
      transform: translateY(-1px);
      background: var(--accent-2);
      filter: brightness(1.05);
    }
    .choose svg{ stroke: currentColor; fill: none; }

    /* Pastille prix (top-right de la vignette) */
    .price-badge{
      position:absolute; top:8px; right:8px;
      display:inline-flex; align-items:center; gap:6px;
      padding: 6px 10px;
      color:#1a0d04;
      background: var(--accent);
      border:1px solid var(--accent-ring);
      box-shadow:
        0 6px 16px var(--accent-shadow),
        0 0 0 1px rgba(255,255,255,.06) inset;
      font: 800 12px/1 var(--font-sans);
      letter-spacing: .04em;
      text-transform: uppercase;
      z-index:5;
    }
    .price-badge .unit{ opacity:.85; font-weight:700; }

    /* Pastille classe (top-left) */
    .class-chip{
      position:absolute; left:8px; top:8px;
      display:inline-flex; gap:6px; align-items:center;
      padding: 5px 10px;
      background: rgba(10,10,10,.80);
      border:1px solid var(--line-strong);
      color:#fff;
      font:700 11px/1 var(--font-sans);
      letter-spacing:.04em;
      text-transform:uppercase;
    }

    /* ==== Footer ==== */
    .foot{
      display:flex; align-items:center; justify-content:space-between; gap:12px;
      padding:14px 22px;
      border-top:1px solid var(--line);
      background: rgba(10,10,10,.55);
    }
    .hint{ color: var(--muted); font-size:12px; letter-spacing:.02em; }

    .btn{
      display:inline-flex; align-items:center; gap:8px;
      padding: 10px 16px;
      cursor: pointer;
      font-weight: 700;
      letter-spacing: .04em;
      text-transform: uppercase;
      font-size: 12px;
      color: #fff;
      transition: .15s var(--ease-smooth);
    }
    .btn.ghost{
      background: rgba(255,255,255,.04);
      border: 1px solid var(--line-strong);
    }
    .btn.ghost:hover{
      background: rgba(255,255,255,.08);
      border-color: rgba(255,255,255,.20);
      transform: translateY(-1px);
    }
    .btn.primary{
      border: 1px solid var(--accent-ring);
      background: var(--accent);
      color: #1a0d04;
      box-shadow: 0 4px 14px var(--accent-shadow);
    }
    .btn.primary:hover{
      transform: translateY(-1px);
      background: var(--accent-2);
      filter: brightness(1.05);
    }
    .btn.primary[disabled]{
      opacity:.4; filter: grayscale(.6); cursor: not-allowed;
      box-shadow: none; transform: none;
    }

    /* ==== Scrollbar ==== */
    .body{ scrollbar-width: thin; scrollbar-color: var(--accent) rgba(255,255,255,.06); }
    .body::-webkit-scrollbar{ width:8px; height:8px; }
    .body::-webkit-scrollbar-track{ background: rgba(255,255,255,.04); border:1px solid var(--line); }
    .body::-webkit-scrollbar-thumb{
      background: linear-gradient(180deg, var(--accent), var(--accent-3));
      border:2px solid var(--bg-1);
      box-shadow: 0 2px 8px var(--accent-shadow) inset;
    }
    .body::-webkit-scrollbar-thumb:hover{ background: linear-gradient(180deg, var(--accent-2), var(--accent)); }

    /* Apparition progressive */
    .grid.stagger .car{ opacity: 0; transform: translateY(8px) scale(.99); filter: blur(1px); }
    .grid.stagger .car.reveal{ opacity: 1; transform: none; filter: blur(0); }

    @media (prefers-reduced-motion: reduce){
      .panel, .car, .thumb img, .btn{ transition: none !important; }
      .grid.stagger .car, .grid.stagger .car.reveal{
        opacity: 1 !important; transform: none !important; filter: none !important; transition: none !important;
      }
    }

    /* Inter partout */
    :where(html, body, button, input, select, textarea){
      font-family: var(--font-sans) !important;
    }
    button, input, select, textarea{
      font: inherit;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      appearance: none;
      -webkit-appearance: none;
    }
    .choose, .btn{ font-family: var(--font-sans) !important; }
    .search input{ font: inherit; }

    /* Anti-sélection globale */
    :where(html, body, .panel, .panel *) :not(input):not(textarea):not([contenteditable="true"]){
      user-select: none;
      -webkit-user-select: none;
      -ms-user-select: none;
      -moz-user-select: none;
    }
    :where(input, textarea, [contenteditable="true"]){
      user-select: text;
      -webkit-user-select: text;
    }
    :where(html, body, .panel){ -webkit-touch-callout: none; }
    :where(.panel, .panel *){ -webkit-tap-highlight-color: transparent; }

    img{ -webkit-user-drag: none; user-drag: none; }
  </style>
</head>
<body>
  <div id="overlay" class="overlay" aria-hidden="true"></div>

  <section id="rentPanel" class="panel" role="dialog" aria-modal="true" aria-labelledby="rentTitle">
    <header class="top">
      <div class="head-left">
        <h2 class="title" id="rentTitle">
          <span class="ico" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="11" width="18" height="8" rx="2" ry="2"/>
              <path d="M7 11V7a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v4"/>
              <circle cx="7.5" cy="19" r="1.5"/>
              <circle cx="16.5" cy="19" r="1.5"/>
            </svg>
          </span>
          Location de véhicules
        </h2>
      </div>

      <div class="search" role="search">
        <input id="searchInput" type="search" placeholder="Rechercher un modèle..." aria-label="Rechercher" />
        <span class="icon" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        </span>
      </div>

      <button class="close" id="closeBtn" aria-label="Fermer">✕</button>
    </header>

    <div class="body">
      <div id="carsGrid" class="grid" aria-live="polite"></div>
    </div>
  </section>

  <script>
  (()=>{
    const overlay   = document.getElementById('overlay');
    const panel     = document.getElementById('rentPanel');
    const grid      = document.getElementById('carsGrid');
    const confirmBt = document.getElementById('confirmBtn');
    const cancelBt  = document.getElementById('cancelBtn');
    const closeBt   = document.getElementById('closeBtn');
    const hintEl    = document.getElementById('hint');

    const searchInp = document.getElementById('searchInput');

    let resource    = 'sunlife_ui/location';
    let allVehicles = [];
    let filtered    = [];
    let selectedIdx = -1; // index dans 'filtered'

    function post(endpoint, payload={}){
      try{
        fetch(`https://${resource}/${endpoint}`,{ method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload) });
      }catch(e){ /* silencieux hors NUI */ }
    }

    function formatMoney(v){
      const n = Number(v||0);
      return n.toLocaleString('fr-FR', { maximumFractionDigits: 0 });
    }

    function applyFilter(){
      const q = (searchInp.value||'').trim().toLowerCase();
      filtered = allVehicles.filter(v=>{
        if(!q) return true;
        const name = (v.displayName||v.name||'').toLowerCase();
        const hash = (v.hash||'').toLowerCase();
        const cls  = (v.class||'').toLowerCase();
        return name.includes(q) || hash.includes(q) || cls.includes(q);
      });
      renderCars();
    }

    function pick(index){
      selectedIdx = index;
      [...grid.children].forEach((el,idx)=> el.classList.toggle('selected', idx===index));

      if(index>=0){
        const v = filtered[index];
      }
    }

    function renderCars(){
      grid.innerHTML = '';
      if(!filtered.length){
        grid.innerHTML = `<div style="grid-column:1/-1; opacity:.85; text-align:center; padding:24px; border:1px dashed rgba(255,255,255,.12); color:var(--muted); letter-spacing:.04em; text-transform:uppercase; font-weight:700; font-size:12px;">Aucun véhicule trouvé.</div>`;
        selectedIdx = -1; return;
      }

      grid.classList.add('stagger');
      filtered.forEach((car,i)=>{
        const card = document.createElement('article');
        card.className = 'car'; card.tabIndex = 0; card.setAttribute('role','button'); card.setAttribute('aria-pressed', selectedIdx===i);
        const cls  = (car.class||'autres');
        const name = (car.displayName||car.name||car.hash||'Véhicule');
        const img  = car.img ? `<img src="${car.img}" alt="${name}">` : '';
        card.innerHTML = `
          <div class="thumb">
            <div class="price-badge" aria-label="Prix">
              <span class="num">${formatMoney(car.price)}$</span>
              <span class="unit">/ location</span>
            </div>
            ${img}
          </div>
          <div class="info">
            <div class="name">${name}</div>
            <div class="desc">
              <span class="ico" aria-hidden="true">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="12" cy="12" r="9"/>
                  <line x1="12" y1="8" x2="12.01" y2="8"/>
                  <line x1="12" y1="12" x2="12" y2="16"/>
                </svg>
              </span>
              <span class="txt">${car.desc || "n.a"}</b></span>
            </div>
            <div class="row">
              <button class="choose" aria-label="Louer ${name}">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
                Louer
              </button>
            </div>
          </div>`;

        card.addEventListener('click', (e)=>{
          if(e.target.closest('.choose')){ pick(i); confirm(); return; }
          pick(i);
        });
        card.addEventListener('keydown', (e)=>{ if(e.key==='Enter' || e.key===' '){ e.preventDefault(); pick(i); }});
        grid.appendChild(card);
      });

      const delay = 65;
      const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      requestAnimationFrame(()=>{
        [...grid.children].forEach((el, idx)=>{
          el.classList.remove('reveal');
          const d = reduceMotion ? 0 : idx * delay;
          setTimeout(()=> el.classList.add('reveal'), d);
        });
        const total = (reduceMotion ? 0 : (grid.children.length - 1) * delay) + 350;
        setTimeout(()=> grid.classList.remove('stagger'), total);
      });
    }

    function openUI(vehicles){
      allVehicles = Array.isArray(vehicles) ? vehicles.map(v=>({ ...v })) : [];
      selectedIdx = -1; searchInp.value = '';
      applyFilter();
      overlay.classList.add('show');
      panel.classList.add('show');
    }

    function closeUI(sendClose = true){
      overlay.classList.remove('show');
      panel.classList.remove('show');
      post('close', { });
      if (sendClose) post('close');
    }

    function confirm(){
      if(selectedIdx<0) return;
      const choice = filtered[selectedIdx];
      post('rent', choice);
      closeUI(false);
    }

    // listeners
    closeBt.addEventListener('click',  ()=> closeUI(true));

    searchInp.addEventListener('input', ()=>{ applyFilter(); pick(-1); });

    // ESC / ENTER global
    window.addEventListener('keydown', (e)=>{
      if(!panel.classList.contains('show')) return;
      if(e.key === 'Escape')  closeUI(true);
      if(e.key === 'Enter')   confirm();
    });

    // Réception NUI
    window.addEventListener('message', (ev)=>{
      const msg = ev.data || {};
      if(msg.action === 'openRent'){
        openUI(msg.vehicles || []);
      }
      if(msg.action === 'closeRent' || msg.action === 'close') closeUI(false);
    });
  })();
  </script>

  <!-- ============================================================
       Click sound (identique à SNL_Boutique).
       Web Audio synthétisé : 3 couches (snap + pop + sub) pour un
       click "tactile/punchy". Aucun asset audio requis.
       Throttle 35ms anti-spam, opt-out via [data-no-click-sound].
       ============================================================ -->
  <script>
  (() => {
    let _audioCtx = null;
    function getAudioCtx(){
      if (_audioCtx) return _audioCtx;
      const Ctor = window.AudioContext || window.webkitAudioContext;
      if (!Ctor) return null;
      try { _audioCtx = new Ctor(); } catch(e){ return null; }
      return _audioCtx;
    }

    const CLICK_VOL = 0.1;
    let _lastClickAt = 0;
    function playClickSound(opts){
      const ctx = getAudioCtx();
      if (!ctx) return;
      const nowMs = performance.now();
      if (nowMs - _lastClickAt < 35) return;
      _lastClickAt = nowMs;
      try { if (ctx.state === 'suspended') ctx.resume(); } catch(e){}

      const now = ctx.currentTime;
      const intensity = (opts && opts.soft) ? 0.6 : 1;
      const master = ctx.createGain();
      master.gain.setValueAtTime(0.95 * CLICK_VOL * intensity, now);
      master.connect(ctx.destination);

      // 1) Transient SNAP : burst de bruit large bande, attaque ultra-rapide.
      const noiseLen = 0.030;
      const buf = ctx.createBuffer(1, Math.max(1, Math.floor(ctx.sampleRate * noiseLen)), ctx.sampleRate);
      const data = buf.getChannelData(0);
      for (let i = 0; i < data.length; i++) {
        const env = (i < 4 ? 1 : (1 - i / data.length));
        data[i] = (Math.random() * 2 - 1) * env;
      }
      const noise = ctx.createBufferSource();
      noise.buffer = buf;
      const bp = ctx.createBiquadFilter();
      bp.type = 'bandpass';
      bp.frequency.value = 2200;
      bp.Q.value = 0.9;
      const noiseG = ctx.createGain();
      noiseG.gain.setValueAtTime(0.0001, now);
      noiseG.gain.exponentialRampToValueAtTime(0.85, now + 0.001);
      noiseG.gain.exponentialRampToValueAtTime(0.0001, now + noiseLen);
      noise.connect(bp).connect(noiseG).connect(master);
      noise.start(now);
      noise.stop(now + noiseLen);

      // 2) Mid POP : oscillateur square pour donner du grain (plastic switch).
      const baseHz = 1300 + (Math.random() * 200 - 100);
      const osc = ctx.createOscillator();
      osc.type = 'square';
      osc.frequency.setValueAtTime(baseHz, now);
      osc.frequency.exponentialRampToValueAtTime(baseHz * 0.55, now + 0.05);
      const oscFilt = ctx.createBiquadFilter();
      oscFilt.type = 'lowpass';
      oscFilt.frequency.value = 3200;
      oscFilt.Q.value = 0.5;
      const oscG = ctx.createGain();
      oscG.gain.setValueAtTime(0.0001, now);
      oscG.gain.exponentialRampToValueAtTime(0.55, now + 0.002);
      oscG.gain.exponentialRampToValueAtTime(0.0001, now + 0.075);
      osc.connect(oscFilt).connect(oscG).connect(master);
      osc.start(now);
      osc.stop(now + 0.08);

      // 3) Sub THUMP : sine basse pour le poids "haptique" du click.
      const sub = ctx.createOscillator();
      sub.type = 'sine';
      sub.frequency.setValueAtTime(160, now);
      sub.frequency.exponentialRampToValueAtTime(60, now + 0.07);
      const subG = ctx.createGain();
      subG.gain.setValueAtTime(0.0001, now);
      subG.gain.exponentialRampToValueAtTime(0.50, now + 0.003);
      subG.gain.exponentialRampToValueAtTime(0.0001, now + 0.085);
      sub.connect(subG).connect(master);
      sub.start(now);
      sub.stop(now + 0.09);
    }

    document.addEventListener('click', (e) => {
      const t = e.target;
      if (!(t instanceof Element)) return;
      // Pas de son sur les inputs / opt-out.
      if (t.closest('input, textarea, select')) return;
      if (t.closest('[data-no-click-sound]')) return;
      // "Soft" pour un clic dans le vide / hors cible interactive.
      const isInteractive = !!t.closest('button, a, [role="button"], .btn, .choose, .close, .car, .panel, .tab, [tabindex]');
      playClickSound({ soft: !isInteractive });
    }, true);
  })();
  </script>
</body>
</html>
