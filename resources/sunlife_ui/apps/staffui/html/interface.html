<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Admin HUD</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet"/>
    <style>
        :root{--bg:#0e0d0b;--panel:#14120f;--glass:rgba(20, 18, 15, 0.55);--edge:rgba(255,255,255,.08);--text:#f2f2f5;--muted:#9aa0b3;--accent:#ffb73c;--accent-2:#ffca84;--accent-3:#e69c2e;--success:#2ed47a;--danger:#ff5c7a;--info:#6aa8ff;--med:#ffa94d;--font:"Montserrat",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
        :root{
            --staff-scale:.70;
            --staff-offset-y:0vh;
            --staff-right:78.2vw;
            --staff-width:28vw;
        }
        
        *{box-sizing:border-box}
        html,body{height:100%}
        body{margin:0;background:transparent;color:var(--text);font:600 clamp(.9rem,1.15vw,1rem)/1.25 var(--font);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;pointer-events:none}
        .hud{position:fixed;top:50%;right:2.2vw;transform:translateY(-50%) scale(.82);transform-origin:right center;display:none;opacity:0;transition:.18s ease;width:min(28vw,92vw);max-width:92vw}
        .hud.show{display:block;opacity:1}
        .card{position:relative;border-radius:1.6vw;padding:2.2vh 1.6vw;background:linear-gradient(180deg,rgba(20, 18, 15,.55),rgba(20, 18, 15,.35));border:.12rem solid var(--edge);backdrop-filter:saturate(140%) blur(6px);-webkit-backdrop-filter:saturate(140%) blur(6px);box-shadow:0 1.4vh 3.6vh rgba(0,0,0,.55),inset 0 0 .6rem rgba(0,0,0,.35)}
        .title{display:flex;align-items:center;gap:.7vw;margin-bottom:1.8vh;justify-content:space-between}
        .title-left{display:flex;align-items:center;gap:.7vw}
        .shield{width:clamp(2rem,2.4vw,2.8rem);height:clamp(2rem,2.4vw,2.8rem);border-radius:.9rem;display:grid;place-items:center;color:var(--accent-3);background:rgba(255,255,255,.06);border:.1rem solid rgba(255,255,255,.18);box-shadow:inset 0 0 .6rem rgba(0,0,0,.25)}
        .label{font-weight:800;letter-spacing:.04em;font-size:clamp(1rem,1.15vw,1.25rem);text-transform:uppercase}
        .chip{pointer-events:none;font-weight:800;font-size:clamp(.66rem,.8vw,.9rem);padding:.22rem .6rem;border-radius:1rem;background:linear-gradient(180deg,rgba(255, 164, 60, 0.18),rgba(255, 164, 60,.08));border:1px solid rgba(255, 164, 60,.35);color:#1d1c12;text-shadow:0 1px 0 rgba(255,255,255,.35)}
        .kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:1.1vw}
        .kpi{display:flex;gap:.9vw;align-items:center;padding:1.2vh 1vw;border-radius:1rem;background:linear-gradient(180deg,rgba(40,39,28,.6),rgba(25,24,18,.4));border:.1rem solid rgba(255,255,255,.1);box-shadow:0 .8vh 2.2vh rgba(0,0,0,.45);min-width:0;transition:transform .12s ease,box-shadow .12s ease}
        .kpi:hover{transform:translateY(-2px);box-shadow:0 1vh 2.6vh rgba(0,0,0,.55)}
        .ico{flex:0 0 auto;width:clamp(1.6rem,1.9vw,2.2rem);height:clamp(1.6rem,1.9vw,2.2rem);display:grid;place-items:center;border-radius:.7rem;background:rgba(255,255,255,.06);border:.1rem solid rgba(255,255,255,.16);box-shadow:inset 0 0 .5rem rgba(0,0,0,.22)}
        .ico svg{width:70%;height:70%;display:block}
        .ico--reports{color:var(--accent-2)}
        .ico--staffs{color:var(--success)}
        .ico--users{color:var(--info)}
        .ico--dead{color:var(--danger)}
        .ico--police{color:var(--info)}
        .ico--ems{color:var(--med)}
        .ico--peak{color:var(--accent-3)}
        .txt{display:flex;flex-direction:column;gap:.2vh;min-width:0}
        .txt .label{font-weight:700;font-size:clamp(.78rem,.92vw,.95rem);color:var(--muted);letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        .value{display:flex;align-items:baseline;gap:.45vw;font-weight:800;font-size:clamp(1.05rem,1.55vw,1.65rem);flex-wrap:wrap}
        .pill{font-weight:800;font-size:clamp(.68rem,.85vw,.9rem);padding:.18rem .5rem;border-radius:.6rem;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);white-space:nowrap}
        .kpi--center{grid-column:1/-1;justify-content:center;text-align:center}
        .kpi--center .txt{align-items:center}
        .glow{position:absolute;inset:-2px;border-radius:inherit;background:radial-gradient(60% 60% at 85% 10%,rgba(255, 164, 60,.18),transparent 60%);filter:blur(14px);opacity:.9;z-index:-1}
        .hintline{margin:1.2vh 0 0;text-align:center;font-weight:700;font-size:clamp(.7rem,.85vw,.9rem);color:var(--muted);opacity:.9}
        @media (max-width:1100px){.hud{right:3vw;transform:translateY(-50%) scale(.9)}.kpis{gap:3.2vw}.kpi{border-radius:1.2rem}}
        @media (prefers-reduced-motion:reduce){.hud{transition:none}.kpi{transition:none}.kpi:hover{transform:none}}
            .card{backdrop-filter:none!important;-webkit-backdrop-filter:none!important}
        .glow{filter:none!important;display:none!important}

        .hud{
            position:fixed;
            top:50%;
            right:var(--staff-right);
            transform:translateY(calc(-50% + var(--staff-offset-y))) scale(var(--staff-scale));
            transform-origin:right center;
            display:none;
            opacity:0;
            transition:.18s ease;
            width:min(var(--staff-width),92vw);
            max-width:92vw;
        }
        .hud.show{display:block;opacity:1}
    </style>
</head>
<body>
    <div id="hud" class="hud" aria-live="polite">
        <div class="card">
            <div class="glow"></div>
            <div class="title">
                <div class="title-left">
                    <div class="shield" aria-hidden="true">
                        <svg viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M12 2c-.3 0-.6.06-.86.18l-6.5 2.92A1.5 1.5 0 0 0 4 6.49V11c0 5.55 3.8 8.93 7.41 10.74.37.19.81.19 1.18 0C16.2 19.93 20 16.55 20 11V6.5c0-.6-.35-1.15-.9-1.4l-6.5-2.92A1.94 1.94 0 0 0 12 2zm-5.5 4.97 5.5-2.47 5.5 2.47V11c0 4.42-2.95 7.3-5.5 8.74C9.95 18.3 6.5 15.42 6.5 11V6.97z"/></svg>
                    </div>
                    <div class="label">Staff Mode SUNLIFE</div>
                </div>
            </div>
            <div class="kpis">
                <div class="kpi">
                    <div class="ico ico--reports" aria-hidden="true">
                        <svg viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg"><path d="M2 5a2 2 0 0 1 2-2h12.5a2 2 0 0 1 1.6.8l3.5 4.667a2 2 0 0 1 .4 1.2V17a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5zm2 0v12h16v-6.667L17.5 5H4zm7 3h2v4h-2V8zm0 6h2v2h-2v-2z"/></svg>
                    </div>
                    <div class="txt">
                        <div class="label">Reports</div>
                        <div class="value"><span id="reportsVal">0</span></div>
                    </div>
                </div>
                <div class="kpi">
                    <div class="ico ico--staffs" aria-hidden="true">
                        <svg viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg"><path d="M12 12a4 4 0 1 0-4-4 4 4 0 0 0 4 4Zm0 2c-4.67 0-8 2.34-8 5.5V22h10.53a6.48 6.48 0 0 1-1.03-3.5 6.5 6.5 0 0 1 3.5-5.72A11.3 11.3 0 0 0 12 14Z"/><path d="M19.5 10.5 22 11.6v6.9a5.6 5.6 0 0 1-2.5 3.9 5.6 5.6 0 0 1-2.5-.9 5.6 5.6 0 0 1-2.5-3.9v-6.9l2.5-1.1Z"/></svg>
                    </div>
                    <div class="txt">
                        <div class="label">Staffs en service</div>
                        <div class="value"><span id="staffVal">0</span></div>
                    </div>
                </div>
            </div>
            <p class="hintline">Appuie sur <b>H</b> pour masquer/afficher l’interface</p>
        </div>
    </div>
    <script>
        (()=>{const hud=document.getElementById('hud');const rep=document.getElementById('reportsVal');const stf=document.getElementById('staffVal');let visible=false;let manuallyHidden=false;let serverWantsOn=true;function show(){if(!visible){hud.classList.add('show');visible=true}}function hide(){if(visible){hud.classList.remove('show');visible=false}}function setData(p){rep.textContent=Number(p.reports||0).toString();stf.textContent=Number(p.staffs||0).toString()}window.addEventListener('message',e=>{const m=e.data||{};if(m.action==='adminhud:toggle'){if(m.on===false){manuallyHidden=true;hide()}else{manuallyHidden=false;show()}return}if(m.action==='adminhud:set'){setData(m);serverWantsOn=(m.on!==false);if(!manuallyHidden&&serverWantsOn){show()}else{hide()}}})})()
    </script>
</body>
</html>
