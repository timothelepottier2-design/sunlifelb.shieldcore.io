<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <title>Weed Pot HUD</title>
  <style>
    :root{
      --glass: rgba(10, 14, 12, 0.55);
      --glass2: rgba(10, 14, 12, 0.30);
      --line: rgba(255,255,255,0.10);
      --txt: rgba(255,255,255,0.92);
      --muted: rgba(255,255,255,0.62);
      --accent: rgba(86, 255, 156, 0.95);
      --accent2: rgba(50, 210, 130, 0.9);
      --warn: rgba(255, 203, 86, 0.95);
      --danger: rgba(255, 86, 115, 0.92);
      --shadow: rgba(0,0,0,0.45);
    }

    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden; background: transparent; }
    body { font-family: "Montserrat", system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; }

    #root {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .hud {
      position: absolute;
      transform: translate(-50%, -120%);
      width: 18vw;
      max-width: 28vh;
      min-width: 14vw;
      opacity: 0;
      filter: drop-shadow(0 0 2vh var(--shadow));
      transition: opacity 180ms ease, transform 180ms ease;
    }

    .hud.show {
      opacity: 1;
      transform: translate(-50%, -135%);
    }

    .card {
      width: 100%;
      border-radius: 1.6vh;
      background: linear-gradient(180deg, var(--glass), var(--glass2));
      border: 0.18vh solid var(--line);
      backdrop-filter: blur(1.2vh);
      -webkit-backdrop-filter: blur(1.2vh);
      overflow: hidden;
    }

    .topbar {
      width: 100%;
      padding: 1.4vh 1.6vh;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1vh;
      border-bottom: 0.18vh solid rgba(255,255,255,0.06);
      background: linear-gradient(90deg, rgba(86,255,156,0.10), rgba(86,255,156,0.00));
    }

    .title {
      display: flex;
      flex-direction: column;
      gap: 0.4vh;
      min-width: 0;
    }

    .title .brand {
      font-size: 1.15vh;
      letter-spacing: 0.55vh;
      text-transform: uppercase;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .title .name {
      font-size: 1.65vh;
      font-weight: 600;
      letter-spacing: 0.14vh;
      color: var(--txt);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .badge {
      padding: 0.6vh 1.0vh;
      border-radius: 999vh;
      border: 0.18vh solid rgba(255,255,255,0.10);
      background: rgba(255,255,255,0.06);
      color: var(--txt);
      font-size: 1.15vh;
      font-weight: 600;
      letter-spacing: 0.18vh;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .body {
      padding: 1.6vh 1.6vh 1.8vh 1.6vh;
      display: grid;
      grid-template-columns: 34% 1fr;
      gap: 1.4vh;
      align-items: center;
    }

    .ringWrap {
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 999vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at 30% 30%, rgba(86,255,156,0.20), rgba(0,0,0,0.05));
      border: 0.18vh solid rgba(255,255,255,0.10);
      overflow: hidden;
      position: relative;
    }

    .ringWrap::after{
      content:"";
      position:absolute;
      inset: 10%;
      border-radius: 999vh;
      background: rgba(0,0,0,0.20);
      border: 0.18vh solid rgba(255,255,255,0.08);
      backdrop-filter: blur(0.8vh);
    }

    .ringCenter {
      position: relative;
      z-index: 2;
      width: 100%;
      height: 100%;
      display: grid;
      place-items: center;
    }

    .ringText {
      display: grid;
      place-items: center;
      gap: 0.2vh;
      text-align: center;
    }

    .ringText .pct {
      font-size: 1.8vh;
      font-weight: 700;
      letter-spacing: 0.1vh;
      color: var(--txt);
      line-height: 1;
    }

    .ringText .sub {
      font-size: 1.05vh;
      color: var(--muted);
      letter-spacing: 0.35vh;
      text-transform: uppercase;
    }

    .stats {
      display: grid;
      gap: 1.1vh;
    }

    .row {
      display: grid;
      gap: 0.6vh;
    }

    .rowHead {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 1vh;
    }

    .label {
      font-size: 1.15vh;
      letter-spacing: 0.22vh;
      text-transform: uppercase;
      color: var(--muted);
      white-space: nowrap;
    }

    .value {
      font-size: 1.25vh;
      font-weight: 600;
      letter-spacing: 0.08vh;
      color: var(--txt);
      white-space: nowrap;
    }

    .bar {
      width: 100%;
      height: 0.9vh;
      border-radius: 999vh;
      background: rgba(255,255,255,0.08);
      border: 0.18vh solid rgba(255,255,255,0.06);
      overflow: hidden;
      position: relative;
    }

    .fill {
      height: 100%;
      width: 0%;
      border-radius: 999vh;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      box-shadow: 0 0 2vh rgba(86,255,156,0.25);
      transition: width 220ms ease;
    }

    .hint {
      margin-top: 0.2vh;
      font-size: 1.05vh;
      color: rgba(255,255,255,0.52);
      letter-spacing: 0.14vh;
      line-height: 1.2;
    }

    .stateLine {
      width: 100%;
      padding: 1.0vh 1.6vh;
      border-top: 0.18vh solid rgba(255,255,255,0.06);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1vh;
      background: rgba(0,0,0,0.12);
    }

    .state {
      display: flex;
      align-items: center;
      gap: 0.8vh;
      min-width: 0;
    }

    .dot {
      width: 0.9vh;
      height: 0.9vh;
      border-radius: 999vh;
      background: var(--accent);
      box-shadow: 0 0 1.4vh rgba(86,255,156,0.35);
      flex: 0 0 auto;
    }

    .stateText {
      font-size: 1.18vh;
      font-weight: 600;
      letter-spacing: 0.14vh;
      color: var(--txt);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-transform: uppercase;
    }

    .timer {
      font-size: 1.1vh;
      letter-spacing: 0.28vh;
      text-transform: uppercase;
      color: var(--muted);
      white-space: nowrap;
    }

    .warn .dot { background: var(--warn); box-shadow: 0 0 1.4vh rgba(255,203,86,0.35); }
    .danger .dot { background: var(--danger); box-shadow: 0 0 1.4vh rgba(255,86,115,0.35); }

    .hud.small { width: 16vw; max-width: 26vh; }
    .hud.big { width: 20vw; max-width: 30vh; }

    .hud {
    position: absolute;
    transform: translate(-50%, -120%);
    width: 18vw;
    max-width: 28vh;
    min-width: 14vw;
    opacity: 0;
    transition: opacity 180ms ease, transform 180ms ease;
    }

    .hud.show {
    opacity: 1;
    transform: translate(-50%, -135%);
    }

    /* OVERLAY: plus de panneau plein */
    .card{
    width: 100%;
    background: transparent;
    border: 0;
    backdrop-filter: none;
    -webkit-backdrop-filter: none;
    border-radius: 0;
    overflow: visible;
    filter: drop-shadow(0 1.2vh 1.8vh rgba(0,0,0,0.35));
    }

    /* Topbar devient un "chip" */
    .topbar{
    width: 100%;
    padding: 0;
    border: 0;
    background: transparent;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1vh;
    margin-bottom: 0.9vh;
    }

    .title{
    min-width: 0;
    padding: 0.9vh 1.2vh;
    border-radius: 1.4vh;
    background: rgba(10, 14, 12, 0.18);
    border: 0.16vh solid rgba(255,255,255,0.08);
    backdrop-filter: blur(1.0vh);
    -webkit-backdrop-filter: blur(1.0vh);
    }

    .badge{
    padding: 0.8vh 1.2vh;
    border-radius: 999vh;
    border: 0.16vh solid rgba(255,255,255,0.10);
    background: rgba(10, 14, 12, 0.18);
    backdrop-filter: blur(1.0vh);
    -webkit-backdrop-filter: blur(1.0vh);
    }

    /* Body en overlay léger */
    .body{
    padding: 1.2vh 1.2vh;
    border-radius: 1.6vh;
    background: rgba(10, 14, 12, 0.14);
    border: 0.16vh solid rgba(255,255,255,0.07);
    backdrop-filter: blur(1.2vh);
    -webkit-backdrop-filter: blur(1.2vh);
    display: grid;
    grid-template-columns: 34% 1fr;
    gap: 1.4vh;
    align-items: center;
    }

    /* Ligne d'état en "chip" */
    .stateLine{
    margin-top: 0.9vh;
    width: 100%;
    padding: 0.9vh 1.2vh;
    border-radius: 1.4vh;
    border: 0.16vh solid rgba(255,255,255,0.08);
    background: rgba(10, 14, 12, 0.18);
    backdrop-filter: blur(1.0vh);
    -webkit-backdrop-filter: blur(1.0vh);
    }

    .stats{ min-width: 0; }
    .row{ min-width: 0; }
    .rowHead{ min-width: 0; }

    .label{
    flex: 0 0 auto;
    }

    .value{
    flex: 1 1 auto;
    min-width: 0;
    text-align: right;
    white-space: normal;     /* autorise retour ligne */
    overflow: visible;       /* plus de coupe */
    text-overflow: clip;
    line-height: 1.15;
    }

    /* 1) Etat (EN CROISSANCE) jamais coupé */
    .stateText{
    white-space: normal;
    overflow: visible;
    text-overflow: clip;
    max-width: 100%;
    line-height: 1.15;
    }

    /* Timer lisible, pas d’ellipsis */
    .timer{
    white-space: nowrap;
    overflow: visible;
    text-overflow: clip;
    letter-spacing: 0.22vh;
    }

    /* 3) Les values peuvent wrap sans dépasser */
    .rowHead{
    align-items: flex-start;
    }

    .value{
    max-width: 60%;
    word-break: break-word;
    }

    /* Un peu plus de place à droite pour éviter les retours moches */
    .body{
    grid-template-columns: 30% 1fr;
    }

    /* Optionnel: le chip du bas s’adapte mieux en hauteur */
    .stateLine{
    align-items: flex-start;
    }

    /* Le HUD peut respirer un peu + large */
    .hud{
    width: 22vw;
    min-width: 18vw;
    max-width: 36vh;
    }

    /* Les values : 1 ligne, jamais lettre par lettre */
    .value{
    white-space: nowrap;
    word-break: normal;
    overflow-wrap: normal;
    hyphens: none;
    max-width: none;
    }

    /* Prochain stade: si tu veux qu'il ne casse JAMAIS */
    #next{
    white-space: nowrap;
    }

    /* Garde les labels en 1 ligne aussi */
    .label{
    white-space: nowrap;
    }

    .brandIcon{
        width: 3.2vh;
        height: 3.2vh;
        display: grid;
        place-items: center;
        color: rgba(255,255,255,0.92);
        flex: 0 0 auto;
    }

    .brandIcon svg{
        width: 100%;
        height: 100%;
        display: block;
        fill: currentColor;
    }

    .title{
        min-width: 0;
        padding: 0.9vh 1.2vh;
        border-radius: 1.4vh;
        background: rgba(10, 14, 12, 0.18);
        border: 0.16vh solid rgba(255,255,255,0.08);
        backdrop-filter: blur(1.0vh);
        -webkit-backdrop-filter: blur(1.0vh);
    }

    .titleInner{
        display: flex;
        align-items: center;
        gap: 1.0vh;
        min-width: 0;
    }

    .titleText{
        display: flex;
        flex-direction: column;
        gap: 0.4vh;
        min-width: 0;
    }

    .brandIcon{
        width: 3.0vh;
        height: 3.0vh;
        display: grid;
        place-items: center;
        color: rgba(255,255,255,0.92);
        flex: 0 0 auto;
    }

    .brandIcon svg{
        width: 100%;
        height: 100%;
        display: block;
        fill: currentColor;
    }
  </style>
</head>

<body>
  <div id="root">
    <div id="hud" class="hud">
      <div class="card">
        <div class="topbar">
            <div class="title">
                <div class="titleInner">
                    <div class="brandIcon" aria-hidden="true">
                        <svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
                            <path d="M503.47 360.25c-1.56-.82-32.39-16.89-76.78-25.81 64.25-75.12 84.05-161.67 84.93-165.64 1.18-5.33-.44-10.9-4.3-14.77-3.03-3.04-7.12-4.7-11.32-4.7-1.14 0-2.29.12-3.44.38-3.88.85-86.54 19.59-160.58 79.76.01-1.46.01-2.93.01-4.4 0-118.79-59.98-213.72-62.53-217.7A15.973 15.973 0 0 0 256 0c-5.45 0-10.53 2.78-13.47 7.37-2.55 3.98-62.53 98.91-62.53 217.7 0 1.47.01 2.94.01 4.4-74.03-60.16-156.69-78.9-160.58-79.76-1.14-.25-2.29-.38-3.44-.38-4.2 0-8.29 1.66-11.32 4.7A15.986 15.986 0 0 0 .38 168.8c.88 3.97 20.68 90.52 84.93 165.64-44.39 8.92-75.21 24.99-76.78 25.81a16.003 16.003 0 0 0-.02 28.29c2.45 1.29 60.76 31.72 133.49 31.72 6.14 0 11.96-.1 17.5-.31-11.37 22.23-16.52 38.31-16.81 39.22-1.8 5.68-.29 11.89 3.91 16.11a16.019 16.019 0 0 0 16.1 3.99c1.83-.57 37.72-11.99 77.3-39.29V504c0 4.42 3.58 8 8 8h16c4.42 0 8-3.58 8-8v-64.01c39.58 27.3 75.47 38.71 77.3 39.29a16.019 16.019 0 0 0 16.1-3.99c4.2-4.22 5.71-10.43 3.91-16.11-.29-.91-5.45-16.99-16.81-39.22 5.54.21 11.37.31 17.5.31 72.72 0 131.04-30.43 133.49-31.72 5.24-2.78 8.52-8.22 8.51-14.15-.01-5.94-3.29-11.39-8.53-14.15z"></path>
                        </svg>
                    </div>

                    <div class="titleText">
                        <div class="brand" id="brand">CULTIVATION</div>
                        <div class="name" id="name">POT DE WEED</div>
                    </div>
                </div>
            </div>

            <div class="badge" id="stage">STAGE 1</div>
        </div>

        <div class="body">
          <div class="ringWrap">
            <div class="ringCenter">
              <div class="ringText">
                <div class="pct" id="waterPct">0%</div>
                <div class="sub">EAU</div>
              </div>
            </div>
          </div>

          <div class="stats">
            <div class="row">
              <div class="rowHead">
                <div class="label">Hydratation</div>
                <div class="value" id="waterText">0 / 100</div>
              </div>
              <div class="bar"><div class="fill" id="waterFill"></div></div>
              <div class="hint" id="hint">Arrose pour lancer la croissance.</div>
            </div>

            <div class="row">
              <div class="rowHead">
                <div class="label">Variété</div>
                <div class="value" id="variant">GREEN</div>
              </div>
              <div class="rowHead">
                <div class="label">Prochain stade</div>
                <div class="value" id="next">—</div>
              </div>
            </div>
          </div>
        </div>

        <div id="stateLine" class="stateLine">
          <div id="stateWrap" class="state">
            <div class="dot"></div>
            <div class="stateText" id="stateText">EN CROISSANCE</div>
          </div>
          <div class="timer" id="timer">—</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const hud = document.getElementById("hud")

    const el = {
      brand: document.getElementById("brand"),
      name: document.getElementById("name"),
      stage: document.getElementById("stage"),
      waterPct: document.getElementById("waterPct"),
      waterText: document.getElementById("waterText"),
      waterFill: document.getElementById("waterFill"),
      hint: document.getElementById("hint"),
      variant: document.getElementById("variant"),
      next: document.getElementById("next"),
      stateLine: document.getElementById("stateLine"),
      stateWrap: document.getElementById("stateWrap"),
      stateText: document.getElementById("stateText"),
      timer: document.getElementById("timer"),
    }

    const clamp = (v, a, b) => Math.max(a, Math.min(b, v))
    const upper = (s) => (s || "").toString().toUpperCase()

    function fmtTime(seconds){
        seconds = Math.max(0, Math.floor(seconds || 0))

        const h = Math.floor(seconds / 3600)
        const m = Math.floor((seconds % 3600) / 60)
        const s = seconds % 60

        if (h > 0) return `${h}h ${m}m`
        if (m > 0) return `${m}m ${s}s`
        return `${s}s`
    }

    function setState(mode){
      el.stateWrap.classList.remove("warn", "danger")
      if (mode === "warn") el.stateWrap.classList.add("warn")
      if (mode === "danger") el.stateWrap.classList.add("danger")
    }

    function render(data){
      const show = !!data?.show
      if (!show){
        hud.classList.remove("show")
        return
      }

      hud.style.left = (clamp(data.x, 0, 100)).toFixed(3) + "%"
      hud.style.top  = (clamp(data.y, 0, 100)).toFixed(3) + "%"
      hud.classList.add("show")

      const stage = Number(data.stage || 1)
      const water = Number(data.water || 0)
      const maxWater = Number(data.maxWater || 100)
      const need = Number(data.needWater || 60)
      const pct = clamp((maxWater > 0 ? (water / maxWater) : 0) * 100, 0, 100)
      const minGrow = Number(data.minWaterToGrow || (maxWater * 0.5))

      el.brand.textContent = upper(data.brand || "CULTIVATION")
      el.name.textContent = upper(data.title || "POT DE WEED")
      el.stage.textContent = `STAGE ${stage}`
      el.variant.textContent = upper(data.variant || "GREEN")

      el.waterPct.textContent = `${Math.round(pct)}%`
      el.waterText.textContent = `${Math.min(water, maxWater)} / ${maxWater}`
      el.waterFill.style.width = pct.toFixed(2) + "%"

    const now = Number(data.serverTime || data.now || 0)
    const nextAt = Number(data.nextStageAt || 0)

    let remaining = 0
    if (nextAt > 0 && now > 0){
        remaining = Math.max(0, nextAt - now)
    }

      if (stage >= 3){
        el.next.textContent = "PRÊT"
        el.hint.textContent = "Récolte disponible."
        el.stateText.textContent = "MATURE"
        el.timer.textContent = "—"
        setState("warn")
      } else if (nextAt > 0) {
          el.next.textContent = "EN COURS"

          if (water < minGrow){
              el.hint.textContent = "Croissance en pause (hydratation < 50%)."
              el.stateText.textContent = "PAUSE"
              el.timer.textContent = fmtTime(remaining)
              setState("danger")
          } else {
              el.hint.textContent = "Patiente… la croissance est lancée."
              el.stateText.textContent = "EN CROISSANCE"
              el.timer.textContent = fmtTime(remaining)
              setState("ok")
          }
      } else {
        el.next.textContent = "—"
        if (water >= need){
          el.hint.textContent = "Croissance prête à démarrer."
          el.stateText.textContent = "OK"
          setState("ok")
        } else {
          el.hint.textContent = `Arrose encore (${need} requis).`
          el.stateText.textContent = "SOIF"
          el.timer.textContent = "—"
          setState("danger")
        }
      }
    }

    window.addEventListener("message", (event) => {
      const data = event.data
      if (!data || data.type !== "weedpot_hud") return
      render(data.payload || {})
    })

    render({ show: false })
  </script>
</body>
</html>
